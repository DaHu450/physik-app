function updateBar(){$('#l-bar').style.width=(100*L.done.size/L.lv.cards.length)+'%';$('#l-xp').textContent=L.xp+' XP';}
function openLesson(id,fresh){const lv=LEVELS[id];L={id,lv,queue:lv.cards.map((_,i)=>i),pos:0,first:{},done:new Set(),sim:null,xp:0,phase:'answer'};const cu=prog.cur;if(!fresh&&cu&&cu.id===id&&Array.isArray(cu.queue)){L.queue=cu.queue;L.pos=Math.min(cu.pos,cu.queue.length);L.first=cu.first||{};L.done=new Set(cu.done||[]);L.xp=cu.xp||0;}else{prog.cur={id,queue:L.queue.slice(),pos:0,first:{},done:[],xp:0};save();}$('#lesson').hidden=false;document.body.style.overflow='hidden';renderCard();}
function closeLesson(){if(L&&L.sim)L.sim.destroy();if(L&&L.extra)L.extra.forEach(x=>x.destroy());L=null;$('#lesson').hidden=true;document.body.style.overflow='';renderPath();}
$('#l-close').addEventListener('click',closeLesson);
$('#l-btn').addEventListener('click',()=>{if(!L)return;if(L.phase==='answer'&&L.onCheck)L.onCheck();else if(L.phase==='result')closeLesson();else{L.pos++;renderCard();}snapLesson();});
function record(idx,val){if(!(idx in L.first)){L.first[idx]=val;L.xp+=val*10;}}
function addSim(box,spec,o){if(L.sim){L.sim.destroy();L.sim=null;}L.sim=SIMS[spec.type](box,Object.assign({},spec,o||{}));}
function renderCard(){
  if(L.sim){L.sim.destroy();L.sim=null;}
  (L.extra||[]).forEach(x=>x.destroy());L.extra=[];
  const body=$('#l-body');body.innerHTML='';body.scrollTop=0;updateBar();
  if(L.pos>=L.queue.length)return finishLesson();
  const idx=L.queue[L.pos],card=L.lv.cards[idx];L.phase='answer';L.onCheck=null;
  const inner=document.createElement('div');inner.className='l-inner';body.append(inner);
  const kick=document.createElement('div');kick.className='kicker';kick.textContent=card.kicker||(NAMES[L.id]||LEVELS[L.id].title);inner.append(kick);
  const H=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;inner.append(d);return d;};
  if(card.t==='info'){H('q',card.title);if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}H('txt',card.html);
    L.phase='next';L.done.add(idx);setFoot('','Weiter',true);updateBar();return;}
  if(card.t==='exp'){H('q',card.title);const e=H('exp',`<div><h3>Material</h3><ul>${card.material.map(m=>`<li>${m}</li>`).join('')}</ul></div><div><h3>Durchführung</h3><ol>${card.steps.map(m=>`<li>${m}</li>`).join('')}</ol></div>${card.note?`<div class="note">${card.note}</div>`:''}`);
    const lab=document.createElement('label');lab.className='check';lab.innerHTML='<input type="checkbox" id="expdone"> '+(card.check||'Wir haben den Versuch durchgeführt.');inner.append(lab);
    L.phase='next';setFoot(card.check?'Hak ab, wenn du fertig bist.':'Führe den Versuch an deiner Station durch.','Weiter',false);
    $('#expdone').addEventListener('change',ev=>{$('#l-btn').disabled=!ev.target.checked;if(ev.target.checked){L.done.add(idx);updateBar();}});return;}
  if(card.t==='tf'||card.t==='who'||card.t==='pick'){
    if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}
    let opts,ans;
    if(card.t==='tf'){H('q','Stimmt das?');H('claim','„'+card.claim+'“');opts=['Stimmt','Stimmt nicht'];ans=card.ok?0:1;}
    else if(card.t==='who'){H('q',card.q);H('hint','Wer hat recht?');opts=card.people;ans=card.a;}
    else{H('q',card.q);opts=card.opts;ans=card.a;}
    const box=H(card.t==='tf'?'tfrow':card.t==='pick'?'picks':'opts','');let sel=null;
    const order=card.t==='tf'?[0,1]:shuffle(opts.map((_,i)=>i));
    order.forEach((i,k)=>{const b=document.createElement('button');b.type='button';b.dataset.i=i;b.setAttribute('aria-pressed','false');
      if(card.t==='tf'){b.className='opt tf';b.textContent=opts[i];}
      else if(card.t==='who'){b.className='opt bubble';b.innerHTML=`<span class="av">${opts[i][0][0]}</span><span><b>${opts[i][0]}:</b> „${opts[i][1]}“</span>`;}
      else{b.className='opt pick';b.setAttribute('aria-label','Bild '+String.fromCharCode(65+k));const lab=document.createElement('span');lab.className='plab';lab.textContent=String.fromCharCode(65+k);b.append(lab);L.extra.push(sceneSim(b,{scene:opts[i]}));}
      b.onclick=()=>{if(b.disabled)return;box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sel=i;$('#l-btn').disabled=false;};box.append(b);});
    setFoot('','Prüfen',false);
    L.onCheck=()=>{const ok=sel===ans;record(idx,ok?1:0);box.querySelectorAll('button').forEach(x=>{x.disabled=true;const i=+x.dataset.i;if(i===ans)x.classList.add('right');else if(i===sel)x.classList.add('wrong');});
      if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      const right=card.t==='tf'?opts[ans]:card.t==='who'?opts[ans][0]+' hat recht':'Bild '+String.fromCharCode(65+order.indexOf(ans));
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?'':'Richtig ist: '+right+'. '}${card.why||''}${ok?'':' Die Aufgabe kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='mc'){if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}H('q',card.q);
    const box=H('opts','');const order=shuffle(card.opts.map((_,i)=>i));let sel=null;
    order.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=card.opts[i];b.dataset.i=i;b.setAttribute('aria-pressed','false');
      b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sel=i;$('#l-btn').disabled=false;};box.append(b);});
    setFoot('','Prüfen',false);
    L.onCheck=()=>{const ok=sel===card.a;record(idx,ok?1:0);box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const i=+x.dataset.i;if(i===card.a)x.classList.add('right');else if(i===sel)x.classList.add('wrong');});
      if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?(card.why||''):'Richtig ist: '+card.opts[card.a]+'. '+(card.why||'')+' Die Frage kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='sort'){H('q',card.q);const box=H('sort','');const ans={};const items=shuffle(card.items.map((x,i)=>i));
    const optsOf=i=>card.items[i][2]||card.cats;
    items.forEach(i=>{const [label]=card.items[i];const row=document.createElement('div');row.className='srow';row.innerHTML=`<span>${label}</span>`;
      const g=seg(row,'',optsOf(i).map((c,k)=>[k,c]),-1,v=>{ans[i]=v;$('#l-btn').disabled=Object.keys(ans).length<card.items.length;});g.querySelector('.seg-l').remove();row.dataset.i=i;box.append(row);});
    setFoot('Ordne jede Zeile zu.','Prüfen',false);
    L.onCheck=()=>{let c=0;box.querySelectorAll('.srow').forEach(r=>{const i=+r.dataset.i;const ok=ans[i]===card.items[i][1];if(ok)c++;r.classList.add(ok?'right':'wrong');r.querySelectorAll('button').forEach(b=>b.disabled=true);
        if(!ok){const f=document.createElement('span');f.className='fix';f.textContent='→ '+optsOf(i)[card.items[i][1]];r.append(f);}});
      record(idx,c);L.done.add(idx);updateBar();L.phase='next';const all=c===card.items.length;
      setFoot(`<strong>${all?'Alles richtig!':c+' von '+card.items.length+' richtig'}</strong><span>${card.why||(all?'':'Schau dir die markierten Zeilen an.')}</span>`,'Weiter',true,all?'ok':'bad');};return;}
  if(card.t==='text'){if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}H('q',card.q);
    H('textin',`<input id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${card.help||'Antwort eintippen'}" aria-label="Antwort">`);
    const inp=$('#tin');inp.addEventListener('input',()=>{$('#l-btn').disabled=!inp.value.trim();});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()&&L.phase==='answer'){e.preventDefault();L.onCheck();}});
    setFoot('','Prüfen',false);setTimeout(()=>{try{inp.focus();}catch(_){}},60);
    L.onCheck=()=>{const n=norm(inp.value);const ok=card.kw?card.kw.every(g=>g.some(k=>n.includes(norm(k)))):card.accept.some(a=>norm(a)===n);
      record(idx,ok?1:0);inp.disabled=true;inp.classList.add(ok?'right':'wrong');if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?'':'Gesucht war: <b>'+card.accept[0]+'</b>. '}${card.why||''}${ok?'':' Die Frage kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='scale'){H('q',card.q);if(card.intro)H('txt',card.intro);
    H('scale',`<output id="sval" aria-live="polite">Schieberegler bewegen</output><input id="srange" type="range" min="${card.min}" max="${card.max}" step="1" value="0" aria-label="Ladung in Elementarladungen"><div class="ticks"><span>${fmtQ(card.min)}</span><span>0</span><span>${fmtQ(card.max)}</span></div>`);
    const r=$('#srange'),o=$('#sval');
    r.addEventListener('input',()=>{const v=+r.value;o.textContent=fmtQ(v);o.className=v>0?'pos':v<0?'neg':'';$('#l-btn').disabled=false;});
    setFoot('','Prüfen',false);
    L.onCheck=()=>{const v=+r.value,ok=v===card.a;record(idx,ok?1:0);r.disabled=true;if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?'':'Richtig ist: '+fmtQ(card.a)+'. '}${card.why||''}${ok?'':' Die Frage kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='order'){H('q',card.q);const list=H('order','');let cur=shuffle(card.steps.map((_,i)=>i));if(cur.every((v,i)=>v===i))cur.reverse();
    const draw=()=>{list.innerHTML='';cur.forEach((si,pos)=>{const row=document.createElement('div');row.className='orow';row.innerHTML=`<span class="onum">${pos+1}</span><span class="otxt">${card.steps[si]}</span>`;
      const mk=(lab,dis,fn,al)=>{const b=document.createElement('button');b.type='button';b.className='obtn';b.textContent=lab;b.setAttribute('aria-label',al);b.disabled=dis||L.phase!=='answer';b.onclick=fn;row.append(b);};
      mk('↑',pos===0,()=>{[cur[pos-1],cur[pos]]=[cur[pos],cur[pos-1]];draw();},'nach oben');
      mk('↓',pos===cur.length-1,()=>{[cur[pos+1],cur[pos]]=[cur[pos],cur[pos+1]];draw();},'nach unten');list.append(row);});};
    draw();setFoot('Bringe die Schritte mit den Pfeilen in die richtige Reihenfolge.','Prüfen',true);
    L.onCheck=()=>{const ok=cur.every((v,i)=>v===i);record(idx,ok?1:0);L.done.add(idx);L.phase='next';draw();
      list.querySelectorAll('.orow').forEach((r,i)=>r.classList.add(cur[i]===i?'right':'wrong'));
      if(!ok)H('solution','<b>Richtige Reihenfolge:</b><ol>'+card.steps.map(s=>`<li>${s}</li>`).join('')+'</ol>');
      updateBar();setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${card.why||''}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='multi'){if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}H('q',card.q);H('hint','Mehrere Antworten können richtig sein.');
    const box=H('opts','');const sel=new Set();
    shuffle(card.opts.map((_,i)=>i)).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='opt multi';b.textContent=card.opts[i];b.dataset.i=i;b.setAttribute('aria-pressed','false');
      b.onclick=()=>{if(sel.has(i))sel.delete(i);else sel.add(i);b.setAttribute('aria-pressed',String(sel.has(i)));$('#l-btn').disabled=!sel.size;};box.append(b);});
    setFoot('','Prüfen',false);
    L.onCheck=()=>{const cs=new Set(card.correct);const ok=sel.size===cs.size&&[...sel].every(i=>cs.has(i));record(idx,ok?1:0);
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const i=+x.dataset.i;if(cs.has(i))x.classList.add('right');else if(sel.has(i))x.classList.add('wrong');});
      if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?'':'Grün markiert sind alle richtigen Antworten. '}${card.why||''}${ok?'':' Die Frage kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='drag'){H('q',card.q);H('hint','Ziehe die Begriffe in die Felder. Oder tippe erst einen Begriff und dann ein Feld an.');
    const bank=H('bank',''),slots=H('slots','');const chips=shuffle(card.chips);const filled=Array(card.slots.length).fill(null);let picked=null;
    const drawAll=()=>{bank.innerHTML='';const avail=card.reuse?chips:chips.filter(c=>!filled.includes(c));
      avail.forEach(cv=>{const b=document.createElement('button');b.type='button';b.className='chip'+(picked===cv?' picked':'');b.textContent=cv;b.draggable=true;
        b.addEventListener('dragstart',e=>{try{e.dataTransfer.setData('text/plain',cv);}catch(_){}picked=cv;});b.onclick=()=>{picked=picked===cv?null:cv;drawAll();};bank.append(b);});
      if(!avail.length){const s=document.createElement('span');s.className='hint';s.textContent='Alle Begriffe verteilt. Tippe ein Feld an, um es zu leeren.';bank.append(s);}
      slots.innerHTML='';card.slots.forEach(([prompt],k)=>{const row=document.createElement('div');row.className='slotrow';row.dataset.k=k;
        const p=document.createElement('span');p.className='sprompt';p.textContent=prompt;
        const z=document.createElement('button');z.type='button';z.className='slot'+(filled[k]?' filled':'');z.textContent=filled[k]||'hierher ziehen';
        z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();let cv='';try{cv=e.dataTransfer.getData('text/plain');}catch(_){}cv=cv||picked;if(cv){filled[k]=cv;picked=null;drawAll();}});
        z.onclick=()=>{if(picked){filled[k]=picked;picked=null;}else filled[k]=null;drawAll();};row.append(p,z);slots.append(row);});
      $('#l-btn').disabled=filled.some(f=>!f);};
    setFoot('','Prüfen',false);drawAll();
    L.onCheck=()=>{let c=0;slots.querySelectorAll('.slotrow').forEach(r=>{const k=+r.dataset.k;const ok=filled[k]===card.slots[k][1];if(ok)c++;r.classList.add(ok?'right':'wrong');r.querySelector('.slot').disabled=true;
        if(!ok){const f=document.createElement('span');f.className='fix';f.textContent='→ '+card.slots[k][1];r.append(f);}});
      bank.querySelectorAll('button').forEach(b=>b.disabled=true);record(idx,c);L.done.add(idx);updateBar();L.phase='next';const all=c===card.slots.length;
      setFoot(`<strong>${all?'Alles richtig!':c+' von '+card.slots.length+' richtig'}</strong><span>${card.why||''}</span>`,'Weiter',true,all?'ok':'bad');};return;}
  if(card.t==='gap'){H('q',card.sum?'Ergebnissicherung: '+card.title:card.title);H('txt','<p>Wähle die passenden Begriffe. Dieser Text kommt in deine Zusammenfassung.</p>');
    const g=H('gap','');let html='',n=0;const parts=card.text.split(/(\{\{[^}]+\}\})/);
    parts.forEach(p=>{const m=p.match(/^\{\{([^}]+)\}\}$/);if(!m){html+=p.replace(/</g,'&lt;');return;}const opts=m[1].split('|');const sh=shuffle(opts);
      html+=`<select data-a="${opts[0].replace(/"/g,'&quot;')}" aria-label="Lücke ${n+1}"><option value="">…</option>${sh.map(o=>`<option>${o}</option>`).join('')}</select>`;n++;});
    g.innerHTML=html;if(card.fml&&card.fml.length)H('fbox',card.fml.map(F).join(''));const sels=[...g.querySelectorAll('select')];
    sels.forEach(s=>s.addEventListener('change',()=>{$('#l-btn').disabled=sels.some(x=>!x.value);}));
    setFoot('Fülle alle Lücken aus.','Prüfen',false);
    L.onCheck=()=>{let c=0;sels.forEach(s=>{const ok=s.value===s.dataset.a;if(ok)c++;s.classList.add(ok?'right':'wrong');s.disabled=true;if(!ok){const f=document.createElement('span');f.className='fix';f.textContent='→ '+s.dataset.a;s.after(f);}});
      record(idx,c);L.done.add(idx);updateBar();L.phase='next';const all=c===sels.length;
      setFoot(`<strong>${all?'Perfekt!':c+' von '+sels.length+' Lücken richtig'}</strong><span>${all?'Dein Merksatz ist gespeichert.':'Die richtigen Begriffe stehen in Grün daneben.'}</span>`,'Weiter',true,all?'ok':'bad');};return;}
  if(card.t==='num'){if(card.sim){const b=document.createElement('div');inner.append(b);addSim(b,card.sim);}H('q',card.q);if(card.intro)H('txt',card.intro);
    H('textin',`<div class="numrow"><input id="tin" type="text" inputmode="decimal" autocomplete="off" placeholder="Zahl eintippen" aria-label="Ergebnis in ${card.unit}"><span class="unitlbl">${card.unit}</span></div><div class="hint">Komma oder Punkt ist egal. Runde sinnvoll.</div>`);
    const inp=$('#tin');inp.addEventListener('input',()=>{$('#l-btn').disabled=!inp.value.trim();});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()&&L.phase==='answer'){e.preventDefault();L.onCheck();}});
    setFoot('','Prüfen',false);setTimeout(()=>{try{inp.focus();}catch(_){}},60);
    const parse=s=>{s=s.replace(/\s/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'));};
    const fmt=v=>String(v).replace('.',',');
    L.onCheck=()=>{const v=parse(inp.value);const ok=isFinite(v)&&Math.abs(v-card.a)<=Math.abs(card.a)*(card.tol||.03);
      record(idx,ok?1:0);inp.disabled=true;inp.classList.add(ok?'right':'wrong');if(ok)L.done.add(idx);else L.queue.push(idx);updateBar();L.phase='next';
      setFoot(`<strong>${ok?'Richtig!':'Nicht ganz.'}</strong><span>${ok?'':'Richtig ist etwa <b>'+fmt(card.a)+' '+card.unit+'</b>. '}${card.why||''}${ok?'':' Die Aufgabe kommt später noch einmal.'}</span>`,'Weiter',true,ok?'ok':'bad');};return;}
  if(card.t==='poll'){H('kicker','Deine Vermutung');H('q',card.q);const box=H('opts','');let sel=null;
    card.opts.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='opt poll';b.textContent=t;b.setAttribute('aria-pressed','false');
      b.onclick=()=>{if(b.disabled)return;box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sel=i;$('#l-btn').disabled=false;};box.append(b);});
    setFoot('Hier gibt es kein Richtig oder Falsch.','Festlegen',false);
    L.onCheck=()=>{box.querySelectorAll('.opt').forEach(x=>x.disabled=true);L.done.add(idx);updateBar();L.phase='next';
      setFoot('<strong>Vermutung notiert.</strong><span>Prüf sie gleich in der Simulation.</span>','Weiter',true,'');};return;}
  if(card.t==='goal'){H('q',card.q);const b=document.createElement('div');inner.append(b);addSim(b,card.sim,{challenge:true});
    setFoot('','Prüfen',true);
    L.onCheck=()=>{const ok=L.sim.check();record(idx,ok?1:0);
      if(ok){L.done.add(idx);updateBar();L.phase='next';setFoot(`<strong>Richtig!</strong><span>${card.why}</span>`,'Weiter',true,'ok');}
      else setFoot(`<strong>Noch nicht.</strong><span>Tipp: ${card.hint}</span>`,'Nochmal prüfen',true,'bad');};return;}
}
function finishLesson(){
  const lv=L.lv,correct=Object.values(L.first).reduce((a,b)=>a+b,0),tot=lv.total;const pct=tot?correct/tot:1;const xp=correct*10+20;
  const p=prog.levels[L.id];if(!p||correct>p.best||!p.done)prog.levels[L.id]={best:Math.max(correct,p?p.best:0),xp:Math.max(xp,p?p.xp:0),done:true};delete prog.cur;save();
  $('#l-bar').style.width='100%';
  const body=$('#l-body');body.innerHTML=`<div class="l-inner"><div class="result">${pct>=.9?CASTLE.replace('class="cs"','class="cs" style="width:90px;height:82px"'):''}<h2>${pct>=.9?'Level geschafft!':'Level beendet'}</h2>
    <div class="stats"><div class="stat gold"><b>+${xp}</b><span>XP</span></div><div class="stat green"><b>${Math.round(pct*100)} %</b><span>beim ersten Versuch richtig</span></div></div>
    <p class="hint">${pct>=.9?'Super, weiter so!':'Für das Schloss brauchst du insgesamt 90 %. Du kannst dieses Level jederzeit wiederholen.'}</p>
    <button class="ghost" id="again">Level wiederholen</button><p class="hint" style="margin-top:14px">Dein Fortschrittscode für den Notfall: <b style="font-family:monospace;font-size:1.05rem">${progCode()}</b><br>Am besten kurz abfotografieren.</p></div></div>`;
  $('#again').onclick=()=>openLesson(L.id,true);
  L.phase='result';setFoot('','Zurück zum Pfad',true,pct>=.9?'ok':'');
}

renderPath();

/* ===== Anbindung an die Klassen-App (ohne Namen!) ===== */
if(window.AppBridge){
  setTimeout(()=>{appLive=true;},1500);
  AppBridge.register({
    getState(){
      const t=totals(),details={},nm=id=>NAMES[id]||LEVELS[id].title;
      ORDER.forEach(id=>{const p=prog.levels[id];details[nm(id)]=p&&p.done?('geschafft · '+p.best+' von '+LEVELS[id].total+' richtig'):'offen';});
      return{punkte:t.xp,stationen:ORDER.map(nm),erledigt:ORDER.filter(isDone).map(nm),details,
        daten:{levels:JSON.parse(JSON.stringify(prog.levels))}};
    },
    setState(s){const d=s&&s.daten;if(!d||!d.levels)return;
      prog.levels=d.levels;delete prog.cur;appLive=true;save();if(!L)renderPath();}
  });
}
