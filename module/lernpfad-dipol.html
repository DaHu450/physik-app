<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Lernpfad Hertz’scher Dipol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: schmaler, zentrierter Lernpfad (Knoten in Schlangenlinie), Kapitel 2 teilt sich in drei Spalten; Level öffnen sich als Vollbild-Lektion. Farbcode: Rot = elektrisches Feld / positive Ladung, Blau = magnetisches Feld / Elektron, Gold = Dipol, Strom, XP. */
:root{
  --bg:#fdf6e0; --surface:#fffdf6; --ink:#1e2b22; --muted:#6b634d; --line:#efdfb0;
  --neg:#1d6ae5; --negdeep:#1450b3; --pos:#e2434b; --gold:#e9a400; --golddeep:#b77f00;
  --ok:#23904a; --okbg:#e0f5e4; --bad:#d3343b; --badbg:#fde7e8;
  --ui:#2f9e5b; --uideep:#1f7743; --warm:#f2873a; --warmdeep:#c4631c; --sun:#ffd54a; --sundeep:#d9a90d; --simbg:#e9f6e2;
  --metal:#c9d3e0; --insul:#efe0c2; --cloth:#cdbdea; --balloon:#ffc9d1; --locked:#f1e3b8; --lockeddeep:#d8c27f;
  --fd:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --fb:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10201a; --surface:#182b23; --ink:#eaf3ec; --muted:#a8bdb0; --line:#2c4438;
  --neg:#4f97ff; --negdeep:#2c6fd6; --pos:#ff6369; --gold:#ffc23a; --golddeep:#c99000;
  --ok:#4fcf73; --okbg:#173a25; --bad:#ff6b70; --badbg:#3d1d22;
  --ui:#33a462; --uideep:#237a47; --warm:#ff9a52; --warmdeep:#c96a22; --sun:#ffd54a; --sundeep:#c99a10; --simbg:#15261f;
  --metal:#33445e; --insul:#4a4030; --cloth:#4e4174; --balloon:#6d3442; --locked:#2d4237; --lockeddeep:#1f2f27;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10201a; --surface:#182b23; --ink:#eaf3ec; --muted:#a8bdb0; --line:#2c4438;
  --neg:#4f97ff; --negdeep:#2c6fd6; --pos:#ff6369; --gold:#ffc23a; --golddeep:#c99000;
  --ok:#4fcf73; --okbg:#173a25; --bad:#ff6b70; --badbg:#3d1d22;
  --ui:#33a462; --uideep:#237a47; --warm:#ff9a52; --warmdeep:#c96a22; --sun:#ffd54a; --sundeep:#c99a10; --simbg:#15261f;
  --metal:#33445e; --insul:#4a4030; --cloth:#4e4174; --balloon:#6d3442; --locked:#2d4237; --lockeddeep:#1f2f27;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sun)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:1.45rem;font-weight:800;color:var(--uideep)}
:root[data-theme="dark"] .brand h1{color:var(--ui)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand h1{color:var(--ui)}}
.brand span{font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.xp{color:var(--golddeep)}
:root[data-theme="dark"] .pill.xp{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.xp{color:var(--gold)}}

/* Pfad */
.unit{margin-top:28px}
.banner{border-radius:18px;padding:14px 18px;color:#fff;background:var(--ui);box-shadow:0 4px 0 var(--uideep)}
.banner h2{font-size:1.3rem;font-weight:800}
.banner p{margin:4px 0 0;font-size:.92rem;opacity:.95;max-width:60ch}
.banner.b2{background:var(--warm);box-shadow:0 4px 0 var(--warmdeep)}
.banner.b3{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 var(--sundeep)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 6px}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.node{width:74px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ui);color:#fff;box-shadow:0 6px 0 var(--uideep);transition:transform .08s}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--uideep)}
.node.done{background:var(--sun);box-shadow:0 6px 0 var(--golddeep);color:#3b2a00}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--lockeddeep);color:var(--muted);cursor:not-allowed}
.node.open{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:6px solid color-mix(in srgb,var(--ui) 25%,transparent)}}
.stop-l{font-weight:600;font-size:.88rem;text-align:center;line-height:1.25}
.stop-l small{display:block;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px 18px;min-width:0}
.branch h3{font-size:1.08rem;text-align:center;font-weight:700}
.branch .seats{display:block;text-align:center;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.branch .nodes{padding-top:14px}
.branch .stop{width:100%}
.fork{display:flex;justify-content:center;margin-top:10px;color:var(--muted)}
.fork svg{width:200px;max-width:100%;height:40px}
@media (max-width:520px){.node{width:60px;height:57px}.node svg{width:26px;height:26px}.stop-l{font-size:.8rem}.branch h3{font-size:.95rem}}

/* Schloss */
.castle{margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:grid;gap:14px;justify-items:center;text-align:center}
.castle svg.cs{width:120px;height:110px}
.castle.locked svg.cs{opacity:.45}
.castle h2{font-size:1.5rem;font-weight:800}
.castle p{margin:0;color:var(--muted);max-width:52ch}
.meter{width:100%;max-width:380px;height:14px;border-radius:999px;background:var(--bg);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.meter b{position:absolute;top:-4px;bottom:-4px;left:90%;width:2px;background:var(--ink)}
.namefield{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.namefield input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:280px}
.summary{text-align:left;width:100%;background:var(--bg);border-radius:14px;padding:14px 16px;max-height:75vh;overflow:auto}
.summary h3{font-size:1.05rem;margin-top:10px}
.summary h3:first-child{margin-top:0}
.summary p{color:var(--ink);margin:4px 0 0;max-width:none}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}

.footer{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

/* Buttons */
.big{border:0;border-radius:14px;padding:12px 26px;font-weight:700;font-family:var(--fd);font-size:1.15rem;letter-spacing:.02em;background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 65%,#000);min-width:150px}
.big:disabled{background:var(--locked);box-shadow:0 4px 0 var(--lockeddeep);color:var(--muted);cursor:not-allowed}
.big.blue{background:var(--ui);box-shadow:0 4px 0 var(--uideep)}
.big.red{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 65%,#000)}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600}

/* Lektion */
.lesson{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));max-width:820px;width:100%;margin:0 auto}
.l-close{border:0;background:none;font-size:1.8rem;line-height:1;color:var(--muted);padding:2px 8px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .3s}
.l-body{flex:1;overflow-y:auto;overflow-x:hidden}
.l-inner{max-width:780px;margin:0 auto;padding-block:8px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.q{font-family:var(--fd);font-size:1.45rem;font-weight:700;line-height:1.2;text-wrap:balance}
.txt p{margin:0 0 8px;max-width:65ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--ui);background:color-mix(in srgb,var(--ui) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.l-foot{border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.l-foot.ok{background:var(--okbg);border-color:transparent}
.l-foot.bad{background:var(--badbg);border-color:transparent}
.foot-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.l-msg{flex:1;min-width:220px}
.l-msg strong{font-family:var(--fd);font-size:1.25rem;display:block}
.l-foot.ok .l-msg strong{color:var(--ok)}
.l-foot.bad .l-msg strong{color:var(--bad)}
.l-msg span{font-size:.92rem}

/* Lückentext, Zuordnen, Versuch */
.gap{font-size:1.05rem;line-height:2.3;background:var(--bg);border-radius:14px;padding:12px 16px}
.gap select{font:inherit;font-size:.95rem;padding:2px 6px;border-radius:8px;border:2px solid var(--ui);background:var(--surface);color:var(--ink);max-width:100%}
.gap select.right{border-color:var(--ok);background:var(--okbg)}
.gap select.wrong{border-color:var(--bad);background:var(--badbg)}
.gap .fix{color:var(--ok);font-weight:600;font-size:.9rem;margin-left:4px}
.sort{display:grid;gap:8px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.srow.right{border-color:var(--ok)}
.srow.wrong{border-color:var(--bad)}
.srow span{font-weight:600}
.srow .seg button{padding:6px 12px}
.srow > span:first-child{flex:1;min-width:180px}
.fix{color:var(--ok);font-weight:600;font-size:.9rem}
.textin{display:grid;gap:6px}
.textin input{font:inherit;font-size:1.15rem;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.textin input.right{border-color:var(--ok);background:var(--okbg)}
.textin input.wrong{border-color:var(--bad);background:var(--badbg)}
.scale{display:grid;gap:10px;background:var(--bg);border-radius:16px;padding:18px 16px}
.scale output{font-family:var(--fd);font-size:2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;min-height:1.3em}
.scale output.pos{color:var(--pos)}
.scale output.neg{color:var(--ui)}
.scale input{width:100%;accent-color:var(--ui);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.order{display:grid;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.orow.right{border-color:var(--ok)}
.orow.wrong{border-color:var(--bad)}
.onum{font-family:var(--fd);font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ui);color:#fff;flex:none}
.otxt{flex:1;min-width:0}
.obtn{border:0;background:var(--surface);border-radius:8px;width:38px;height:38px;font-size:1.1rem;font-weight:700;flex:none}
.obtn:disabled{opacity:.3;cursor:default}
.solution{background:var(--okbg);border-radius:12px;padding:10px 14px;font-size:.92rem}
.solution ol{margin:4px 0 0;padding-left:20px}
.opt.multi{display:flex;gap:10px;align-items:flex-start}
.opt.multi::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);margin-top:2px;background:var(--surface)}
.opt.multi[aria-pressed="true"]::before{background:var(--ui);border-color:var(--ui);box-shadow:inset 0 0 0 3px var(--surface)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--bg);border-radius:14px;padding:10px;align-items:center}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600;cursor:grab}
.chip.picked{border-color:var(--ui);background:color-mix(in srgb,var(--ui) 14%,var(--surface))}
.slots{display:grid;gap:8px}
.slotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.slotrow.right{border-color:var(--ok)}
.slotrow.wrong{border-color:var(--bad)}
.sprompt{flex:1;min-width:180px}
.slot{min-width:150px;padding:8px 12px;border-radius:10px;border:2px dashed var(--ui);background:var(--surface);font-weight:600;color:var(--muted)}
.slot.filled{border-style:solid;color:var(--ink)}
.sim-ctrl:empty{display:none}
.claim{font-family:var(--fd);font-size:1.3rem;font-weight:600;background:var(--bg);border-left:6px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;line-height:1.3}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.tf{text-align:center;font-weight:700;font-size:1.1rem;padding:16px}
.opt.bubble{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ui);color:#fff;font-weight:700;font-family:var(--fd)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt.pick{padding:6px;display:grid;gap:4px}
.opt.pick .sim{padding:0;background:none}
.plab{font-family:var(--fd);font-weight:800;font-size:1.1rem;padding-left:6px}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.rule>div{background:var(--bg);border-radius:14px;padding:14px 16px;line-height:1.5}
.rule b{font-family:var(--fd);font-size:1.1rem}
.exp{background:var(--bg);border-radius:16px;padding:16px;display:grid;gap:10px}
.exp h3{font-size:1.05rem}
.exp ul,.exp ol{margin:0;padding-left:22px}
.exp li{margin:3px 0}
.note{border-left:4px solid var(--gold);padding:6px 10px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:0 10px 10px 0;font-size:.92rem}
.check{display:flex;gap:10px;align-items:center;font-weight:600;padding:10px 12px;border:2px dashed var(--line);border-radius:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}

/* Simulation */
.sim{display:grid;gap:8px;background:var(--simbg);border-radius:16px;padding:10px}
.sim-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim-canvas{width:100%;display:block;border-radius:12px;background:var(--surface)}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg-l{font-size:.78rem;color:var(--muted);padding:0 6px;font-weight:600}
.seg button{border:0;background:none;border-radius:9px;padding:6px 10px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ui);color:#fff}
.sbtn{border:0;border-radius:10px;padding:8px 12px;font-size:.86rem;font-weight:600;background:var(--surface);color:var(--ink)}
.sbtn[aria-pressed="true"]{background:var(--gold);color:#3b2a00}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer}
.tgl input{accent-color:var(--ui)}
.hint{font-size:.82rem;color:var(--muted)}

.result{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:30px}
.result h2{font-size:2rem;font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px 18px;min-width:120px}
.stat b{display:block;font-family:var(--fd);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.gold b{color:var(--golddeep)}
.stat.green b{color:var(--ok)}
.exp a{color:var(--ui);font-weight:600}
.numrow{display:flex;gap:10px;align-items:center}
.numrow input{flex:1}
.unitlbl{font-family:var(--fd);font-weight:700;font-size:1.2rem;min-width:3ch}
.sfigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:8px 0}
.sfigs figure{margin:0;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)}
.sfigs img{width:100%;display:block;border-radius:8px}
.sfigs figcaption{font-size:.78rem;color:#33402f;margin-top:4px;line-height:1.35}
.resume{background:var(--okbg);border:2px solid var(--ui);border-radius:14px;padding:10px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.resume.warn{background:#fff3cd;border-color:var(--sundeep);color:#3b2a00}
.resume .big{padding:8px 16px}
.fbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--surface);border:2px solid var(--sun);border-radius:12px;padding:8px 16px;margin:6px 0;width:fit-content;max-width:100%}
.fml img{max-width:100%}
.summary .msatz{background:var(--surface);border-left:5px solid var(--ui);border-radius:0 10px 10px 0;padding:8px 12px}
.opt.poll[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
@media (prefers-reduced-motion: reduce){.node.open{animation:none}.bar span{transition:none}}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Farben für Canvas ---------- */
const P={};
function readPal(){const cs=getComputedStyle(document.documentElement);['bg','surface','ink','muted','line','neg','pos','gold','golddeep','ok','bad','metal','insul','cloth','balloon'].forEach(k=>P[k]=cs.getPropertyValue('--'+k).trim()||'#888');}
readPal();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readPal,30));}catch(e){}
new MutationObserver(()=>setTimeout(readPal,30)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Zeichen-Helfer ---------- */
const W=640;
function circ(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=f;c.fill();}
function sgn(c,x,y,s,plus,col,lw){c.strokeStyle=col||'#fff';c.lineWidth=lw||2;c.lineCap='round';c.beginPath();c.moveTo(x-s,y);c.lineTo(x+s,y);if(plus){c.moveTo(x,y-s);c.lineTo(x,y+s);}c.stroke();}
function electron(c,x,y,r){r=r||6;circ(c,x,y,r,P.neg);sgn(c,x,y,r*.5,false,'#fff',1.6);}
function core(c,x,y,o){o=o||{};const r=o.r||10,n=o.dots==null?3:o.dots,ox=o.ox||0,oy=o.oy||0,rot=o.rot||0;
  circ(c,x,y,r,P.pos);sgn(c,x,y,r*.5,true,'#fff',2);
  for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/Math.max(n,1);circ(c,x+Math.cos(a)*(r+5)+ox,y+Math.sin(a)*(r+5)+oy,3.2,P.neg);}}
function txt(c,t,x,y,o){o=o||{};c.fillStyle=o.col||P.muted;c.font=`${o.weight||500} ${o.size||13}px Lexend, system-ui, sans-serif`;c.textAlign=o.align||'center';c.textBaseline='middle';c.fillText(t,x,y);}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function arrow(c,x1,y1,x2,y2,col,lw){lw=lw||3;const a=Math.atan2(y2-y1,x2-x1);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*8,y2-Math.sin(a)*8);c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-Math.cos(a-.45)*13,y2-Math.sin(a-.45)*13);c.lineTo(x2-Math.cos(a+.45)*13,y2-Math.sin(a+.45)*13);c.closePath();c.fill();}
function rodShape(c,x,y,w,h,s){c.fillStyle=P.gold;rr(c,x,y,w,h,h/2);c.fill();if(!s)return;const n=Math.max(1,Math.floor(w/30));for(let i=0;i<n;i++){const cx=x+18+i*(w-36)/Math.max(n-1,1);sgn(c,cx,y+h/2,5,s>0,s>0?P.pos:P.neg,2.6);}}
function wander(p,b,amp,max){p.vx+=(Math.random()-.5)*amp;p.vy+=(Math.random()-.5)*amp;p.vx*=.97;p.vy*=.97;const s=Math.hypot(p.vx,p.vy);if(s>max){p.vx*=max/s;p.vy*=max/s;}p.x+=p.vx;p.y+=p.vy;
  if(p.x<b.x0){p.x=b.x0;p.vx=Math.abs(p.vx);}if(p.x>b.x1){p.x=b.x1;p.vx=-Math.abs(p.vx);}if(p.y<b.y0){p.y=b.y0;p.vy=Math.abs(p.vy);}if(p.y>b.y1){p.y=b.y1;p.vy=-Math.abs(p.vy);}}

/* ---------- Bühne ---------- */
function makeStage(host,o){o=o||{};const h=o.h||340;
  const wrap=document.createElement('div');wrap.className='sim';
  const ctrl=document.createElement('div');ctrl.className='sim-ctrl';
  const c=document.createElement('canvas');c.className='sim-canvas';c.style.aspectRatio=W+' / '+h;if(o.interactive)c.style.touchAction='none';
  const hint=document.createElement('div');hint.className='hint';if(o.hint)hint.textContent=o.hint;
  wrap.append(ctrl,c);if(o.hint)wrap.append(hint);host.append(wrap);
  const ctx=c.getContext('2d');
  function fit(){const w=c.clientWidth||600;const dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(w*h/W*dpr);ctx.setTransform(c.width/W,0,0,c.height/h,0,0);}
  fit();let ro=null;try{ro=new ResizeObserver(fit);ro.observe(c);}catch(e){}
  function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*h/r.height};}
  let raf=0,alive=true;
  function loop(fn){const f=()=>{if(!alive)return;try{fn();}catch(err){console.error(err);}raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
  return{wrap,ctrl,c,ctx,h,pt,loop,alive:()=>alive,destroy(){alive=false;cancelAnimationFrame(raf);if(ro)ro.disconnect();wrap.remove();}};
}
function seg(ctrl,label,options,value,onChange){const g=document.createElement('div');g.className='seg';g.setAttribute('role','group');g.setAttribute('aria-label',label);
  const l=document.createElement('span');l.className='seg-l';l.textContent=label;g.append(l);
  options.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',String(v===value));b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');onChange(v);};g.append(b);});
  ctrl.append(g);return g;}
function tgl(ctrl,label,val,onChange){const l=document.createElement('label');l.className='tgl';const i=document.createElement('input');i.type='checkbox';i.checked=val;i.onchange=()=>onChange(i.checked);l.append(i,document.createTextNode(label));ctrl.append(l);return i;}
function sbtn(ctrl,label,fn){const b=document.createElement('button');b.type='button';b.className='sbtn';b.textContent=label;b.onclick=fn;ctrl.append(b);return b;}

/* ---------- Farbcode: Rot = elektrisches Feld, Blau = magnetisches Feld, Gold = Dipol/Strom ---------- */
function ahead(c,x,y,ang,col,s){s=s||9;c.fillStyle=col;c.beginPath();c.moveTo(x+Math.cos(ang)*s,y+Math.sin(ang)*s);c.lineTo(x+Math.cos(ang+2.5)*s,y+Math.sin(ang+2.5)*s);c.lineTo(x+Math.cos(ang-2.5)*s,y+Math.sin(ang-2.5)*s);c.closePath();c.fill();}
function dotCross(c,x,y,r,into,col){c.strokeStyle=col;c.lineWidth=1.8;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();
  if(into){const d=r*.62;c.beginPath();c.moveTo(x-d,y-d);c.lineTo(x+d,y+d);c.moveTo(x+d,y-d);c.lineTo(x-d,y+d);c.stroke();}else circ(c,x,y,Math.max(1.6,r*.3),col);}
function rod(c,x1,y1,x2,y2,col,w){c.strokeStyle=col||P.golddeep;c.lineWidth=w||7;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function gen(c,x,y){circ(c,x,y,11,P.surface);c.strokeStyle=P.ink;c.lineWidth=2;c.beginPath();c.arc(x,y,11,0,Math.PI*2);c.stroke();
  c.beginPath();for(let k=0;k<=16;k++){const xx=x-6+k*12/16,yy=y-Math.sin(k/16*Math.PI*2)*3.5;k?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.stroke();}
function clock(){let last=performance.now();return()=>{const n=performance.now(),d=Math.min(.1,(n-last)/1000);last=n;return d;};}
function fieldArc(c,x1,y1,cx,cy,x2,y2,col,alpha,down){c.globalAlpha=alpha;c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(cx,cy,x2,y2);c.stroke();
  const mx=.25*x1+.5*cx+.25*x2,my=.25*y1+.5*cy+.25*y2;let a=Math.atan2(y2-y1,x2-x1);if(!down)a+=Math.PI;ahead(c,mx,my,a,col,7);c.globalAlpha=1;}

/* ---------- Simulation: vom Schwingkreis zum Dipol ---------- */
function kreisSim(host,o){o=o||{};const st=makeStage(host,{h:340,hint:'Die Animation ist stark verlangsamt. In Wirklichkeit schwingt der Dipol millionenfach pro Sekunde.'});
  let stage=o.stage||0,t=o.t0||0;const dt=clock();
  if(!o.lock)seg(st.ctrl,'Bild',[[0,'1 geschlossen'],[1,'2 geöffnet'],[2,'3 aufgebogen'],[3,'4 Dipol']],stage,v=>{stage=v;});
  const INFO=[{C:'groß',L:'groß',f:'niedrig',fb:.1,feld:'nur im Kondensator und in der Spule'},{C:'kleiner',L:'kleiner',f:'höher',fb:.32,feld:'reicht etwas nach außen'},{C:'sehr klein',L:'sehr klein',f:'hoch',fb:.68,feld:'reicht weit in den Raum'},{C:'winzig',L:'winzig',f:'sehr hoch',fb:1,feld:'reicht weit in den Raum'}];
  st.loop(()=>{t+=o.still?0:dt();const c=st.ctx;c.clearRect(0,0,W,st.h);c.lineCap='round';c.lineJoin='round';
    const ph=t*2*Math.PI/3.2,q=Math.cos(ph),I=-Math.sin(ph),aq=Math.abs(q),aI=Math.abs(I);
    const wire=pts=>{c.strokeStyle=P.golddeep;c.lineWidth=5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();};
    const E=(x1,y1,cx,cy,x2,y2)=>fieldArc(c,x1,y1,cx,cy,x2,y2,P.pos,.12+.88*aq,q>0);
    const signs=(xs,y,plus)=>xs.forEach(x=>{c.globalAlpha=aq;sgn(c,x,y,6,plus,plus?P.pos:P.neg,3);c.globalAlpha=1;});
    const coil=(x,y0,y1,n)=>{c.strokeStyle=P.golddeep;c.lineWidth=4;const h=(y1-y0)/n;for(let k=0;k<n;k++){c.beginPath();c.ellipse(x,y0+h*(k+.5),24,h*.55,0,0,Math.PI*2);c.stroke();}};
    const Bin=(x,y0,y1)=>{c.globalAlpha=.1+.9*aI;c.strokeStyle=P.neg;c.lineWidth=2.4;[-10,0,10].forEach(dx=>{c.beginPath();c.moveTo(x+dx,y0);c.lineTo(x+dx,y1);c.stroke();});c.globalAlpha=1;};
    const curArrow=(x,y)=>{if(aI<.15)return;const L=50*aI,dir=I>0?-1:1;c.globalAlpha=aI;arrow(c,x-dir*L/2,y,x+dir*L/2,y,P.gold,4);c.globalAlpha=1;};
    if(stage===0){Bin(470,90,250);wire([[150,120],[150,70],[470,70],[470,100]]);wire([[470,240],[470,270],[150,270],[150,220]]);coil(470,100,240,8);
      c.fillStyle=P.golddeep;c.fillRect(90,114,120,7);c.fillRect(90,219,120,7);
      [105,128,150,172,195].forEach(x=>E(x,124,x,170,x,216));signs([105,135,165,195],106,q>0);signs([105,135,165,195],236,q<0);curArrow(310,70);
      txt(c,'Kondensator',150,300,{col:P.ink,weight:600});txt(c,'Spule',470,300,{col:P.ink,weight:600});}
    if(stage===1){Bin(470,125,215);wire([[150,80],[150,50],[470,50],[470,135]]);wire([[470,205],[470,290],[150,290],[150,260]]);coil(470,135,205,3);
      c.fillStyle=P.golddeep;c.fillRect(118,74,64,7);c.fillRect(118,259,64,7);
      [132,150,168].forEach(x=>E(x,84,x,170,x,256));E(122,84,60,170,122,256);E(178,84,240,170,178,256);E(120,82,0,170,120,258);E(180,82,300,170,180,258);
      signs([128,150,172],64,q>0);signs([128,150,172],278,q<0);curArrow(310,50);}
    if(stage===2){wire([[200,100],[200,60],[460,60],[460,280],[200,280],[200,240]]);
      E(200,104,140,170,200,236);E(200,100,60,170,200,240);E(200,96,-30,170,200,244);E(204,104,290,170,204,236);
      c.globalAlpha=.1+.9*aI;dotCross(c,340,170,4+8*aI,I<0,P.neg);[[540,170],[330,20],[330,320]].forEach(([x,y])=>dotCross(c,x,y,3+6*aI,I>0,P.neg));c.globalAlpha=1;
      signs([200],86,q>0);signs([200],256,q<0);curArrow(330,60);}
    if(stage===3){rod(c,320,40,320,300);
      [40,100,170,260,380].forEach(w=>{E(318,58,320-2*w,170,318,282);E(322,58,320+2*w,170,322,282);});
      c.globalAlpha=.1+.9*aI;[60,140,230].forEach(d=>{dotCross(c,320+d,170,3+7*aI,I>0,P.neg);dotCross(c,320-d,170,3+7*aI,I<0,P.neg);});c.globalAlpha=1;
      signs([340],52,q>0);signs([340],76,q>0);signs([340],264,q<0);signs([340],288,q<0);
      if(aI>.15){c.globalAlpha=aI;arrow(c,296,I>0?205:135,296,I>0?135:205,P.gold,4);c.globalAlpha=1;}}
    const inf=INFO[stage];
    txt(c,'Frequenz f',486,14,{align:'left',size:12,weight:600,col:P.ink});c.fillStyle=P.line;rr(c,486,24,134,10,5);c.fill();c.fillStyle=P.gold;rr(c,486,24,134*inf.fb,10,5);c.fill();
    txt(c,'C: '+inf.C+' · L: '+inf.L+' · f: '+inf.f,20,14,{align:'left',size:12,weight:600,col:P.ink});
    txt(c,'Feld: '+inf.feld,20,32,{align:'left',size:12});
    txt(c,'Rot: elektrisches Feld · Blau: magnetisches Feld · Gold: Strom',W/2,326,{size:11});
  });
  return{destroy:st.destroy};
}

/* ---------- Simulation: Dipol im Detail (Ladung, Strom, Nahfeld) ---------- */
function dipolSim(host,o){o=o||{};const st=makeStage(host,{h:370});let t=o.t0||0,run=!o.paused,showE=true,showB=true,showEl=true;const dt=clock();const T=4;
  const pb=sbtn(st.ctrl,run?'Pause':'Start',()=>{run=!run;pb.textContent=run?'Pause':'Start';});
  sbtn(st.ctrl,'Schritt T/4',()=>{run=false;pb.textContent='Start';t=(Math.floor(t/(T/4)+1e-6)+1)*T/4;});
  sbtn(st.ctrl,'Zurück auf 0',()=>{t=0;});
  tgl(st.ctrl,'E-Feld',true,v=>showE=v);tgl(st.ctrl,'B-Feld',true,v=>showB=v);tgl(st.ctrl,'Elektronen',true,v=>showEl=v);
  const X=170,YM=185,HL=130;
  st.loop(()=>{const d=o.still?0:dt();if(run)t+=d;const c=st.ctx;c.clearRect(0,0,W,st.h);
    const ph=2*Math.PI*t/T,p=Math.cos(ph),I=-Math.sin(ph);
    if(showE&&Math.abs(p)>.04)[32,64,100].forEach(w=>{fieldArc(c,X-4,YM-HL*.72,X-2*w,YM,X-4,YM+HL*.72,P.pos,Math.abs(p),p>0);fieldArc(c,X+4,YM-HL*.72,X+2*w,YM,X+4,YM+HL*.72,P.pos,Math.abs(p),p>0);});
    if(showB&&Math.abs(I)>.04){c.globalAlpha=Math.abs(I);[[44,0],[84,0],[124,0],[60,-70],[60,70],[104,-70],[104,70]].forEach(([dx,dy])=>{const r=3+6*Math.abs(I);dotCross(c,X+dx,YM+dy,r,I>0,P.neg);dotCross(c,X-dx,YM+dy,r,I<0,P.neg);});c.globalAlpha=1;}
    rod(c,X,YM-HL,X,YM+HL,P.gold,12);gen(c,X,YM);
    [.2,.42,.64,.86,1].forEach(zf=>{const rho=Math.sin(Math.PI/2*zf)*p;if(Math.abs(rho)<.08)return;const s=3+4*Math.abs(rho);c.globalAlpha=Math.min(1,Math.abs(rho)*1.3);
      sgn(c,X-22,YM-zf*HL*.96,s,rho>0,rho>0?P.pos:P.neg,3);sgn(c,X-22,YM+zf*HL*.96,s,rho<0,rho<0?P.pos:P.neg,3);c.globalAlpha=1;});
    [-.8,-.4,0,.4,.8].forEach(zf=>{const a=Math.cos(Math.PI/2*zf)*I;if(Math.abs(a)<.08)return;const y=YM-zf*HL,L=32*Math.abs(a);c.globalAlpha=Math.min(1,Math.abs(a)*1.3);arrow(c,X+24,y+(a>0?L/2:-L/2),X+24,y+(a>0?-L/2:L/2),P.golddeep,3.5);c.globalAlpha=1;});
    if(showEl)[-.9,-.7,-.5,-.3,-.1,.1,.3,.5,.7,.9].forEach(z0=>{const dz=8*p*Math.cos(Math.PI/2*z0);electron(c,X,YM-z0*HL+dz,4);});
    const gx=[400,550];c.strokeStyle=P.line;c.lineWidth=1.5;
    gx.forEach(g=>{c.beginPath();c.moveTo(g,YM-HL);c.lineTo(g,YM+HL);c.stroke();});c.setLineDash([4,5]);c.beginPath();c.moveTo(330,YM);c.lineTo(625,YM);c.stroke();c.setLineDash([]);
    const curve=(g,f,col)=>{c.strokeStyle=col;c.lineWidth=3;c.beginPath();for(let k=0;k<=40;k++){const z=-1+k/20;const x=g+60*f(z),y=YM-z*HL;k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();};
    curve(gx[0],z=>I*Math.cos(Math.PI/2*z),P.golddeep);curve(gx[1],z=>p*Math.sin(Math.PI/2*z),P.ink);
    txt(c,'Stromstärke I',gx[0],YM-HL-24,{col:P.golddeep,weight:700,size:13});txt(c,'Ladung / Spannung',gx[1],YM-HL-24,{col:P.ink,weight:700,size:13});
    txt(c,'oberes Ende',333,YM-HL+4,{align:'left',size:10});txt(c,'Mitte',333,YM-9,{align:'left',size:10});txt(c,'unteres Ende',333,YM+HL-4,{align:'left',size:10});
    const fr=((t/T)%1+1)%1;const nm=['0','T/4','T/2','3T/4'];const qi=Math.round(fr*4)%4;const lab=Math.abs(fr*4-Math.round(fr*4))<.02?nm[qi]:fr.toFixed(2).replace('.',',')+' T';
    txt(c,'t = '+lab,16,16,{align:'left',col:P.ink,weight:700,size:15});
    const bar=(y,lb,v,col)=>{txt(c,lb,16,y,{align:'left',size:11,weight:600,col:P.ink});c.fillStyle=P.line;rr(c,130,y-5,150,10,5);c.fill();c.fillStyle=col;rr(c,130,y-5,150*v,10,5);c.fill();};
    bar(338,'Energie im E-Feld',p*p,P.pos);bar(356,'Energie im B-Feld',I*I,P.neg);
    txt(c,'Rot: E-Feld · Blau: B-Feld · Gold: Strom',470,350,{size:11});
  });
  return{destroy:st.destroy};
}

/* ---------- Simulation: Abstrahlung (E-Feldlinien eines Hertz’schen Dipols) ---------- */
function fieldSim(host,o){o=o||{};const H=360;const st=makeStage(host,{h:H});let t=o.t0||0,run=true,showB=!!o.b,showLobe=!!o.lobe,showLam=!!o.lam,showZone=!!o.zone;const dt=clock();
  const lam=190,k=2*Math.PI/lam,T=4,om=2*Math.PI/T,CX=320,CY=180,G=5,NX=Math.ceil(W/G)+1,NY=Math.ceil(H/G)+1,F=new Float32Array(NX*NY);
  const pb=sbtn(st.ctrl,'Pause',()=>{run=!run;pb.textContent=run?'Pause':'Start';});
  tgl(st.ctrl,'B-Feld',showB,v=>showB=v);tgl(st.ctrl,'λ-Maßstab',showLam,v=>showLam=v);tgl(st.ctrl,'Nah-/Fernfeld',showZone,v=>showZone=v);tgl(st.ctrl,'Abstrahlung',showLobe,v=>showLobe=v);
  const LV=[-2.2,-1.3,-.75,-.45,-.15,.15,.45,.75,1.3,2.2];
  function psi(x,y,ph){const r=Math.hypot(x,y),rr=Math.max(r,16);const s2=r>0?x*x/(r*r):0;const f=ph-k*rr;return s2*(Math.cos(f)/(k*rr)-Math.sin(f));}
  st.loop(()=>{const d=o.still?0:dt();if(run)t+=d;const c=st.ctx;c.clearRect(0,0,W,H);const ph=om*t;

g1:{title:'Schwingkreis-Check',icon:'osc',cards:[
 {t:'info',title:'Erinnerung: der Schwingkreis',sim:{type:'kreis',stage:0,lock:true},html:'<p>Ein Kondensator und eine Spule bilden einen <b>Schwingkreis</b>. Ist der Kondensator geladen, steckt die Energie im <b>elektrischen Feld</b> (rot). Fließt der Strom durch die Spule, steckt sie im <b>magnetischen Feld</b> (blau). Die Energie pendelt hin und her.</p><p>Für die Periodendauer gilt die <b>Thomson’sche Schwingungsgleichung</b> (Formelsammlung):</p><p class="fbox">'+F('thomson')+' &nbsp;&nbsp; und &nbsp;&nbsp; '+F('f1T')+'</p>'},
 {t:'mc',q:'Der Kondensator ist gerade voll geladen. Wo steckt jetzt die Energie?',opts:['im elektrischen Feld des Kondensators','im magnetischen Feld der Spule','je zur Hälfte in beiden Feldern'],a:0,why:'Voll geladen heißt: maximales E-Feld im Kondensator. Der Strom ist in diesem Moment null, also gibt es kein Magnetfeld.'},
 {t:'tf',claim:'Wenn der Kondensator gerade leer ist, fließt auch kein Strom.',ok:false,why:'Genau dann ist die Stromstärke am größten. Die ganze Energie steckt in diesem Moment im Magnetfeld der Spule.'},
 {t:'num',q:'Euer Schwingkreis aus dem Versuch: L = 27 mH, C = 47 µF. Berechne die Eigenfrequenz.',intro:'<p>Tipp: Erst die Periodendauer '+F('thomson')+' ausrechnen, dann '+F('f1T')+'. Setz L in H und C in F ein: 27 mH = 0,027 H, 47 µF = 47·10⁻⁶ F.</p>',unit:'Hz',a:141,tol:.03,why:'T = 2π·√(0,027 H · 47·10⁻⁶ F) ≈ 7,08·10⁻³ s, also f = 1/T ≈ 141 Hz.'},
 {t:'mc',q:'Wie bekommt man eine größere Frequenz?',opts:['C und L kleiner machen','C und L größer machen','nur die Spannung erhöhen'],a:0,why:'L und C stehen in T = 2π·√(L·C) unter der Wurzel. Werden sie kleiner, wird T kleiner und f = 1/T größer.'},
 {t:'who',q:'Was passiert mit der Schwingung, wenn man nichts nachliefert?',people:[['Mia','Der Schwingkreis schwingt ewig weiter, die Energie bleibt ja drin.'],['Lena','Die Schwingung wird gedämpft. Ein Teil der Energie wird zum Beispiel im Draht in Wärme umgewandelt.'],['Tim','Bei jeder Schwingung geht ein Teil der Ladung verloren.']],a:1,why:'Die Ladung bleibt erhalten. Aber Energie geht verloren, deshalb wird die Amplitude kleiner. Das habt ihr im Versuch nach 5 bis 6 Perioden gesehen.'}
]},
g2:{title:'Vom Schwingkreis zur Antenne',icon:'antenna',cards:[
 {t:'info',title:'Wir biegen den Schwingkreis auf',sim:{type:'kreis',stage:0},html:'<p>Klick dich durch die vier Bilder. Achte darauf, <b>wie weit das Feld reicht</b> und was mit der <b>Frequenz</b> passiert.</p>'},
 {t:'mc',q:'Die Kondensatorplatten werden kleiner und weiter auseinandergezogen. Was passiert mit der Kapazität C?',sim:{type:'kreis',stage:1},opts:['C wird kleiner.','C wird größer.','C bleibt gleich.'],a:0,why:'Es gilt C = ε₀·εr·A/d. Kleinere Fläche A und größerer Abstand d machen C kleiner.'},
 {t:'mc',q:'Die Spule hat immer weniger Windungen, am Ende ist es nur noch ein Draht. Was passiert mit der Induktivität L?',opts:['L wird kleiner.','L wird größer.','L bleibt gleich.'],a:0,why:'Weniger Windungen bedeuten eine kleinere Induktivität.'},
 {t:'sort',q:'Was passiert beim Aufbiegen?',cats:['wird größer','wird kleiner'],items:[['Kapazität C',1],['Induktivität L',1],['Frequenz f',0],['Periodendauer T',1],['Bereich, in den das Feld reicht',0]],why:'C und L werden kleiner, also wird f größer und T kleiner. Das Feld ist nicht mehr eingesperrt und reicht weit in den Raum.'},
 {t:'tf',claim:'Ein geschlossener Schwingkreis strahlt viel Energie als Welle ab.',ok:false,why:'Beim geschlossenen Schwingkreis bleibt das Feld fast ganz im Kondensator und in der Spule. Erst wenn das Feld weit in den Raum reicht und die Frequenz hoch ist, wird nennenswert abgestrahlt.'},
 {t:'text',q:'Ein Schwingkreis, dessen Feld weit in den Raum hinausreicht, nennt man …',help:'zwei Wörter',accept:['offener Schwingkreis'],kw:[['offen'],['schwingkreis']],why:'Der Hertz’sche Dipol ist der einfachste offene Schwingkreis.'},
 {t:'order',q:'Bringe die Schritte vom Schwingkreis zum Dipol in die richtige Reihenfolge.',steps:['Kondensatorplatten verkleinern und auseinanderziehen','Windungen der Spule verringern, bis nur ein Draht übrig ist','Den Draht gerade aufbiegen','Übrig bleibt ein gerader Stab: der Hertz’sche Dipol']}
]},
g3:{title:'Der Dipol im Detail',icon:'dipole',cards:[
 {t:'info',title:'Was passiert im Dipol?',sim:{type:'dipol',paused:true},html:'<p>In der Mitte sitzt eine <b>Anregung</b> (~), die den Dipol im Takt antreibt. Starte die Animation und schau zu. Mit <b>Schritt T/4</b> springst du immer eine Viertelperiode weiter.</p><p>Rechts siehst du, wie <b>Stromstärke</b> und <b>Ladung</b> entlang des Stabs verteilt sind.</p>'},
 {t:'mc',q:'Stell t = 0 ein (Zurück auf 0). Was ist in diesem Moment los?',sim:{type:'dipol',paused:true},opts:['Die Enden sind maximal geladen, es fließt kein Strom.','In der Mitte fließt der größte Strom, die Enden sind ungeladen.','Strom und Ladung sind beide maximal.'],a:0,why:'Wie beim Kondensator: Ladung maximal, Strom null. Die Energie steckt im E-Feld.'},
 {t:'mc',q:'Geh einen Schritt weiter zu t = T/4. Was siehst du jetzt?',sim:{type:'dipol',paused:true},opts:['In der Mitte fließt der größte Strom, die Enden sind ungeladen.','Die Enden sind maximal geladen, es fließt kein Strom.','Der Strom ist an den Enden am größten.'],a:0,why:'Die Ladung hat sich ausgeglichen, dafür fließt jetzt der größte Strom. Die Energie steckt im B-Feld.'},
 {t:'pick',q:'Wie ist die Stromstärke entlang des Dipols verteilt?',opts:[{kind:'curve',shape:'mid',lab:'I'},{kind:'curve',shape:'ends',lab:'I'},{kind:'curve',shape:'flat',lab:'I'}],a:0,why:'In der Mitte ist ein Strombauch, an den Enden ist der Strom immer null. Dort können die Elektronen ja nicht weiter.'},
 {t:'info',title:'Und die Spannung?',sim:{type:'dipol',paused:true},html:'<p>Misst man die Spannung zwischen einem Punkt auf dem Dipol und der Mitte, ist sie dort groß, wo viel Ladung sitzt: <b>an den Enden maximal, in der Mitte null</b>. Die Spannung ist also so verteilt wie die Ladung.</p><p>Strom und Spannung sind auf dem Dipol gegeneinander verschoben: Wo der Strom einen Bauch hat (Mitte), hat die Spannung einen Knoten, und umgekehrt. Zeitlich sind sie um <b>T/4</b> versetzt.</p>'},
 {t:'pick',q:'Der Dipol ist gerade maximal aufgeladen (t = 0). Wie ist die Spannung entlang des Dipols verteilt?',opts:[{kind:'curve',shape:'ends',lab:'U'},{kind:'curve',shape:'mid',lab:'U'},{kind:'curve',shape:'flat',lab:'U'}],a:0,why:'Oben positiv, unten negativ, am meisten an den Enden. In der Mitte ist die Spannung null, dort hat sie einen Knoten.'},
 {t:'tf',claim:'Die Elektronen flitzen bei jeder Schwingung von einem Ende des Dipols zum anderen.',sim:{type:'dipol'},ok:false,why:'Jedes Elektron schwingt nur ein winziges Stück hin und her. Weil es aber sehr viele sind, verschiebt sich trotzdem Ladung von einem Ende zum anderen.'},
 {t:'multi',q:'Welche Aussagen zum Feld direkt am Dipol (Nahfeld) stimmen?',sim:{type:'dipol'},opts:['Das E-Feld ist maximal, wenn die Enden maximal geladen sind.','Das B-Feld ist maximal, wenn der Strom maximal ist.','E-Feld und B-Feld sind um T/4 gegeneinander versetzt.','E-Feld und B-Feld sind immer gleichzeitig maximal.'],correct:[0,1,2],why:'Im Nahfeld ist es wie im Schwingkreis: Die Energie pendelt zwischen E-Feld und B-Feld. Deshalb sind sie um eine Viertelperiode versetzt.'},
 {t:'info',title:'Dipol und stehende Welle',sim:{type:'dipol'},html:'<p>Kommt dir das Bild rechts bekannt vor? Auf dem Dipol bildet sich eine <b>stehende Welle</b>: An den Enden ist immer ein <b>Knoten</b> der Stromstärke, in der Mitte ein <b>Bauch</b>.</p><p>Zwischen zwei Knoten liegt eine halbe Wellenlänge. Für die Grundschwingung gilt also:</p><p class="fbox">'+F('lhalb')+' &nbsp;&nbsp; und &nbsp;&nbsp; '+F('dipol')+'</p><p>Die zweite Formel heißt in der Formelsammlung „Grundfrequenz eines Dipols“.</p>'},
 {t:'num',intro:'<p>Tipp: '+F('dipol')+' nach ℓ umstellen. 100 MHz = 100·10⁶ Hz.</p>',q:'Ein UKW-Sender funkt mit f = 100 MHz. Wie lang muss ein Dipol für die Grundschwingung sein? (c = 3,0·10⁸ m/s)',unit:'m',a:1.5,tol:.03,why:'ℓ = c/(2·f) = 3,0·10⁸ m/s / (2 · 100·10⁶ Hz) = 1,5 m.'},
 {t:'mc',q:'Warum muss dem Dipol ständig Energie zugeführt werden?',opts:['Er strahlt Energie als Welle ab (und ein Teil wird zu Wärme). Ohne Nachschub wäre die Schwingung schnell gedämpft.','Weil die Elektronen den Dipol verlassen.','Damit die Ladung erhalten bleibt.'],a:0,why:'Ein Dipol, der sendet, verliert ständig Energie. Eine Oszillatorschaltung (z. B. ein angekoppelter Schwingkreis) liefert sie im richtigen Takt nach.'}
]},
g4:{title:'Merksätze',icon:'pen',cards:[
 {t:'gap',sum:true,title:'Vom Schwingkreis zum Hertz’schen Dipol',fml:['thomson', 'f1T', 'lhalb', 'dipol'],figs:[{type:'kreis',o:{stage:0,lock:true},cap:'1 · Geschlossener Schwingkreis: Das E-Feld sitzt im Kondensator, das B-Feld in der Spule.'},
  {type:'kreis',o:{stage:1,lock:true},cap:'2 · Platten kleiner und weiter auseinander, weniger Windungen: C und L werden kleiner, f steigt.'},
  {type:'kreis',o:{stage:2,lock:true},cap:'3 · Aufgebogen: Das Feld reicht weit nach außen.'},
  {type:'kreis',o:{stage:3,lock:true},cap:'4 · Gerader Stab = Hertz’scher Dipol: winzige C und L, sehr hohe Frequenz.'},
  {type:'dipol',o:{t0:0},cap:'t = 0: Enden maximal geladen, kein Strom. Das E-Feld ist maximal, die Energie steckt im E-Feld.'},
  {type:'dipol',o:{t0:1},cap:'t = T/4: Ladung ausgeglichen, Strom in der Mitte maximal. Die Energie steckt im B-Feld.'},
  {scene:{kind:'dip',q:'ends',i:''},cap:'Skizze t = 0: Ladung an den Enden, dazwischen das E-Feld. Kein Strom, kein B-Feld.'},
  {scene:{kind:'curve',shape:'ends',lab:'U'},cap:'Skizze: Ladung und Spannung sind an den Enden maximal und in der Mitte null.'},
  {scene:{kind:'curve',shape:'mid',lab:'I'},cap:'Skizze: Strombauch in der Mitte, Stromknoten an den Enden. Deshalb gilt ℓ = λ/2.'}],text:'Im geschlossenen Schwingkreis pendelt die Energie zwischen dem {{elektrischen|magnetischen}} Feld des Kondensators und dem {{magnetischen|elektrischen}} Feld der Spule hin und her. Für die Periodendauer gilt die Thomson’sche Schwingungsgleichung (Formel unten). Biegt man den Schwingkreis auf, werden C und L {{kleiner|größer}}. Dadurch wird die Frequenz {{größer|kleiner}} und das Feld reicht {{weit in den Raum|nur in die Spule}}. Ein gerader Stab, in dem Elektronen hochfrequent schwingen, heißt {{Hertz’scher Dipol|Kondensator|Spule}}. In der Mitte des Dipols ist die Stromstärke {{maximal|null}}, an den Enden ist sie immer {{null|maximal}}. Die Ladung und damit auch die Spannung sind {{an den Enden|in der Mitte}} am größten, in der Mitte sind sie null. Für die Grundschwingung gilt ℓ = {{λ/2|λ|2λ}}. Daraus folgt die Grundfrequenz des Dipols (Formel unten). Die einzelnen Elektronen bewegen sich dabei nur {{ein kleines Stück hin und her|von einem Ende zum anderen}}. Weil der Dipol Energie abstrahlt, muss ihm ständig {{Energie zugeführt|Ladung entzogen}} werden.'}
]},
a1:{title:'Film',icon:'film',cards:[
 {t:'exp',title:'Station A: Film und Animation',check:'Ich habe Video und Animation angeschaut.',material:['Tablet mit Kopfhörern – oder zum Anhören kurz vor die Tür gehen',`<a href="${VID}" target="_blank" rel="noopener">Video: Hertzscher Dipol (YouTube)</a>`,`<a href="${LMU}" target="_blank" rel="noopener">Animation: Dipolstrahlung (LMU München)</a>`],steps:['Schau dir das Video an. Achte darauf, was mit den Feldlinien passiert, wenn der Dipol umpolt.','Öffne die Animation und wähle <b>Hertz’scher Dipol → 2D-Ansicht → E-Feldlinien</b>. Starte sie mit „Nonstop“.','Stell den Ausschnitt auf <b>2 λ</b>. Beobachte, wie sich die Feldlinien vom Dipol lösen.'],note:'Keine Kopfhörer dabei? Dann geh für das Video kurz vor die Tür, damit die anderen in Ruhe arbeiten können.'},
 {t:'mc',q:'Was passiert mit den elektrischen Feldlinien, wenn der Dipol umpolt?',opts:['Sie schnüren sich vom Dipol ab und bilden geschlossene Schleifen, die nach außen wandern.','Sie verschwinden einfach und entstehen neu.','Sie bleiben am Dipol und drehen sich nur um.'],a:0,why:'Das Feld kann nicht schnell genug zurück in den Dipol. Die Feldlinien schnüren sich ab und laufen als geschlossene Schleifen davon.'},
 {t:'who',q:'Wie kommt das Feld weit weg vom Dipol eigentlich zustande?',people:[['Ali','Die Elektronen werden aus der Antenne herausgeschleudert und fliegen durch den Raum.'],['Lena','Das Feld löst sich ab. Ein sich änderndes E-Feld erzeugt ein B-Feld und umgekehrt. So trägt sich die Welle selbst weiter.'],['Tim','Die Luft schwingt mit und gibt die Welle weiter, wie beim Schall.']],a:1,why:'Es fliegen keine Elektronen weg, und Luft braucht die Welle auch nicht. Elektromagnetische Wellen laufen sogar durchs Vakuum.'}
]},
a2:{title:'Simulation',icon:'screen',cards:[
 {t:'info',title:'Feldlinien eines Hertz’schen Dipols',sim:{type:'feld'},html:'<p>In der Mitte sitzt ein kleiner Dipol (gold). Die roten Linien sind die <b>elektrischen Feldlinien</b>. Schau eine Weile zu und schalte dann nacheinander die Hilfen oben ein.</p>'},
 {t:'mc',q:'Schalte „Abstrahlung“ ein. In welche Richtung strahlt der Dipol am stärksten ab?',sim:{type:'feld'},opts:['senkrecht zur Dipolachse','in Richtung der Dipolachse','in alle Richtungen gleich stark'],a:0,why:'Senkrecht zum Dipol ist die Abstrahlung am stärksten, genau in Achsrichtung gibt es gar keine.'},
 {t:'tf',claim:'In Richtung der Dipolachse wird genauso stark abgestrahlt wie zur Seite.',ok:false,why:'Oberhalb und unterhalb des Dipols kommt nichts an. Deshalb stehen Sendemasten senkrecht: Sie strahlen waagrecht übers Land.'},
 {t:'mc',q:'Schalte den „λ-Maßstab“ ein. Wie weit wandert eine Feldlinienschleife während einer Periodendauer T?',sim:{type:'feld'},opts:['eine Wellenlänge λ','eine halbe Wellenlänge','gar nicht, sie bleibt stehen'],a:0,why:'In einer Periodendauer T läuft die Welle genau eine Wellenlänge weiter. Deshalb gilt c = λ/T = λ·f.'},
 {t:'mc',q:'Wie schnell breiten sich die Feldschleifen aus?',opts:['mit Lichtgeschwindigkeit, c ≈ 3,0·10⁸ m/s','so schnell wie die Elektronen im Draht','mit Schallgeschwindigkeit, etwa 340 m/s'],a:0,why:'Elektromagnetische Wellen breiten sich mit Lichtgeschwindigkeit aus. Die Elektronen im Draht sind dagegen sehr langsam.'},
 {t:'mc',q:'Schalte „Nah-/Fernfeld“ ein. Wo hängen die Feldlinien noch am Dipol?',sim:{type:'feld'},opts:['im Nahfeld','im Fernfeld','überall gleich'],a:0,why:'Im Nahfeld beginnen und enden die Feldlinien noch an den Ladungen des Dipols. Im Fernfeld sind sie abgelöst und geschlossen.'},
 {t:'multi',q:'Schalte das B-Feld dazu. Welche Aussagen stimmen?',sim:{type:'feld',b:true},opts:['Im Fernfeld sind die E-Feldlinien geschlossene Schleifen.','Das Fernfeld braucht keine Ladungen mehr, um zu existieren.','Die Welle braucht Luft, um sich auszubreiten.','Die magnetischen Feldlinien laufen ringförmig um die Dipolachse.'],correct:[0,1,3],why:'Abgelöste E-Felder und B-Felder erzeugen sich gegenseitig. Ein Medium ist dafür nicht nötig. Das B-Feld umschließt die Dipolachse wie bei einem geraden Leiter.'}
]},
a3:{title:'Sicherung',icon:'pen',cards:[
 {t:'gap',sum:true,title:'Abstrahlung der elektromagnetischen Welle',fml:['wave'],figs:[{type:'feld',o:{t0:0},cap:'t = 0: Der Dipol ist maximal geladen. Weiter außen laufen schon abgelöste Feldlinienschleifen.'},
  {type:'feld',o:{t0:1},cap:'t = T/4: Die Feldlinien am Dipol schnüren sich ab.'},
  {type:'feld',o:{t0:2},cap:'t = T/2: Eine neue, geschlossene Schleife ist entstanden und läuft nach außen.'},
  {type:'feld',o:{t0:3,lam:true},cap:'t = 3T/4: In einer Periode T läuft die Welle eine Wellenlänge λ weiter.'},
  {type:'feld',o:{t0:.5,lobe:true},cap:'Abstrahlung: senkrecht zur Dipolachse am stärksten, in Achsrichtung null.'},
  {type:'feld',o:{t0:.5,zone:true,b:true},cap:'Nahfeld und Fernfeld. Blau: B-Feld (Punkt im Kreis: aus dem Bild, Kreuz im Kreis: ins Bild), es läuft ringförmig um die Dipolachse.'}],text:'Bei hoher Frequenz {{schnüren sich|bleiben}} die elektrischen Feldlinien vom Dipol ab. Sie bilden {{geschlossene Schleifen|gerade Linien}}, die sich mit {{Lichtgeschwindigkeit c|Schallgeschwindigkeit}} ausbreiten. Ein sich änderndes elektrisches Feld erzeugt ein {{magnetisches|elektrisches}} Feld und umgekehrt. So erhält sich die Welle selbst und braucht {{kein|ein}} Medium. Am stärksten strahlt der Dipol {{senkrecht zur Dipolachse|in Richtung der Dipolachse}} ab, in Richtung der Achse {{gar nicht|am stärksten}}. Nach einer Periodendauer T ist die Welle um {{eine Wellenlänge λ|eine halbe Wellenlänge}} weitergelaufen. Also gilt c = {{λ·f|λ/f|f/λ}}.'}
]},
b1:{title:'Vorhersage',icon:'bulb',cards:[
 {t:'info',title:'Station B: Sender und Empfänger',sim:{type:'empf',preview:true},html:'<p>Links steht ein senkrechter <b>Sendedipol</b>. Rechts steht ein zweiter, gleich gebauter Dipol als <b>Empfänger</b>. In seiner Mitte sitzt ein kleines <b>Lämpchen</b>.</p><p>Bevor du die Simulation benutzt: Was vermutest du? Es gibt hier kein Richtig oder Falsch, du prüfst deine Vermutung gleich selbst.</p>'},
 {t:'poll',q:'Du drehst den Empfangsdipol um 90°, sodass er waagrecht liegt. Was passiert mit dem Lämpchen?',opts:['Es leuchtet heller.','Es leuchtet gleich hell.','Es leuchtet schwächer oder gar nicht.']},
 {t:'poll',q:'Du stellst den Empfänger genau über den Sender, also in Verlängerung der Dipolachse. Was passiert?',opts:['Das Lämpchen leuchtet besonders hell, weil der Empfänger so nah ist.','Das Lämpchen leuchtet kaum oder gar nicht.','Es macht keinen Unterschied.']},
 {t:'poll',q:'Wie lang sollte der Empfangsdipol sein, damit das Lämpchen am hellsten leuchtet?',opts:['so lang wie möglich','genauso lang wie der Sendedipol (λ/2)','so kurz wie möglich']},
 {t:'mc',q:'Warum sitzt das Lämpchen in der Mitte des Empfangsdipols?',opts:['Dort ist die Stromstärke am größten.','Dort ist am meisten Ladung.','Das ist egal, es könnte auch am Ende sitzen.'],a:0,why:'In der Mitte des Dipols liegt der Strombauch. An den Enden ist die Stromstärke immer null, dort würde das Lämpchen nie leuchten.'}
]},
b2:{title:'Simulation',icon:'screen',cards:[
 {t:'info',title:'Empfang mit dem Lämpchen',sim:{type:'empf'},html:'<p>Probier alles aus: Ziehe den Empfänger herum, dreh ihn und ändere seine Länge. Prüfe deine Vermutungen von vorhin.</p>'},
 {t:'mc',q:'Dreh den Empfänger auf 90°. Was passiert?',sim:{type:'empf'},opts:['Das Lämpchen geht aus.','Das Lämpchen wird heller.','Nichts ändert sich.'],a:0,why:'Das E-Feld der Welle schwingt parallel zum Sendedipol, also senkrecht. Nur wenn der Empfänger in dieser Richtung liegt, treibt es die Elektronen im Stab hin und her.'},
 {t:'mc',q:'Ziehe den Empfänger (0°, Länge λ/2) direkt über oder unter den Sender. Was beobachtest du?',sim:{type:'empf'},opts:['Das Lämpchen bleibt dunkel, obwohl der Empfänger nah dran ist.','Das Lämpchen ist dort am hellsten.','Das Lämpchen flackert.'],a:0,why:'In Richtung der Dipolachse strahlt ein Dipol gar nicht ab. Oberhalb und unterhalb kommt also nichts an, auch wenn der Abstand klein ist.'},
 {t:'mc',q:'Ändere die Länge des Empfängers. Wann leuchtet das Lämpchen am hellsten?',sim:{type:'empf'},opts:['bei der Länge λ/2','bei der Länge λ','bei der Länge λ/4'],a:0,why:'Dann hat der Empfänger dieselbe Eigenfrequenz wie der Sender. Er schwingt in Resonanz mit.'},
 {t:'text',q:'Der Empfänger hat dieselbe Eigenfrequenz wie der Sender und schwingt deshalb besonders stark mit. Wie heißt das?',help:'ein Wort',accept:['Resonanz'],why:'Wie bei der Schaukel: Wird im Takt der Eigenfrequenz angeregt, wird die Schwingung besonders groß.'},
 {t:'mc',q:'Jetzt mit Metallgitter: Stell „Stäbe senkrecht“ ein. Was passiert mit dem Lämpchen hinter dem Gitter?',sim:{type:'empf',grid:true},opts:['Es geht aus.','Es leuchtet weiter.','Es leuchtet heller.'],a:0,why:'Die Stäbe liegen parallel zum E-Feld. Die Welle treibt die Elektronen in den Stäben an und verliert dabei ihre Energie. Hinter dem Gitter kommt fast nichts mehr an.'},
 {t:'tf',claim:'Das Gitter mit waagrechten Stäben lässt die Welle durch, weil sie durch die Lücken passt.',sim:{type:'empf',grid:true},ok:false,why:'Auf die Lücken kommt es nicht an. Waagrechte Stäbe stehen senkrecht zum E-Feld, deshalb können die Elektronen darin kaum angetrieben werden. Die Welle läuft durch.'},
 {t:'text',q:'Das E-Feld der Dipolwelle schwingt nur in einer Richtung. Man sagt: Die Welle ist linear …',help:'ein Wort',accept:['polarisiert'],kw:[['polaris']],why:'Polarisieren kann man nur Transversalwellen. Das ist ein Hinweis darauf, dass EM-Wellen transversal sind.'}
]},
b3:{title:'Sicherung',icon:'pen',cards:[
 {t:'gap',sum:true,title:'Empfang und Polarisation',figs:[{type:'empf',o:{t0:1.2},cap:'Empfänger parallel zum Sender, Länge λ/2: Das Lämpchen leuchtet hell.'},
  {type:'empf',o:{t0:1.2,ang:90},cap:'Empfänger um 90° gedreht: Das E-Feld treibt die Elektronen nicht entlang des Stabs. Lämpchen aus.'},
  {type:'empf',o:{t0:1.2,x:110,y:60},cap:'Empfänger in Verlängerung der Dipolachse: Dorthin wird nichts abgestrahlt. Lämpchen aus.'},
  {type:'empf',o:{t0:1.2,len:1},cap:'Empfänger der Länge λ: keine Resonanz, das Lämpchen bleibt fast dunkel.'},
  {type:'empf',o:{t0:1.2,grid:true,gridv:1},cap:'Gitter mit Stäben parallel zum E-Feld: Die Welle wird aufgehalten.'},
  {type:'empf',o:{t0:1.2,grid:true,gridv:2},cap:'Gitter mit Stäben senkrecht zum E-Feld: Die Welle kommt durch.'}],text:'Ein Empfangsdipol mit Lämpchen leuchtet am hellsten, wenn er {{parallel|senkrecht}} zum Sendedipol steht. Dann treibt das {{elektrische|magnetische}} Feld der Welle die Elektronen im Stab hin und her. Steht der Empfänger {{in Verlängerung der Dipolachse|neben dem Sender}}, leuchtet das Lämpchen nicht. Am besten ist der Empfang, wenn der Empfangsdipol {{λ/2|λ/4|λ}} lang ist. Dann hat er die gleiche Eigenfrequenz wie der Sender. Das nennt man {{Resonanz|Dämpfung|Interferenz}}. Das E-Feld des Dipols schwingt nur in einer Richtung, die Welle ist also {{linear polarisiert|unpolarisiert}}. Ein Metallgitter mit Stäben {{parallel|senkrecht}} zum E-Feld hält die Welle auf.'}
]},
c1:{title:'Hertz 1887',icon:'book',cards:[
 {t:'info',title:'Station C: Ein Versuch in Karlsruhe',html:'<p>1864 sagt <b>James Clerk Maxwell</b> voraus: Es muss elektromagnetische Wellen geben, und sie sind so schnell wie Licht. Gesehen hat sie damals noch niemand.</p><p>Von 1886 bis 1888 baut <b>Heinrich Hertz</b> an der Technischen Hochschule Karlsruhe einen Sender: zwei Metallstäbe mit einer kleinen <b>Funkenstrecke</b> in der Mitte. Springt dort ein Funke über, schwingen die Elektronen im Stab mit sehr hoher Frequenz.</p><p>Als Empfänger nimmt er einen Drahtring mit einer winzigen Lücke. Im abgedunkelten Raum sieht er dort feine <b>Fünkchen</b>, mehrere Meter vom Sender entfernt. Vor einer Metallwand findet er Stellen mit starken und ohne Fünkchen. Daraus bestimmt er die Wellenlänge.</p>'},
 {t:'mc',q:'Woran hat Hertz erkannt, dass beim Empfänger etwas ankommt?',opts:['An kleinen Funken in der Lücke des Empfängers','An einem Ausschlag der Kompassnadel','An einem Ton im Lautsprecher'],a:0,why:'Lautsprecher gab es noch nicht. Die Fünkchen zeigten: Im Empfänger wird eine Spannung erzeugt, ohne Kabel zum Sender.'},
 {t:'mc',q:'Vor der Metallwand gibt es Stellen mit starken und ohne Fünkchen. Was hat sich dort gebildet?',opts:['eine stehende Welle','eine Schwebung','ein Magnetfeld wie bei einem Stabmagneten'],a:0,why:'Die Welle wird an der Wand reflektiert und überlagert sich mit der ankommenden Welle. Der Abstand zweier Knoten ist λ/2, so wie bei euren stehenden Wellen.'},
 {t:'num',q:'Maxwell konnte c aus elektrischen und magnetischen Größen berechnen. Rechne nach mit ε₀ = 8,854·10⁻¹² As/(Vm) und µ₀ = 1,257·10⁻⁶ Vs/(Am). Gib c in km/s an.',intro:'<p class="fbox">'+F('c0')+'</p><p>Tipp: Erst ε₀·µ₀ ausrechnen, dann die Wurzel ziehen, dann 1 durch das Ergebnis. Du bekommst c in m/s. Für km/s teilst du durch 1000.</p>',unit:'km/s',a:299800,tol:.01,why:'c = 1/√(8,854·10⁻¹² · 1,257·10⁻⁶) m/s ≈ 3,00·10⁸ m/s = 300 000 km/s. Das ist die Lichtgeschwindigkeit. Daraus folgt: Licht ist eine elektromagnetische Welle.'},
 {t:'who',q:'Was heißt „c ist eine Grenzgeschwindigkeit“?',people:[['Ali','Mit genug Energie kann man ein Raumschiff auch schneller als das Licht machen.'],['Lena','Kein Körper und kein Signal kann schneller als c sein. Elektromagnetische Wellen sind im Vakuum genau so schnell.'],['Mia','c gilt nur für sichtbares Licht. Radiowellen sind langsamer.']],a:1,why:'c ist die größte Geschwindigkeit überhaupt. Alle elektromagnetischen Wellen, ob Radio, Mikrowelle oder Licht, breiten sich im Vakuum mit c aus.'},
 {t:'tf',claim:'Radiowellen und Licht sind dieselbe Art von Welle, sie haben nur eine andere Frequenz.',ok:true,why:'Beides sind elektromagnetische Wellen. Sie unterscheiden sich nur in Frequenz und Wellenlänge. Das schaut ihr euch beim elektromagnetischen Spektrum noch genauer an.'}
]},
c2:{title:'Simulation',icon:'screen',cards:[
 {t:'info',title:'Die Welle weit weg vom Dipol',sim:{type:'welle'},html:'<p>Weit weg vom Dipol, im <b>Fernfeld</b>, sieht die Welle so aus. Rot ist das <b>E-Feld</b>, blau das <b>B-Feld</b>. Die Welle läuft nach rechts. Schalte die Felder einzeln aus und wieder ein.</p>'},
 {t:'mc',q:'Wie stehen E-Feld, B-Feld und Ausbreitungsrichtung zueinander?',sim:{type:'welle'},opts:['Alle drei stehen senkrecht aufeinander.','E und B sind parallel, die Ausbreitung ist senkrecht dazu.','E schwingt in Ausbreitungsrichtung.'],a:0,why:'E schwingt nach oben und unten, B nach vorne und hinten, die Welle läuft nach rechts. Alle drei stehen senkrecht aufeinander.'},
 {t:'mc',q:'Vergleiche Fernfeld und Nahfeld. Was gilt im Fernfeld?',sim:{type:'welle',modes:true},opts:['E und B sind gleichzeitig maximal.','E und B sind um T/4 versetzt.','E ist immer doppelt so groß wie B.'],a:0,why:'Im Fernfeld schwingen E und B in Phase. Nur im Nahfeld sind sie wie im Schwingkreis um T/4 versetzt.'},
 {t:'mc',q:'Ist die elektromagnetische Welle eine Längs- oder eine Querwelle?',opts:['eine Transversalwelle (Querwelle)','eine Longitudinalwelle (Längswelle)','beides, je nach Frequenz'],a:0,why:'E und B schwingen quer zur Ausbreitungsrichtung. Deshalb kann man EM-Wellen auch polarisieren.'},
 {t:'pick',q:'Welches Bild zeigt die Welle im Fernfeld richtig?',opts:[{kind:'wave',mode:'phase'},{kind:'wave',mode:'shift'},{kind:'wave',mode:'para'}],a:0,why:'E und B stehen senkrecht aufeinander und sind gleichzeitig maximal.'},
 {t:'sort',q:'Nahfeld oder Fernfeld?',cats:['Nahfeld','Fernfeld'],items:[['E und B sind um T/4 versetzt.',0],['E und B sind gleichzeitig maximal.',1],['Die Feldlinien hängen noch an den Ladungen des Dipols.',0],['Abgelöste, geschlossene Feldlinien wandern mit c.',1],['direkt am Dipol',0],['einige Wellenlängen vom Dipol entfernt',1]]},
 {t:'num',intro:'<p>Tipp: '+F('wave')+', also nach λ umstellen. 2,4 GHz = 2,4·10⁹ Hz. Am Ende von m in cm umrechnen.</p>',q:'WLAN funkt mit f = 2,4 GHz. Berechne die Wellenlänge. (c = 3,0·10⁸ m/s)',unit:'cm',a:12.5,tol:.03,why:'λ = c/f = 3,0·10⁸ m/s / 2,4·10⁹ Hz = 0,125 m = 12,5 cm.'}
]},
c3:{title:'Sicherung',icon:'pen',cards:[

async function exportPdf(){
  const st=$('#pdfstatus');const name=(prog.name||'').trim();
  if(!name){st.textContent='Bitte trag zuerst deinen Namen ein.';$('#name').focus();return;}
  if(!window.jspdf){st.textContent='Das PDF-Modul ist nicht geladen. Mach stattdessen einen Screenshot der Zusammenfassung unten.';return;}
  st.textContent='PDF wird erstellt, die Bilder brauchen ein paar Sekunden …';
  const T=totals();const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  let FN='helvetica';
  try{doc.addFileToVFS('DV.ttf',PDFFONT_R);doc.addFont('DV.ttf','DV','normal');doc.addFileToVFS('DVB.ttf',PDFFONT_B);doc.addFont('DVB.ttf','DV','bold');FN='DV';}catch(e){FN='helvetica';}
  const NAVY=[31,58,95],GREEN=[60,122,78],GREY=[119,119,119],LGREEN=[234,243,236],LBLUE=[232,238,245];
  const PW=210,PH=297,X=20,WD=170,TOP=28,BOT=279;
  const font=(w,sz,col)=>{doc.setFont(FN,w);doc.setFontSize(sz);doc.setTextColor(...(col||[0,0,0]));};
  const LH=sz=>sz*0.3528*1.5;               // 1,5-facher Zeilenabstand in mm
  const wrap=(t,w,sz,wt)=>{font(wt||'normal',sz);return doc.splitTextToSize(t,w);};

  /* --- Blöcke sammeln: jeder Block hat Höhe h und draw(y) --- */
  const blocks=[];const add=(h,draw,o)=>blocks.push(Object.assign({h,draw},o||{}));
  // Titel
  add(16,y=>{font('bold',8.5,GREEN);doc.text('ELEKTROMAGNETISCHE WELLEN – ZUSAMMENFASSUNG',X,y+3);font('bold',18,NAVY);doc.text('Der Hertz’sche Dipol',X,y+11);},{gap:false});
  // Info-Kasten (Lernpfad-Nachweis)
  {const l1=window.__NEUTRAL?'Zusammenfassung zum Lernpfad „Hertz’scher Dipol“':`Lernpfad abgeschlossen von ${name} am ${new Date().toLocaleDateString('de-DE')} · ${Math.round(T.pct*100)} % richtig · ${T.xp} XP`;
   const l2=wrap('Hier findest du alles, was du zum Hertz’schen Dipol wissen musst: Bilder, Merksätze und Formeln. Am Ende steht ein Check, mit dem du prüfen kannst, ob du fit fürs Abi bist.',WD-8,10.5);
   const h=8+LH(10.5)*(1+l2.length)+2;
   add(h,y=>{doc.setFillColor(...LGREEN);doc.setDrawColor(...GREEN);doc.setLineWidth(.4);doc.rect(X,y,WD,h,'FD');
     font('bold',10.5,GREEN);doc.text(l1,X+4,y+6.5);font('normal',10.5,[30,30,30]);doc.text(l2,X+4,y+6.5+LH(10.5),{lineHeightFactor:1.5});});}

  const secs=summaries();
  const heading=(n,t)=>({h:10,draw:y=>{font('bold',13,GREEN);doc.text(String(n),X,y+7);font('bold',13,NAVY);doc.text(t,X+7,y+7);}});
  let n=0;
  for(const s of secs){n++;const hd=heading(n,s.title);
    // Bilder: 3 pro Zeile
    const COLS=3,G=5,FW=(WD-(COLS-1)*G)/COLS;const rows=[];
    for(let k=0;k<s.figs.length;k+=COLS){const items=[];for(const f of s.figs.slice(k,k+COLS)){let im=null;try{im=await snap(f);}catch(e){im=null;}
        const caps=wrap(f.cap,FW,8.5);items.push({f,im,caps,ih:im?FW*im.ratio:0});}
      const rh=Math.max(...items.map(o=>o.ih+2+o.caps.length*LH(8.5)*0.85));
      rows.push({h:rh,draw:y=>{items.forEach((o,i)=>{const x=X+i*(FW+G);if(o.im){doc.addImage(o.im.url,'JPEG',x,y,FW,o.ih);doc.setDrawColor(200,208,218);doc.setLineWidth(.25);doc.rect(x,y,FW,o.ih);}
        font('normal',8.5,[55,55,55]);doc.text(o.caps,x,y+o.ih+3.3,{lineHeightFactor:1.3});});}});}
    // Überschrift an die erste Bildzeile koppeln
    if(rows.length){const r0=rows.shift();add(hd.h+r0.h,y=>{hd.draw(y);r0.draw(y+hd.h);});}else add(hd.h,hd.draw);
    rows.forEach(r=>add(r.h,r.draw));
    // Merksatz-Kasten mit Formeln
    const lines=wrap(s.text,WD-10,11);const fims=s.fml.map(k=>fmlImage(k,'#14223a',56));const fh=fims.length?Math.max(...fims.map(im=>im.h*0.085))+6:0;
    const mh=8+lines.length*LH(11)+fh+0.5;
    add(mh,y=>{doc.setFillColor(...LGREEN);doc.setDrawColor(...GREEN);doc.setLineWidth(.4);doc.rect(X,y,WD,mh,'FD');
      font('bold',9,GREEN);doc.text('MERKSATZ',X+5,y+6);font('normal',11,[20,20,20]);doc.text(lines,X+5,y+11.5,{lineHeightFactor:1.5});
      if(fims.length){let fx=X+5;const fy=y+8+lines.length*LH(11)+1;fims.forEach(im=>{const h=im.h*0.085,w=im.w*0.085;doc.setFillColor(255,255,255);doc.setDrawColor(...NAVY);doc.setLineWidth(.3);doc.rect(fx-1.5,fy-1,w+3,h+2,'FD');doc.addImage(im.url,'PNG',fx,fy,w,h);fx+=w+8;});}});
  }
  // Formeln
  {n++;const hd=heading(n,'Formeln (wie in der Formelsammlung)');
    const rows=FORMELN.map(f=>{const ims=f[1].map(k=>fmlImage(k,'#14223a',56));const ih=Math.max(...ims.map(im=>im.h*0.085));const lab=wrap(f[0],62,10.5);
      const h=Math.max(ih+2,lab.length*LH(10.5))+3;return{h,draw:y=>{font('normal',10.5,[20,20,20]);doc.text(lab,X+3,y+5,{lineHeightFactor:1.5});let fx=X+70;
        ims.forEach(im=>{const hh=im.h*0.085,w=im.w*0.085;doc.addImage(im.url,'PNG',fx,y,w,hh);fx+=w+10;});doc.setDrawColor(215,222,232);doc.setLineWidth(.2);doc.line(X,y+h,X+WD,y+h);}};});
    rows.forEach((r,i)=>{const h=r.h+(i===0?2:0)+(i===rows.length-1?2:0);const dr=y=>{doc.setFillColor(...LBLUE);doc.rect(X,y,WD,h,'F');r.draw(y+(i===0?2:0));};
      if(i===0)add(hd.h+h,y=>{hd.draw(y);dr(y+hd.h);});else add(h,dr,{tight:true});});}
  // Abi-Check
  {n++;const hd=heading(n,'Das musst du können (Abi-Check)');
    const items=KANN.map(t=>{const l=wrap(t,WD-12,10.5);return{l,h:l.length*LH(10.5)+2.5};});
    const tot=items.reduce((a,i)=>a+i.h,0);
    add(hd.h+1+tot,y=>{hd.draw(y);let yy=y+hd.h+1;items.forEach(it=>{doc.setDrawColor(...NAVY);doc.setLineWidth(.35);doc.rect(X+1,yy+1.2,3.6,3.6);font('normal',10.5,[20,20,20]);doc.text(it.l,X+8,yy+4.4,{lineHeightFactor:1.5});yy+=it.h;});});}

  /* --- Seiten verteilen: Blöcke nie zerschneiden, Restplatz gleichmäßig auf die Abstände verteilen --- */
  const GAP=6,pages=[[]];let used=0;
  blocks.forEach(b=>{const cur=pages[pages.length-1];const gb=cur.length?(b.tight?0:GAP):0;if(used+gb+b.h>BOT-TOP&&cur.length){pages.push([b]);used=b.h;}else{cur.push(b);used+=gb+b.h;}});
  const logo='data:image/jpeg;base64,'+LOGO_B64;
  pages.forEach((pg,pi)=>{if(pi)doc.addPage();
    // Kopf
    try{doc.addImage(logo,'JPEG',X,9,39.7,6.35);}catch(e){}
    font('normal',9,NAVY);doc.text('Physik · TG2',X+WD,14,{align:'right'});doc.setDrawColor(...GREEN);doc.setLineWidth(.55);doc.line(X,17.5,X+WD,17.5);
    // Fuß
    doc.setDrawColor(190,190,190);doc.setLineWidth(.2);doc.line(X,PH-14,X+WD,PH-14);font('normal',8,GREY);doc.text('AB_Zusammenfassung_Hertzscher_Dipol',X,PH-9.5);
    doc.text(`Seite ${pi+1} / ${pages.length}`,X+WD,PH-9.5,{align:'right'});
    // Inhalt
    const flex=pg.filter((b,i)=>i>0&&!b.tight).length;const sum=pg.reduce((a,b,i)=>a+b.h+(i>0&&b.tight?0:0),0);const free=(BOT-TOP)-sum;
    const last=pi===pages.length-1;const g=flex>0?Math.min(last?10:22,Math.max(GAP,free/flex)):0;
    let y=TOP;pg.forEach((b,i)=>{if(i>0)y+=b.tight?0:g;b.draw(y);y+=b.h;});
    if(last){const rest=BOT-(y+10);if(rest>=35){const ny=y+10;doc.setDrawColor(...NAVY);doc.setLineWidth(.4);doc.rect(X,ny,WD,rest);font('bold',10.5,NAVY);doc.text('Meine Notizen und Fragen',X+4,ny+6.5);
      doc.setDrawColor(215,222,232);doc.setLineWidth(.2);for(let ly=ny+16;ly<ny+rest-4;ly+=9)doc.line(X+4,ly,X+WD-4,ly);}}
  });

  const blob=doc.output('blob');const fname='Zusammenfassung_Dipol_'+name.replace(/[^A-Za-z0-9äöüÄÖÜß_-]+/g,'_')+'.pdf';
  const fallback=why=>{let url='';try{url=URL.createObjectURL(blob);}catch(e){}
    st.innerHTML=`${why} <a href="${url}" target="_blank" rel="noopener" download="${fname}" style="font-weight:700;color:var(--uideep)">Hier tippen: PDF in neuem Tab öffnen</a><br><span class="hint">Klappt auch das nicht? Mach einen Screenshot von deinem Abschlussnachweis. Die Zusammenfassung bekommst du dann von deiner Lehrerin.</span>`;};
  let dl=null;try{dl=window.claude&&window.claude.use?await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),4000))]):null;}catch(e){dl=null;}
  if(!dl){fallback('Direktes Speichern geht in diesem Browser nicht.');return;}
  try{await dl.save({filename:fname,data:blob});st.textContent='PDF gespeichert. Schau in deinen Downloads nach.';}
  catch(e){if(e&&e.code==='declined')st.textContent='Speichern abgebrochen. Tipp nochmal auf den Knopf, wenn du die PDF doch willst.';else fallback('Speichern hat nicht geklappt.');}
}

let L=null;
