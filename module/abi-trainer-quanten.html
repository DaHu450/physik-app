<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abi-Trainer Quantenphysik</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: Kopf mit BE-Stand, Tabs je Aufgabe, je Teilaufgabe eine Karte mit Antwortfeldern, Hilfe-Treppe und Lösung; letzter Tab = Auswertung */
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#15253A; --muted:#58697C; --line:#D3DCE6;
  --navy:#1F3A5F; --green:#3C7A4E; --greenSoft:#E2F0E5; --navySoft:#E3EAF3;
  --orange:#C2571A; --blue:#2F6FB5; --blueSoft:#E1ECF8; --bad:#B3261E; --badSoft:#FBE6E4; --warnSoft:#FFF3D6;
  --f-display:"Bricolage Grotesque",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1621; --panel:#162131; --ink:#E5ECF4; --muted:#9BABBD; --line:#2A3A4F;
  --navy:#93B4DE; --green:#6FC089; --greenSoft:#1B3325; --navySoft:#1B293C;
  --orange:#F09A5E; --blue:#7FB2EE; --blueSoft:#1A2C44; --bad:#F2918A; --badSoft:#3B1F1E; --warnSoft:#3A321C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:15px;color:var(--muted);margin-top:6px}
.score{font-family:var(--f-mono);font-size:15px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.score b{color:var(--green);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
nav button{flex:0 0 auto;font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
nav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
nav button[aria-selected="true"] .n{color:var(--bg);opacity:.8}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;min-width:0;margin-bottom:16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 4px;color:var(--navy);text-wrap:balance}
.src{font-size:14px;color:var(--green);margin:0 0 10px}
.lead{margin:0 0 10px}
.task{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
.task.solo{border-color:var(--green)} .task.help{border-color:var(--blue)} .task.shown,.task.err{border-color:var(--orange)}
.thead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tnr{font-family:var(--f-mono);font-weight:700;color:var(--green);margin-right:8px}
.be{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.status{font-size:13.5px;border-radius:999px;padding:2px 10px;background:var(--navySoft);white-space:nowrap}
.status.solo{background:var(--greenSoft)} .status.help{background:var(--blueSoft)} .status.shown,.status.err{background:var(--warnSoft)}
.qtext{margin:8px 0 10px}
.qtext b{color:var(--navy)}
.mat{border-left:4px solid var(--green);padding:6px 0 6px 12px;margin:10px 0}
.mat .mh{font-weight:700;color:var(--green);font-size:15px;margin-bottom:6px}
canvas{display:block;width:100%;max-width:100%;border-radius:10px;background:var(--bg)}
.comp{margin-top:12px}
.comp .cq{font-weight:700;margin:0 0 6px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ansrow label{font-weight:700;font-family:var(--f-mono);min-width:4.2em}
.ansrow input{font:inherit;font-family:var(--f-mono);font-size:18px;width:8em;max-width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.unit{font-family:var(--f-mono);color:var(--muted);min-width:2.4em}
.ok{border-color:var(--green)!important;background:var(--greenSoft)!important}
.no{border-color:var(--bad)!important;background:var(--badSoft)!important}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.opts button:disabled{cursor:default;opacity:1}
.btn{font:inherit;font-size:16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--navy);color:var(--bg);padding:9px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.blue{background:transparent;border-color:var(--blue);color:var(--blue)}
.btn.orange{background:transparent;border-color:var(--orange);color:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{border-radius:10px;padding:9px 13px;margin-top:8px;font-size:16px}
.fb.good{background:var(--greenSoft);border:1.5px solid var(--green)}
.fb.bad{background:var(--badSoft);border:1.5px solid var(--bad)}
.fb.tip{background:var(--blueSoft);border:1.5px solid var(--blue)}
.fb.sol{background:var(--warnSoft);border:1.5px solid var(--orange)}
.mono{font-family:var(--f-mono);font-size:14.5px;line-height:1.8;white-space:pre-wrap}
.small{font-size:14.5px;color:var(--muted)}
table.aus{border-collapse:collapse;width:100%;font-size:15.5px}
table.aus th,table.aus td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.aus td.r,table.aus th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
</style>
<style id="farben-b">
/* Farbschema B (Nov 2026): kräftiges Blau für Überschriften, stärkere Kontraste, Merke goldgelb */
:root{
  --bg:#E7EDF4; --panel:#FFFFFF; --ink:#0B1626; --muted:#37465A; --line:#A7B7CA;
  --navy:#13305A; --navySoft:#DCE7F7; --green:#22703C; --greenSoft:#DAF0E0;
  --bad:#A8201A; --badSoft:#FADFDB;
  --head:#0B50C4; --accent:#0B50C4; --givenLine:#B7CBEA;
  --merk:#E0A800; --merkSoft:#FFF6CC; --merkInk:#7A5C00;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121C; --panel:#152030; --ink:#F0F4F9; --muted:#B3C1D1; --line:#3A4C63;
  --navy:#9CC0F0; --navySoft:#1A2A40; --green:#74CC90; --greenSoft:#173523;
  --bad:#F59A93; --badSoft:#3E1E1C;
  --head:#7DB0FF; --accent:#4D8EF0; --givenLine:#2E4A70;
  --merk:#E8BE3A; --merkSoft:#3A3214; --merkInk:#F2CF5B;
}}
:root[data-theme="dark"]{
  --bg:#0B121C; --panel:#152030; --ink:#F0F4F9; --muted:#B3C1D1; --line:#3A4C63;
  --navy:#9CC0F0; --navySoft:#1A2A40; --green:#74CC90; --greenSoft:#173523;
  --bad:#F59A93; --badSoft:#3E1E1C;
  --head:#7DB0FF; --accent:#4D8EF0; --givenLine:#2E4A70;
  --merk:#E8BE3A; --merkSoft:#3A3214; --merkInk:#F2CF5B;
}
h1,h2,.card h2,.card h3{color:var(--head)}
.card h2,.card h3,h2{font-weight:800}
.card,.score,nav button{border-width:2px}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav button[aria-selected="true"] .n,nav button[aria-selected="true"] .done{color:#fff}
.given,.read{border:1.5px solid var(--givenLine)}
input[type=range]{accent-color:var(--accent)}
.merk{border-left:6px solid var(--merk);background:var(--merkSoft)}
.merk b{color:var(--merkInk)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Abi-Trainer Quantenphysik<small>TG2 · Aufgaben im Abi-Stil zu Photoeffekt, Quantenobjekten und Atomphysik</small></h1>
  <div class="score" aria-live="polite">BE: <b id="scoreNow">0</b> / <span id="scoreMax">0</span></div>
</header>

<main id="main"></main>
</div>

<script src="../bridge.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function parse(v) { v = String(v).trim().replace(/\s/g, '').replace(/,/g, '.').replace(/−/g, '-').replace(/[·*x×]10\^?/i, 'e'); if (v === '') return NaN; const n = Number(v); return isFinite(n) ? n : NaN; }
function fit(c, h) { const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + 'px'; const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h); return [x, w, h]; }

/* ===================== Material-Zeichnungen ===================== */
const H = 6.626e-34, C = 2.998e8, QE = 1.602e-19, ME = 9.109e-31, HC = H * C / QE * 1e9;
const sci = (x, d = 2) => { let e = Math.floor(Math.log10(Math.abs(x))), m = x / Math.pow(10, e); const S = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }; return fmt(m, d) + '·10' + String(e).split('').map(c => S[c]).join(''); };
const PE = [[6.0, .23], [6.9, .60], [7.4, .81], [8.2, 1.14]];
function peDiagramm(c) {
  const [x, w, h] = fit(c, 380), mu = cv('--muted'), L = 46, px = f => L + f / 10 * (w - L - 14), py = E => 16 + (1.6 - E) / 4.2 * (h - 40);
  x.font = '12px ' + cv('--f-mono'); x.textAlign = 'center'; x.fillStyle = mu;
  for (let f = 0; f <= 10; f += .5) { x.strokeStyle = cv('--line'); x.lineWidth = f % 1 ? .5 : 1.1; x.beginPath(); x.moveTo(px(f), 16); x.lineTo(px(f), h - 22); x.stroke(); if (f % 1 === 0 && f > 0) x.fillText(f, px(f), py(0) + 15); }
  x.textAlign = 'right'; for (let k = -13; k <= 8; k++) { const E = k / 5, m = k % 5 === 0; x.strokeStyle = cv('--line'); x.lineWidth = m ? 1.1 : .5; x.beginPath(); x.moveTo(L, py(E)); x.lineTo(w - 14, py(E)); x.stroke(); if (m) x.fillText(fmt(E, 0), L - 6, py(E) + 4); }
  x.strokeStyle = mu; x.lineWidth = 1.5; x.beginPath(); x.moveTo(L, py(0)); x.lineTo(w - 14, py(0)); x.moveTo(L, 16); x.lineTo(L, h - 22); x.stroke();
  x.textAlign = 'start'; x.fillText('E_kin,max in eV', L + 6, 12); x.textAlign = 'right'; x.fillText('f in 10¹⁴ Hz', w - 16, py(0) - 8); x.textAlign = 'start';
  x.strokeStyle = cv('--green'); x.lineWidth = 1.6; x.setLineDash([6, 4]); x.beginPath(); x.moveTo(px(0), py(-2.25)); x.lineTo(px(9.4), py(H * 9.4e14 / QE - 2.25)); x.stroke(); x.setLineDash([]);
  x.fillStyle = cv('--green'); PE.forEach(p => { x.beginPath(); x.arc(px(p[0]), py(p[1]), 5, 0, 7); x.fill(); });
}
function trefferbild(c) {
  const [x, w, h] = fit(c, 150), n = [30, 300, 3000], pw = (w - 20) / 3; let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647, P = u => Math.pow(Math.sin(Math.PI * u * 1.08 + 1e-9) / (Math.PI * u * 1.08 + 1e-9), 2) * Math.pow(Math.cos(Math.PI * u * 4.5), 2);
  x.font = '12px ' + cv('--f-mono');
  n.forEach((N, k) => { const x0 = 5 + k * (pw + 5); x.fillStyle = '#060A10'; x.fillRect(x0, 4, pw, 118); x.fillStyle = '#58C9F2'; for (let i = 0; i < N; i++) { let u; do { u = r() * 2 - 1; } while (r() > P(u)); x.fillRect(x0 + pw / 2 + u * (pw / 2 - 4), 8 + r() * 110, 1.8, 1.8); } x.fillStyle = cv('--ink'); x.fillText(N + ' Elektronen', x0 + 4, 140); });
}
function hSchema(c) {
  const [x, w, h] = fit(c, 240), ink = cv('--ink'), mu = cv('--muted'), Y = [0, 214, 112, 66, 44, 30], x1 = 76, x2 = w - 110; x.font = '13px ' + cv('--f-mono');
  for (let n = 1; n <= 5; n++) { x.strokeStyle = ink; x.lineWidth = 2; x.beginPath(); x.moveTo(x1, Y[n]); x.lineTo(x2, Y[n]); x.stroke(); x.fillStyle = ink; if (n <= 4) x.fillText('n = ' + n, 10, Y[n] + 4); }
  x.fillText('−13,6 eV', x2 + 8, Y[1] + 4); x.fillText('−3,40 eV', x2 + 8, Y[2] + 4); x.fillText('E₃', x2 + 8, Y[3] + 4); x.fillText('E₄', x2 + 8, Y[4] + 4);
  x.setLineDash([5, 4]); x.strokeStyle = mu; x.beginPath(); x.moveTo(x1, 12); x.lineTo(x2, 12); x.stroke(); x.setLineDash([]); x.fillText('0 eV', x2 + 8, 16); x.fillStyle = mu; x.fillText('(nicht maßstäblich)', x1, 236);
}
function roentgen(c) {
  const [x, w, h] = fit(c, 260), mu = cv('--muted'), L = 40, B = h - 30, px = l => L + l / 120 * (w - L - 12), py = v => B - v / 1.45 * (B - 14), lm = 35.4;
  x.font = '12px ' + cv('--f-mono'); x.fillStyle = mu; x.textAlign = 'center';
  for (let l = 0; l <= 120; l += 2) { x.strokeStyle = cv('--line'); x.lineWidth = l % 10 ? .4 : 1.1; x.beginPath(); x.moveTo(px(l), 14); x.lineTo(px(l), B); x.stroke(); if (l % 10 === 0) x.fillText(l, px(l), h - 12); }
  x.textAlign = 'start'; x.fillText('Intensität', 8, 12); x.textAlign = 'right'; x.fillText('λ in pm', w - 12, h - 1); x.textAlign = 'start'; x.strokeStyle = mu; x.lineWidth = 1.2; x.beginPath(); x.moveTo(L, 14); x.lineTo(L, B); x.lineTo(w - 12, B); x.stroke();
  x.strokeStyle = cv('--blue'); x.lineWidth = 2.4; x.beginPath(); for (let i = 0; i <= 600; i++) { const l = i / 5; let v = l <= lm ? 0 : (l / lm - 1) / Math.pow(l / lm, 3) / .1481 * .7; v += .55 * Math.exp(-Math.pow((l - 71.1) / .9, 2)) + .26 * Math.exp(-Math.pow((l - 63.2) / .9, 2)); i ? x.lineTo(px(l), py(v)) : x.moveTo(px(l), py(v)); } x.stroke();
}

/* ===================== Aufgaben (selbst erstellt, im Stil der Abiturprüfung) ===================== */
const hFit = QE * (1.14 - .23) / 2.2e14 * 1e34, ek450 = HC / 450 - 2.25, v450 = Math.sqrt(2 * ek450 * QE / ME);
const v15 = Math.sqrt(2 * QE * 1500 / ME), l15 = H / (ME * v15), da15 = l15 * .8 / 500e-9;
const E1t = H * H / (8 * ME * 25e-20) / QE, dvA = H / (4 * Math.PI * 1e-10 * ME);
const TASKS = [
{ id: 'Q1', tab: 'Photoeffekt', title: 'Aufgabe 1 · Photoeffekt mit der Gegenfeldmethode', mat: peDiagramm, matT: 'Material: Messergebnisse für eine Photozelle (mit Ausgleichsgerade)',
  intro: 'Die Kathode einer Vakuum-Photozelle wird nacheinander mit Licht verschiedener Frequenzen beleuchtet. Zu jeder Frequenz wird mit der Gegenfeldmethode die maximale kinetische Energie der ausgelösten Elektronen bestimmt. Das Material zeigt die Messpunkte.',
  parts: [
    { nr: '1.1', afb: 'I', q: '<b>Beschreibe</b>, wie man mit der Gegenfeldmethode die maximale kinetische Energie der Elektronen bestimmt.',
      comps: [{ kind: 'choice', be: 1, q: 'Vorgehen:', opts: ['Man erhöht die Gegenspannung zwischen Kathode und Anode, bis der Photostrom gerade null wird.', 'Man erhöht die Lichtintensität, bis der Photostrom nicht weiter steigt.', 'Man misst die Zeit, die die Elektronen bis zur Anode brauchen.'], correct: 0 }, { kind: 'choice', be: 1, q: 'Auswertung:', opts: ['E<sub>kin,max</sub> = e · U₀', 'E<sub>kin,max</sub> = U₀ / e', 'E<sub>kin,max</sub> = h · U₀'], correct: 0 }],
      help: ['Die Elektronen müssen gegen ein elektrisches Feld anlaufen.', 'Auch die schnellsten Elektronen schaffen es gerade nicht mehr, wenn ihre gesamte kinetische Energie in elektrische Energie e · U₀ umgewandelt ist.'],
      solution: 'Zwischen Kathode und Anode wird eine Gegenspannung angelegt, die die Elektronen bremst. Man erhöht sie, bis der Photostrom gerade null ist (U₀). Dann gilt für die schnellsten Elektronen E<sub>kin,max</sub> = e · U₀.' },
    { nr: '1.2', afb: 'II', q: '<b>Bestimme</b> aus dem Diagramm die Grenzfrequenz und die Austrittsarbeit des Kathodenmaterials.',
      comps: [{ kind: 'num', be: 2, label: 'f_g =', unit: '·10¹⁴ Hz', value: 2.25 * QE / H / 1e14, abs: .25, d: 1 }, { kind: 'num', be: 2, label: 'W_A =', unit: 'eV', value: 2.25, abs: .12, d: 2 }],
      help: ['Die Grenzfrequenz ist die Frequenz, bei der die Elektronen gerade keine kinetische Energie mehr haben: Schnittpunkt der Geraden mit der Rechtsachse.', 'E<sub>kin,max</sub> = h · f − W<sub>A</sub>: Für f = 0 liest man −W<sub>A</sub> ab (Schnittpunkt mit der Hochachse).'],
      solution: '<div class="mono">Schnittpunkt mit der f-Achse: f_g ≈ 5,4·10¹⁴ Hz\nSchnittpunkt mit der Hochachse: −2,25 eV  ⇒  W_A ≈ 2,25 eV\nKontrolle: W_A = h · f_g = 6,626·10⁻³⁴ Js · 5,4·10¹⁴ Hz = 3,6·10⁻¹⁹ J = 2,2 eV</div>' },
    { nr: '1.3', afb: 'II', q: '<b>Bestimme</b> aus den Messpunkten (6,0 | 0,23) und (8,2 | 1,14) das Planck’sche Wirkungsquantum.',
      comps: [{ kind: 'num', be: 3, label: 'h =', unit: '·10⁻³⁴ Js', value: hFit, tol: .04, d: 2 }],
      help: ['h ist die Steigung der Geraden: h = ΔE / Δf.', 'ΔE = 1,14 eV − 0,23 eV = 0,91 eV. In Joule umrechnen: mal 1,602·10⁻¹⁹.', 'Δf = (8,2 − 6,0)·10¹⁴ Hz = 2,2·10¹⁴ Hz'],
      solution: `<div class="mono">h = ΔE / Δf = 0,91 eV / 2,2·10¹⁴ Hz\nh = 0,91 · 1,602·10⁻¹⁹ J / 2,2·10¹⁴ Hz = ${fmt(hFit, 2)}·10⁻³⁴ Js</div>` },
    { nr: '1.4', afb: 'II', q: 'Die Kathode wird mit blauem Licht der Wellenlänge 450 nm beleuchtet. <b>Berechne</b> die maximale kinetische Energie und die maximale Geschwindigkeit der Elektronen (W<sub>A</sub> = 2,25 eV).',
      comps: [{ kind: 'num', be: 2, label: 'E_kin =', unit: 'eV', value: ek450, tol: .04, d: 2 }, { kind: 'num', be: 2, label: 'v_max =', unit: 'm/s', value: v450, tol: .04 }],
      help: ['Photonenenergie: E = h · c / λ. Praktisch: 1240 eV·nm / 450 nm.', 'E<sub>kin,max</sub> = h · f − W<sub>A</sub>', 'Für die Geschwindigkeit E<sub>kin</sub> in Joule umrechnen, dann v = √(2 · E<sub>kin</sub> / m).'],
      solution: `<div class="mono">E_Photon = h · c / λ = ${fmt(HC / 450, 2)} eV\nE_kin,max = ${fmt(HC / 450, 2)} eV − 2,25 eV = ${fmt(ek450, 2)} eV = ${sci(ek450 * QE)} J\nv_max = √(2 · E_kin / m) = √(2 · ${sci(ek450 * QE)} J / 9,109·10⁻³¹ kg) = ${sci(v450)} m/s</div>` },
    { nr: '1.5', afb: 'III', q: '<b>Erläutere</b>, warum die Ergebnisse des Versuchs nicht mit dem Wellenmodell des Lichts erklärt werden können.',

/* ===================== Stand ===================== */
let ST = { parts: {}, tab: 0 };
let appLive = false;
const changed = () => { if (window.AppBridge && appLive) AppBridge.changed(); };
const PARTS = []; TASKS.forEach(t => t.parts.forEach(p => { p.id = p.nr; p.task = t; p.be = p.comps.reduce((a, c) => a + c.be, 0); PARTS.push(p); }));
const ps = id => ST.parts[id] || (ST.parts[id] = { hints: 0, shown: false, comp: {} });
const earned = p => { const s = ST.parts[p.id]; return s ? p.comps.reduce((a, c, i) => a + ((s.comp[i] && s.comp[i].be) || 0), 0) : 0; };
const NAMES = { solo: 'selbst geschafft', help: 'mit Hilfe geschafft', err: 'bearbeitet, mit Fehlern', shown: 'Lösung angesehen', part: 'angefangen', '': 'offen' };
function status(p) {
  const s = ST.parts[p.id]; if (!s) return '';
  if (s.shown) return 'shown';
  const done = p.comps.every((c, i) => s.comp[i] && s.comp[i].ok), full = earned(p) === p.be;
  if (done) return !full ? 'err' : s.hints ? 'help' : 'solo';
  return (s.hints || Object.keys(s.comp).length) ? 'part' : '';
}
const closed = p => ['solo', 'help', 'err', 'shown'].includes(status(p));
function score() {
  let now = 0, max = 0; PARTS.forEach(p => { now += earned(p); max += p.be; }); $('#scoreNow').textContent = now; $('#scoreMax').textContent = max;
  document.querySelectorAll('nav button[data-i]').forEach(b => { const t = TASKS[+b.dataset.i]; b.querySelector('.n').textContent = t.parts.reduce((a, p) => a + earned(p), 0) + '/' + t.parts.reduce((a, p) => a + p.be, 0); });
}

/* ===================== Anzeige ===================== */
function tabs() {
  const n = $('#tabs'); n.innerHTML = '';
  TASKS.forEach((t, i) => { const b = el('button', '', `${t.tab}<span class="n"></span>`); b.type = 'button'; b.dataset.i = i; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', ST.tab === i); b.onclick = () => show(i); n.appendChild(b); });
  const b = el('button', '', 'Auswertung'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', ST.tab === TASKS.length); b.onclick = () => show(TASKS.length); n.appendChild(b);
}
function show(i, quiet) {
  ST.tab = i; tabs(); const m = $('#main'); m.innerHTML = '';
  if (i >= TASKS.length) auswertung(m); else aufgabe(m, TASKS[i]);
  score(); if (!quiet) { window.scrollTo({ top: 0 }); changed(); }
}
let redraw = null;
function aufgabe(m, t) {
  const c = el('div', 'card'); c.innerHTML = `<h2>${t.title}</h2><p class="src">Aufgabe im Abi-Stil · Hilfsmittel: Taschenrechner, IQB-Formelsammlung · h = 6,626·10⁻³⁴ Js, c = 2,998·10⁸ m/s, e = 1,602·10⁻¹⁹ C, m<sub>e</sub> = 9,109·10⁻³¹ kg</p><p class="lead">${t.intro}</p>`;
  redraw = null;
  if (t.mat) { const mt = el('div', 'mat', `<div class="mh">${t.matT}</div>`), cvs = el('canvas'); mt.appendChild(cvs); c.appendChild(mt); redraw = () => t.mat(cvs); }
  m.appendChild(c); if (redraw) redraw();
  t.parts.forEach(p => m.appendChild(teil(p)));
}
function teil(p) {
  const s = ps(p.id), d = el('div', 'task');
  d.innerHTML = `<div class="thead"><div><span class="tnr">${p.nr}</span><span class="be">${p.be} BE · AFB ${p.afb}</span></div><span class="status"></span></div><p class="qtext">${p.q}</p>`;
  const stat = d.querySelector('.status'), upd = () => { const st = status(p); d.className = 'task ' + (st === 'part' ? '' : st); stat.className = 'status ' + (st === 'part' ? '' : st); stat.textContent = NAMES[st] + (closed(p) ? ` · ${earned(p)}/${p.be} BE` : ''); bh.disabled = s.shown || s.hints >= p.help.length; bh.textContent = s.hints >= p.help.length ? 'Alle Hilfen offen' : `Hilfe ${s.hints + 1} von ${p.help.length}`; bl.disabled = s.shown || !!sb.firstChild; if (!bl.disabled && closed(p)) bl.textContent = 'Musterlösung ansehen'; score(); };
  const lock = [];
  p.comps.forEach((c, i) => {
    const box = el('div', 'comp'), fb = el('div', 'fb'); fb.hidden = true;
    if (c.kind === 'num') {
      box.innerHTML = `<div class="ansrow"><label>${c.label}</label><input type="text" inputmode="decimal" autocomplete="off" aria-label="${c.label}"><span class="unit">${c.unit}</span><button class="btn" type="button">Prüfen</button></div>`;
      const inp = box.querySelector('input'), bt = box.querySelector('button');
      const fin = () => { inp.disabled = bt.disabled = true; inp.classList.remove('no'); inp.classList.add('ok'); };
      const check = () => {
        const x = parse(inp.value); if (isNaN(x)) { fb.hidden = false; fb.className = 'fb tip'; fb.textContent = 'Gib eine Zahl ein, zum Beispiel 6,35 oder 6,35e-7.'; return; }
        if (Math.abs(x - c.value) <= (c.abs != null ? c.abs : Math.abs(c.value) * c.tol)) { s.comp[i] = { ok: true, be: c.be, v: inp.value }; fin(); fb.hidden = false; fb.className = 'fb good'; fb.textContent = 'Richtig.'; }
        else { s.comp[i] = { ok: false, be: 0, v: inp.value, n: ((s.comp[i] && s.comp[i].n) || 0) + 1 }; inp.classList.add('no'); fb.hidden = false; fb.className = 'fb bad'; const q = Math.log10(Math.abs(x / c.value)); fb.innerHTML = Math.abs(q - Math.round(q)) < .02 && Math.round(q) ? `Die Ziffern stimmen, die Zehnerpotenz nicht. Gefragt ist das Ergebnis in <b>${c.unit || 'der Grundeinheit'}</b>.` : 'Das stimmt noch nicht. Rechne noch einmal nach oder nimm eine Hilfe.'; }
        upd(); changed();
      };
      bt.onclick = check; inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      if (s.comp[i]) { inp.value = s.comp[i].v || ''; if (s.comp[i].ok) fin(); }
      lock.push(() => { inp.disabled = bt.disabled = true; if (!(s.comp[i] && s.comp[i].ok)) inp.value = (inp.value ? inp.value + '  →  ' : '') + (Math.abs(c.value) >= 1e5 ? sci(c.value) : fmt(c.value, c.d == null ? 1 : c.d)); });
    } else {
      box.innerHTML = `<p class="cq">${c.q}</p>`; const ob = el('div', 'opts'), bs = [];
      const fin = pick => bs.forEach(([b, k]) => { b.disabled = true; if (k === c.correct) b.classList.add('ok'); else if (k === pick) b.classList.add('no'); });
      c.opts.map((_, k) => k).sort(() => Math.random() - .5).forEach(k => {
        const b = el('button', '', c.opts[k]); b.type = 'button'; bs.push([b, k]); ob.appendChild(b);
        b.onclick = () => { const ok = k === c.correct; s.comp[i] = { ok: true, be: ok ? c.be : 0, v: k }; fin(k); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad'); fb.innerHTML = ok ? 'Richtig.' : ((c.fb && c.fb[k]) || 'Das war nicht richtig. Die richtige Antwort ist grün markiert.'); upd(); changed(); };
      });
      box.appendChild(ob); if (s.comp[i]) fin(s.comp[i].v); lock.push(() => fin(s.comp[i] ? s.comp[i].v : -1));
    }
    box.appendChild(fb); d.appendChild(box);
  });
  const tools = el('div', 'tools'), bh = el('button', 'btn blue'), bl = el('button', 'btn orange', 'Lösung zeigen'), hb = el('div'), sb = el('div'); bh.type = bl.type = 'button';
  const tips = () => { hb.innerHTML = ''; p.help.slice(0, s.hints).forEach((t, k) => hb.appendChild(el('div', 'fb tip', `<b>Hilfe ${k + 1}:</b> ${t}`))); };
  const sol = () => { sb.innerHTML = ''; sb.appendChild(el('div', 'fb sol', `<b>Lösung:</b> ${p.solution}`)); lock.forEach(f => f()); };
  bh.onclick = () => { s.hints++; tips(); upd(); changed(); };
  bl.onclick = () => { if (closed(p)) { sb.appendChild(el('div', 'fb sol', `<b>Lösung:</b> ${p.solution}`)); upd(); return; } if (!confirmSol(bl)) return; s.shown = true; sol(); upd(); changed(); };
  tools.append(bh, bl); d.append(tools, hb, sb); tips(); if (s.shown) sol();
  upd(); return d;
}
function confirmSol(b) { // zweimal tippen statt Dialogfenster
  if (b.dataset.arm) return true; b.dataset.arm = 1; b.textContent = 'Wirklich? Dann gibt es hier keine BE mehr.'; setTimeout(() => { if (!b.disabled) { delete b.dataset.arm; b.textContent = 'Lösung zeigen'; } }, 4000); return false;
}
function auswertung(m) {
  redraw = null; const c = el('div', 'card'); let now = 0, max = 0, rows = '';
  TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), mx = t.parts.reduce((a, p) => a + p.be, 0); now += e; max += mx;
    rows += `<tr><td><b>${t.title}</b><div class="legend">${t.parts.map(p => `<span class="status ${status(p) === 'part' ? '' : status(p)}">${p.nr} ${NAMES[status(p)]}</span>`).join('')}</div></td><td class="r">${e} / ${mx}</td></tr>`; });
  const offen = PARTS.filter(p => !closed(p)).length, pr = max ? Math.round(100 * now / max) : 0;
  c.innerHTML = `<h2>Auswertung</h2><p class="lead">Du hast <b>${now} von ${max} BE</b> (${pr} %). ${offen ? `Noch ${offen} Teilaufgaben offen.` : 'Alle Teilaufgaben bearbeitet.'}</p><table class="aus"><tr><th>Aufgabe</th><th class="r">BE</th></tr>${rows}</table>
  <p class="small" style="margin-top:14px">So wird gezählt: Rechenergebnisse darfst du beliebig oft prüfen. Bei Auswahlfragen zählt nur der erste Versuch. Hilfen kosten keine BE, werden aber im Status vermerkt. Nach „Lösung zeigen“ gibt es für offene Felder keine BE mehr.<br>Im echten Abi zählen außerdem Ansatz, Rechenweg und Einheiten. Schreib deine Lösungen deshalb immer vollständig auf Papier und vergleiche am Ende mit der Musterlösung.</p>`;
  m.appendChild(c);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => redraw && redraw(), 120); });
show(0, true);

/* ===================== Anbindung an die Klassen-App (ohne Namen) ===================== */
if (window.AppBridge) {
  setTimeout(() => { appLive = true; }, 1500);
  const name = t => t.id + ' · ' + t.tab;
  AppBridge.register({
    getState() {
      const details = {}; let punkte = 0;
      TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), m = t.parts.reduce((a, p) => a + p.be, 0); punkte += e;
        details[name(t)] = `${e} von ${m} BE · ` + t.parts.map(p => p.nr + ' ' + NAMES[status(p)] + (ST.parts[p.id] && ST.parts[p.id].hints ? ` (${ST.parts[p.id].hints} Hilfen)` : '')).join(', '); });
      return { punkte, stationen: TASKS.map(name), erledigt: TASKS.filter(t => t.parts.every(closed)).map(name), details, daten: { v: 1, ST } };
    },
    setState(s) { const d = s && s.daten; if (!d || !d.ST) return; ST = Object.assign({ parts: {}, tab: 0 }, d.ST); appLive = true; show(Math.min(ST.tab || 0, TASKS.length), true); }
  });
}
