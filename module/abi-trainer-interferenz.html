<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abi-Trainer Interferenz</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: Kopf mit BE-Stand, Tabs je Aufgabe, je Teilaufgabe eine Karte mit Antwortfeldern, Hilfe-Treppe und Lösung; letzter Tab = Auswertung */
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#15253A; --muted:#58697C; --line:#D3DCE6;
  --navy:#1F3A5F; --green:#3C7A4E; --greenSoft:#E2F0E5; --navySoft:#E3EAF3;
  --orange:#C2571A; --blue:#2F6FB5; --blueSoft:#E1ECF8; --bad:#B3261E; --badSoft:#FBE6E4; --warnSoft:#FFF3D6;
  --f-display:"Bricolage Grotesque",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1621; --panel:#162131; --ink:#E5ECF4; --muted:#9BABBD; --line:#2A3A4F;
  --navy:#93B4DE; --green:#6FC089; --greenSoft:#1B3325; --navySoft:#1B293C;
  --orange:#F09A5E; --blue:#7FB2EE; --blueSoft:#1A2C44; --bad:#F2918A; --badSoft:#3B1F1E; --warnSoft:#3A321C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:15px;color:var(--muted);margin-top:6px}
.score{font-family:var(--f-mono);font-size:15px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.score b{color:var(--green);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
nav button{flex:0 0 auto;font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
nav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
nav button[aria-selected="true"] .n{color:var(--bg);opacity:.8}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;min-width:0;margin-bottom:16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 4px;color:var(--navy);text-wrap:balance}
.src{font-size:14px;color:var(--green);margin:0 0 10px}
.lead{margin:0 0 10px}
.task{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
.task.solo{border-color:var(--green)} .task.help{border-color:var(--blue)} .task.shown,.task.err{border-color:var(--orange)}
.thead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tnr{font-family:var(--f-mono);font-weight:700;color:var(--green);margin-right:8px}
.be{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.status{font-size:13.5px;border-radius:999px;padding:2px 10px;background:var(--navySoft);white-space:nowrap}
.status.solo{background:var(--greenSoft)} .status.help{background:var(--blueSoft)} .status.shown,.status.err{background:var(--warnSoft)}
.qtext{margin:8px 0 10px}
.qtext b{color:var(--navy)}
.mat{border-left:4px solid var(--green);padding:6px 0 6px 12px;margin:10px 0}
.mat .mh{font-weight:700;color:var(--green);font-size:15px;margin-bottom:6px}
canvas{display:block;width:100%;max-width:100%;border-radius:10px;background:var(--bg)}
.comp{margin-top:12px}
.comp .cq{font-weight:700;margin:0 0 6px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ansrow label{font-weight:700;font-family:var(--f-mono);min-width:4.2em}
.ansrow input{font:inherit;font-family:var(--f-mono);font-size:18px;width:8em;max-width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.unit{font-family:var(--f-mono);color:var(--muted);min-width:2.4em}
.ok{border-color:var(--green)!important;background:var(--greenSoft)!important}
.no{border-color:var(--bad)!important;background:var(--badSoft)!important}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.opts button:disabled{cursor:default;opacity:1}
.btn{font:inherit;font-size:16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--navy);color:var(--bg);padding:9px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.blue{background:transparent;border-color:var(--blue);color:var(--blue)}
.btn.orange{background:transparent;border-color:var(--orange);color:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{border-radius:10px;padding:9px 13px;margin-top:8px;font-size:16px}
.fb.good{background:var(--greenSoft);border:1.5px solid var(--green)}
.fb.bad{background:var(--badSoft);border:1.5px solid var(--bad)}
.fb.tip{background:var(--blueSoft);border:1.5px solid var(--blue)}
.fb.sol{background:var(--warnSoft);border:1.5px solid var(--orange)}
.mono{font-family:var(--f-mono);font-size:14.5px;line-height:1.8;white-space:pre-wrap}
.small{font-size:14.5px;color:var(--muted)}
table.aus{border-collapse:collapse;width:100%;font-size:15.5px}
table.aus th,table.aus td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.aus td.r,table.aus th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Abi-Trainer Interferenz<small>TG2 · Aufgaben im Abi-Stil zu Doppelspalt und Gitter · Formelzeichen wie in der IQB-Formelsammlung</small></h1>
  <div class="score" aria-live="polite">BE: <b id="scoreNow">0</b> / <span id="scoreMax">0</span></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
</div>

<script src="../bridge.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function parse(v) { v = String(v).trim().replace(/\s/g, '').replace(/,/g, '.').replace(/−/g, '-').replace(/[·*x×]10\^?/i, 'e'); if (v === '') return NaN; const n = Number(v); return isFinite(n) ? n : NaN; }
function fit(c, h) { const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + 'px'; const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h); return [x, w, h]; }

/* ===================== Material-Zeichnungen ===================== */
function setup(c, o) { // Schemazeichnung: Quelle – Blende – Schirm (nicht maßstäblich)
  const [x, w, h] = fit(c, 170), ink = cv('--ink'), mu = cv('--muted'), xs = Math.min(190, w * .32), xe = w - 70, my = 76, col = o.col || '#E0331F';
  x.font = '13px ' + cv('--f-mono'); x.lineWidth = 2;
  x.fillStyle = cv('--navy'); x.fillRect(8, my - 13, 64, 26); x.fillStyle = cv('--bg'); x.fillText(o.src || 'Laser', 14, my + 5);
  x.strokeStyle = col; x.beginPath(); x.moveTo(72, my); x.lineTo(xs, my); x.stroke();
  x.fillStyle = ink; x.fillRect(xs - 3, 10, 6, my - 10 - 9); x.fillRect(xs - 3, my - 4, 6, 8); x.fillRect(xs - 3, my + 9, 6, 136 - my - 9); x.fillRect(xe - 2, 6, 4, 132);
  x.strokeStyle = mu; x.lineWidth = 1; x.setLineDash([5, 5]); x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, my); x.stroke(); x.setLineDash([]);
  const ya = my - 46; x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, ya); x.stroke(); x.fillStyle = col; x.beginPath(); x.arc(xe, ya, 5, 0, 7); x.fill(); x.beginPath(); x.arc(xe, my, 5, 0, 7); x.fill();
  x.fillStyle = ink; x.fillText(o.mid || 'Doppelspalt', xs - 42, 156); x.fillText(o.end || 'Schirm', xe - 24, 156); x.fillText('α', xs + 50, my - 5);
  x.fillText('k = 0', xe + 10, my + 4); x.fillText(o.k || 'k = 1', xe + 10, ya + 4);
  x.strokeStyle = cv('--orange'); x.beginPath(); x.moveTo(xe - 14, my); x.lineTo(xe - 14, ya); x.stroke(); x.fillStyle = cv('--orange'); x.fillText(o.a || 'a₁', xe - 38, (my + ya) / 2 + 4);
  x.strokeStyle = mu; x.lineWidth = 1; x.beginPath(); x.moveTo(xs + 8, 128); x.lineTo(xe - 8, 128); x.stroke(); x.fillStyle = mu; x.fillText(o.e || 'e', (xs + xe) / 2 - 10, 123);
}
const MW = { g: 9, lam: 3.152 };
function messkurve(c) { // Mikrowellen: Empfängerspannung über dem Winkel
  const [x, w, h] = fit(c, 250), mu = cv('--muted'), L = 44, B = h - 34, px = a => L + (a + 70) / 140 * (w - L - 12), py = v => B - v / 5 * (B - 14);
  x.font = '12px ' + cv('--f-mono'); x.textAlign = 'center';
  for (let a = -70; a <= 70; a += 5) { x.strokeStyle = cv('--line'); x.lineWidth = a % 10 ? .6 : 1.2; x.beginPath(); x.moveTo(px(a), 14); x.lineTo(px(a), B); x.stroke(); if (a % 10 === 0 && (w > 520 || a % 20 === 0)) { x.fillStyle = mu; x.fillText(a, px(a), B + 15); } }
  x.textAlign = 'right'; for (let v = 0; v <= 5; v++) { x.strokeStyle = cv('--line'); x.lineWidth = 1; x.beginPath(); x.moveTo(L, py(v)); x.lineTo(w - 12, py(v)); x.stroke(); x.fillStyle = mu; x.fillText(v, L - 6, py(v) + 4); }
  x.textAlign = 'start'; x.fillStyle = mu; x.fillText('U in V', L + 8, 12); x.textAlign = 'right'; x.fillText('α in °', w - 12, h - 4); x.textAlign = 'start';
  x.strokeStyle = cv('--green'); x.lineWidth = 2.4; x.beginPath();
  for (let a = -70; a <= 70; a += .25) { const s = Math.sin(rad(a)), v = 4.6 * Math.pow(Math.cos(Math.PI * MW.g * s / MW.lam), 2) * Math.pow(Math.cos(rad(a)), 1.3) + .08; a === -70 ? x.moveTo(px(a), py(v)) : x.lineTo(px(a), py(v)); }
  x.stroke();
}
function cdbild(c) {
  const [x, w, h] = fit(c, 180), ink = cv('--ink'), mu = cv('--muted'), xc = Math.min(120, w * .22), xw = w - 80, my = 96;
  x.font = '13px ' + cv('--f-mono');
  x.fillStyle = ink; x.fillRect(xw - 2, 8, 4, 150); x.fillStyle = cv('--navy'); x.fillRect(xw + 6, my - 12, 62, 24); x.fillStyle = cv('--bg'); x.fillText('Laser', xw + 14, my + 5);
  const gr = x.createLinearGradient(0, my - 44, 0, my + 44); gr.addColorStop(0, '#B9C6D6'); gr.addColorStop(.5, '#E9EEF4'); gr.addColorStop(1, '#B9C6D6'); x.fillStyle = gr; x.fillRect(xc - 5, my - 44, 10, 88);
  x.strokeStyle = '#E0331F'; x.lineWidth = 2; x.beginPath(); x.moveTo(xw + 6, my); x.lineTo(xc + 5, my); x.stroke();
  [[-1, 'k = 1'], [1, 'k = 1']].forEach(([sg, t]) => { const ya = my + sg * 62; x.beginPath(); x.moveTo(xc + 5, my); x.lineTo(xw - 2, ya); x.stroke(); x.fillStyle = '#E0331F'; x.beginPath(); x.arc(xw - 2, ya, 5, 0, 7); x.fill(); x.fillStyle = ink; if (sg < 0) x.fillText(t, xw - 62, ya - 4); });
  x.fillStyle = ink; x.fillText('CD', xc - 10, 172); x.fillText('Wand mit Loch', xw - 108, 174); x.fillText('α₁', xc + 46, my - 8);
  x.strokeStyle = cv('--orange'); x.beginPath(); x.moveTo(xw - 16, my); x.lineTo(xw - 16, my - 62); x.stroke(); x.fillStyle = cv('--orange'); x.fillText('a₁', xw - 40, my - 26);
  x.strokeStyle = mu; x.lineWidth = 1; x.beginPath(); x.moveTo(xc + 10, 150); x.lineTo(xw - 10, 150); x.stroke(); x.fillStyle = mu; x.fillText('e = 30 cm', (xc + xw) / 2 - 36, 145);
}

/* ===================== Aufgaben (selbst erstellt, im Stil der Abiturprüfung) ===================== */
const a2 = Math.asin(2 * 532e-9 / 4e-6), av = Math.asin(.1), ar = Math.asin(.175), acd = Math.asin(650 / 1600), advd = Math.atan(55 / 30);
const TASKS = [
{ id: 'A1', tab: 'Laser', title: 'Aufgabe 1 · Roter Laser am Doppelspalt', mat: c => setup(c, { e: 'e = 4,00 m', a: 'a₃', k: 'k = 3' }), matT: 'Versuchsaufbau (nicht maßstäblich)',
  intro: 'Das Licht eines roten Lasers fällt senkrecht auf einen Doppelspalt mit dem Spaltabstand g = 0,25 mm. Auf einem Schirm im Abstand e = 4,00 m beobachtet man helle Punkte in gleichen Abständen. Die beiden Maxima 3. Ordnung (links und rechts der Mitte) sind 6,1 cm voneinander entfernt.',
  parts: [
    { nr: '1.1', afb: 'I', q: '<b>Erkläre</b>, wie die hellen und dunklen Stellen auf dem Schirm entstehen.',
      comps: [
        { kind: 'choice', be: 1, q: 'Was passiert an den beiden Spalten?', opts: ['Von jedem Spalt geht eine Elementarwelle aus. Beide Wellen überlagern sich hinter dem Doppelspalt.', 'Das Licht wird an den Spalten gebrochen und in Farben zerlegt.', 'Die Spalte werfen zwei Schatten, dazwischen bleibt es hell.'], correct: 0 },
        { kind: 'choice', be: 1, q: 'Wann ist eine Stelle auf dem Schirm hell?', opts: ['Wenn der Gangunterschied der beiden Wellen ein ganzzahliges Vielfaches von λ ist (Δs = k · λ).', 'Wenn der Gangunterschied ein ungeradzahliges Vielfaches von λ/2 ist.', 'Wenn die Stelle genau hinter einem der Spalte liegt.'], correct: 0, fb: { 1: 'Das ist die Bedingung für Auslöschung, also für die dunklen Stellen.' } },
        { kind: 'choice', be: 1, q: 'Wann ist eine Stelle dunkel?', opts: ['Bei Δs = (2k − 1) · λ/2: Wellenberg trifft auf Wellental, die Wellen löschen sich aus.', 'Bei Δs = k · λ.', 'Wenn dort gar kein Licht ankommt, weil die Blende es abschattet.'], correct: 0 }],
      help: ['Denk an die Wellenwanne mit zwei Öffnungen (Huygens: jeder Spalt ist Ausgangspunkt einer Elementarwelle).', 'Entscheidend ist der Gangunterschied Δs: der Unterschied der beiden Wege bis zum Schirmpunkt.'],
      solution: 'Jeder Spalt ist Ausgangspunkt einer Elementarwelle. Die beiden Wellen sind kohärent und überlagern sich hinter dem Doppelspalt (Interferenz). Wo der Gangunterschied Δs = k · λ beträgt, verstärken sie sich (hell). Wo Δs = (2k − 1) · λ/2 beträgt, löschen sie sich aus (dunkel).' },
    { nr: '1.2', afb: 'II', q: '<b>Berechne</b> die Wellenlänge des Laserlichts.',
      comps: [{ kind: 'num', be: 1, label: 'a₃ =', unit: 'cm', value: 3.05, tol: .005, d: 2 }, { kind: 'num', be: 3, label: 'λ =', unit: 'nm', value: .0305 * .25e-3 / 12 * 1e9, tol: .02, d: 0 }],
      help: ['Die 6,1 cm sind der Abstand von Maximum zu Maximum 3. Ordnung. a₃ ist der Abstand von der <i>Mitte</i> bis zum Maximum 3. Ordnung, also die Hälfte.', 'Die Winkel sind sehr klein. Dann gilt sin α ≈ tan α und damit k · λ / g = a<sub>k</sub> / e.', 'Umgestellt: λ = a₃ · g / (3 · e). Alles in Metern einsetzen: a₃ = 0,0305 m, g = 0,25·10⁻³ m.'],
      solution: '<div class="mono">a₃ = 6,1 cm / 2 = 3,05 cm\nkleine Winkel: sin α₃ ≈ tan α₃  ⇒  3 · λ / g = a₃ / e\nλ = a₃ · g / (3 · e) = 0,0305 m · 0,25·10⁻³ m / (3 · 4,00 m)\nλ = 6,35·10⁻⁷ m ≈ 635 nm</div>' },
    { nr: '1.3', afb: 'II', q: '<b>Berechne</b>, wie weit das 2. Minimum von der Mitte des Schirms entfernt ist. Rechne mit λ = 635 nm.',
      comps: [{ kind: 'num', be: 3, label: 'a =', unit: 'mm', value: 1.5 * 635e-9 * 4 / .25e-3 * 1e3, tol: .02 }],
      help: ['Minima: Δs = (2k − 1) · λ/2. Für das 2. Minimum ist k = 2, also Δs = 3 · λ/2 = 1,5 · λ.', 'Das 2. Minimum liegt genau zwischen dem 1. und dem 2. Maximum.', 'a = 1,5 · λ · e / g'],
      solution: '<div class="mono">2. Minimum: Δs = (2·2 − 1) · λ/2 = 1,5 · λ\na = 1,5 · λ · e / g = 1,5 · 635·10⁻⁹ m · 4,00 m / 0,25·10⁻³ m\na = 1,52·10⁻² m ≈ 15,2 mm</div>' },
    { nr: '1.4', afb: 'II', q: 'Der rote Laser wird durch einen grünen Laser (λ = 532 nm) ersetzt. <b>Beschreibe</b>, wie sich das Bild auf dem Schirm ändert, und <b>berechne</b> den neuen Abstand benachbarter Maxima.',
      comps: [{ kind: 'choice', be: 1, q: 'Änderung:', opts: ['Die Punkte sind grün und liegen weiter auseinander.', 'Die Punkte sind grün und rücken enger zusammen.', 'Nur die Farbe ändert sich, die Abstände bleiben gleich.'], correct: 1 }, { kind: 'num', be: 2, label: 'Δa =', unit: 'mm', value: 532e-9 * 4 / .25e-3 * 1e3, tol: .02 }],
      help: ['a<sub>k</sub> = k · λ · e / g: Die Abstände sind proportional zu λ.', 'Benachbarte Maxima: Δa = a₁ − a₀ = λ · e / g.'],
      solution: '<div class="mono">Δa ~ λ: kleinere Wellenlänge → Maxima rücken zusammen.\nΔa = λ · e / g = 532·10⁻⁹ m · 4,00 m / 0,25·10⁻³ m = 8,5·10⁻³ m = 8,5 mm\n(vorher mit Rot: 10,2 mm)</div>' },
    { nr: '1.5', afb: 'III', q: 'Einer der beiden Spalte wird abgedeckt. <b>Entscheide begründet</b>, was man jetzt auf dem Schirm sieht.',
      comps: [{ kind: 'choice', be: 1, q: 'Beobachtung:', opts: ['Dasselbe Muster, nur halb so hell.', 'Die eng liegenden Punkte verschwinden. Es bleibt ein breiter heller Fleck.', 'Der Schirm bleibt völlig dunkel.'], correct: 1 }, { kind: 'choice', be: 2, q: 'Begründung:', opts: ['Durch einen Spalt kommt nur halb so viel Licht.', 'Es gibt nur noch eine Elementarwelle. Ohne zweite Welle kann es keine Interferenz zweier Spalte geben.', 'Ein einzelner Spalt lässt kein Laserlicht durch.'], correct: 1 }],
      help: ['Für das Punktmuster braucht man zwei Wellen mit einem Gangunterschied.'],
      solution: 'Die vielen eng liegenden Maxima verschwinden. Man sieht nur noch einen breiten hellen Fleck (das Beugungsbild des einzelnen Spalts). Begründung: Das Punktmuster entsteht durch die Überlagerung der Wellen aus <i>beiden</i> Spalten. Fehlt eine davon, gibt es keinen Gangunterschied zwischen zwei Spalten mehr.' }
  ] },
{ id: 'A2', tab: 'Gitter', title: 'Aufgabe 2 · Gitter und weißes Licht', mat: c => setup(c, { mid: 'Gitter', e: 'e = 1,20 m', a: 'a₂', k: 'k = 2', col: '#2FA84F' }), matT: 'Versuchsaufbau (nicht maßstäblich)',
  intro: 'Ein optisches Gitter hat 250 Striche pro Millimeter. Der Schirm steht im Abstand e = 1,20 m hinter dem Gitter.',
  parts: [
    { nr: '2.1', afb: 'I', q: '<b>Berechne</b> die Gitterkonstante g.', comps: [{ kind: 'num', be: 2, label: 'g =', unit: 'µm', value: 4, tol: .01 }],
      help: ['Die Gitterkonstante ist der Abstand zweier benachbarter Spalte: 1 mm geteilt durch die Zahl der Striche.'], solution: '<div class="mono">g = 1 mm / 250 = 0,004 mm = 4,0 µm = 4,0·10⁻⁶ m</div>' },
    { nr: '2.2', afb: 'II', q: 'Das Gitter wird mit einem grünen Laser (λ = 532 nm) beleuchtet. <b>Berechne</b> den Winkel α₂, unter dem das Maximum 2. Ordnung erscheint, und seinen Abstand a₂ von der Mitte des Schirms.',
      comps: [{ kind: 'num', be: 2, label: 'α₂ =', unit: '°', value: deg(a2), abs: .25 }, { kind: 'num', be: 2, label: 'a₂ =', unit: 'cm', value: 120 * Math.tan(a2), tol: .02 }],
      help: ['Beim Gitter sind die Winkel groß. Die Kleinwinkelnäherung ist nicht erlaubt.', 'Erst der Winkel: sin α₂ = 2 · λ / g. Taschenrechner auf Grad (DEG).', 'Dann der Schirm: tan α₂ = a₂ / e, also a₂ = e · tan α₂.'],

function status(p) {

function auswertung(m) {
  redraw = null; const c = el('div', 'card'); let now = 0, max = 0, rows = '';
  TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), mx = t.parts.reduce((a, p) => a + p.be, 0); now += e; max += mx;
    rows += `<tr><td><b>${t.title}</b><div class="legend">${t.parts.map(p => `<span class="status ${status(p) === 'part' ? '' : status(p)}">${p.nr} ${NAMES[status(p)]}</span>`).join('')}</div></td><td class="r">${e} / ${mx}</td></tr>`; });
  const offen = PARTS.filter(p => !closed(p)).length, pr = max ? Math.round(100 * now / max) : 0;
  c.innerHTML = `<h2>Auswertung</h2><p class="lead">Du hast <b>${now} von ${max} BE</b> (${pr} %). ${offen ? `Noch ${offen} Teilaufgaben offen.` : 'Alle Teilaufgaben bearbeitet.'}</p><table class="aus"><tr><th>Aufgabe</th><th class="r">BE</th></tr>${rows}</table>
  <p class="small" style="margin-top:14px">So wird gezählt: Rechenergebnisse darfst du beliebig oft prüfen. Bei Auswahlfragen zählt nur der erste Versuch. Hilfen kosten keine BE, werden aber im Status vermerkt. Nach „Lösung zeigen“ gibt es für offene Felder keine BE mehr.<br>Im echten Abi zählen außerdem Ansatz, Rechenweg und Einheiten. Schreib deine Lösungen deshalb immer vollständig auf Papier und vergleiche am Ende mit der Musterlösung.</p>`;
  m.appendChild(c);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => redraw && redraw(), 120); });
show(0, true);

/* ===================== Anbindung an die Klassen-App (ohne Namen) ===================== */
if (window.AppBridge) {
  setTimeout(() => { appLive = true; }, 1500);
  const name = t => t.id + ' · ' + t.tab;
  AppBridge.register({
    getState() {
      const details = {}; let punkte = 0;
      TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), m = t.parts.reduce((a, p) => a + p.be, 0); punkte += e;
        details[name(t)] = `${e} von ${m} BE · ` + t.parts.map(p => p.nr + ' ' + NAMES[status(p)] + (ST.parts[p.id] && ST.parts[p.id].hints ? ` (${ST.parts[p.id].hints} Hilfen)` : '')).join(', '); });
      return { punkte, stationen: TASKS.map(name), erledigt: TASKS.filter(t => t.parts.every(closed)).map(name), details, daten: { v: 1, ST } };
    },
    setState(s) { const d = s && s.daten; if (!d || !d.ST) return; ST = Object.assign({ parts: {}, tab: 0 }, d.ST); appLive = true; show(Math.min(ST.tab || 0, TASKS.length), true); }
  });
}
</script>
</body>
</html>
