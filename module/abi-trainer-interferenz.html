<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abi-Trainer Interferenz</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: Kopf mit BE-Stand, Tabs je Aufgabe, je Teilaufgabe eine Karte mit Antwortfeldern, Hilfe-Treppe und Lösung; letzter Tab = Auswertung */
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#15253A; --muted:#58697C; --line:#D3DCE6;
  --navy:#1F3A5F; --green:#3C7A4E; --greenSoft:#E2F0E5; --navySoft:#E3EAF3;
  --orange:#C2571A; --blue:#2F6FB5; --blueSoft:#E1ECF8; --bad:#B3261E; --badSoft:#FBE6E4; --warnSoft:#FFF3D6;
  --f-display:"Bricolage Grotesque",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1621; --panel:#162131; --ink:#E5ECF4; --muted:#9BABBD; --line:#2A3A4F;
  --navy:#93B4DE; --green:#6FC089; --greenSoft:#1B3325; --navySoft:#1B293C;
  --orange:#F09A5E; --blue:#7FB2EE; --blueSoft:#1A2C44; --bad:#F2918A; --badSoft:#3B1F1E; --warnSoft:#3A321C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:15px;color:var(--muted);margin-top:6px}
.score{font-family:var(--f-mono);font-size:15px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.score b{color:var(--green);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
nav button{flex:0 0 auto;font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
nav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
nav button[aria-selected="true"] .n{color:var(--bg);opacity:.8}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;min-width:0;margin-bottom:16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 4px;color:var(--navy);text-wrap:balance}
.src{font-size:14px;color:var(--green);margin:0 0 10px}
.lead{margin:0 0 10px}
.task{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
.task.solo{border-color:var(--green)} .task.help{border-color:var(--blue)} .task.shown,.task.err{border-color:var(--orange)}
.thead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tnr{font-family:var(--f-mono);font-weight:700;color:var(--green);margin-right:8px}
.be{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.status{font-size:13.5px;border-radius:999px;padding:2px 10px;background:var(--navySoft);white-space:nowrap}
.status.solo{background:var(--greenSoft)} .status.help{background:var(--blueSoft)} .status.shown,.status.err{background:var(--warnSoft)}
.qtext{margin:8px 0 10px}
.qtext b{color:var(--navy)}
.mat{border-left:4px solid var(--green);padding:6px 0 6px 12px;margin:10px 0}
.mat .mh{font-weight:700;color:var(--green);font-size:15px;margin-bottom:6px}
canvas{display:block;width:100%;max-width:100%;border-radius:10px;background:var(--bg)}
.comp{margin-top:12px}
.comp .cq{font-weight:700;margin:0 0 6px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ansrow label{font-weight:700;font-family:var(--f-mono);min-width:4.2em}
.ansrow input{font:inherit;font-family:var(--f-mono);font-size:18px;width:8em;max-width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.unit{font-family:var(--f-mono);color:var(--muted);min-width:2.4em}
.ok{border-color:var(--green)!important;background:var(--greenSoft)!important}
.no{border-color:var(--bad)!important;background:var(--badSoft)!important}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.opts button:disabled{cursor:default;opacity:1}
.btn{font:inherit;font-size:16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--navy);color:var(--bg);padding:9px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.blue{background:transparent;border-color:var(--blue);color:var(--blue)}
.btn.orange{background:transparent;border-color:var(--orange);color:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{border-radius:10px;padding:9px 13px;margin-top:8px;font-size:16px}
.fb.good{background:var(--greenSoft);border:1.5px solid var(--green)}
.fb.bad{background:var(--badSoft);border:1.5px solid var(--bad)}
.fb.tip{background:var(--blueSoft);border:1.5px solid var(--blue)}
.fb.sol{background:var(--warnSoft);border:1.5px solid var(--orange)}
.mono{font-family:var(--f-mono);font-size:14.5px;line-height:1.8;white-space:pre-wrap}
.small{font-size:14.5px;color:var(--muted)}
table.aus{border-collapse:collapse;width:100%;font-size:15.5px}
table.aus th,table.aus td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.aus td.r,table.aus th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.hinweis{background:var(--warnSoft);border:1.5px solid var(--orange);border-radius:10px;padding:9px 13px;margin:0 0 12px;font-size:16px}
.bilder{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0}
.bilder figure{margin:0}
.bilder img{display:block;width:260px;max-width:100%;border-radius:8px;border:1px solid var(--line)}
.bilder figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.sim canvas{background:#000}
.simctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:15px}
.simctl label{display:flex;align-items:center;gap:8px}
.simctl input[type=range]{width:150px;min-height:44px}
.simctl .v{font-family:var(--f-mono);min-width:5.5em}
.simctl .btn{min-width:64px}
/* Reiter Formeln */
nav button.ftab{font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin:12px 0}
.fbox{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.fbox h3{font-size:16px;margin:0 0 8px;color:var(--head,var(--navy))}
.fbox.extra{border-style:dashed}
.fbox .tag{display:inline-block;font-size:12.5px;font-weight:400;border-radius:999px;padding:1px 9px;margin-left:6px;background:var(--warnSoft);color:var(--ink);vertical-align:1px}
.fx{font-family:"Times New Roman",Georgia,serif;font-size:23px;margin:4px 0 6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.fx i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.15}
.frac>span:last-child{border-top:1.5px solid currentColor;padding-top:1px}
.fbox .bed{font-size:14.5px;color:var(--muted);margin:0}
table.sym td:first-child{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:19px;white-space:nowrap;width:2.2em}
table.sym td.u{font-family:var(--f-mono);font-size:14px;color:var(--muted);width:5em}
table.sym{hyphens:auto;-webkit-hyphens:auto}
.merk{border-radius:10px;padding:10px 14px;margin:12px 0}
.iqbbadge{display:inline-block;font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--head,#0B50C4);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.hinweis.iqb{background:var(--navySoft);border-color:var(--head,#0B50C4)}
.mdet{border:1.5px solid var(--line);border-radius:10px;padding:2px 12px;margin:8px 0;background:var(--panel)}
.mdet summary{cursor:pointer;font-weight:700;color:var(--green);min-height:44px;display:flex;align-items:center}
.mdet ul{margin:6px 0;padding-left:22px}
.mdet .mh{display:none}
.mimg{margin:8px 0}
.mimg img{display:block;width:100%;max-width:720px;background:#fff;border:1px solid var(--line);border-radius:6px}
.mimg figcaption{font-size:13.5px;color:var(--muted);margin-top:4px;font-style:italic}
.mtab td,.mtab th{font-size:15px}
.papier{font-size:15px;color:var(--muted);margin:4px 0 8px}
textarea.ta{display:block;width:100%;min-height:140px;font:inherit;font-size:17px;line-height:1.5;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
textarea.ta:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.chk{margin-top:10px;border:2px solid var(--orange);border-radius:10px;padding:10px 12px;background:var(--warnSoft)}
.chk .mh{font-weight:700;color:var(--orange);margin-bottom:6px}
.ci{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px;cursor:pointer}
.ci input{width:24px;height:24px;flex:0 0 auto;margin-top:2px;accent-color:var(--green)}
.ci .t{flex:1}
</style>
<style id="farben-b">
/* Farbschema B (Nov 2026): kräftiges Blau für Überschriften, stärkere Kontraste, Merke goldgelb */
:root{
  --bg:#E7EDF4; --panel:#FFFFFF; --ink:#0B1626; --muted:#37465A; --line:#A7B7CA;
  --navy:#13305A; --navySoft:#DCE7F7; --green:#22703C; --greenSoft:#DAF0E0;
  --bad:#A8201A; --badSoft:#FADFDB;
  --head:#0B50C4; --accent:#0B50C4; --givenLine:#B7CBEA;
  --merk:#E0A800; --merkSoft:#FFF6CC; --merkInk:#7A5C00;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121C; --panel:#152030; --ink:#F0F4F9; --muted:#B3C1D1; --line:#3A4C63;
  --navy:#9CC0F0; --navySoft:#1A2A40; --green:#74CC90; --greenSoft:#173523;
  --bad:#F59A93; --badSoft:#3E1E1C;
  --head:#7DB0FF; --accent:#4D8EF0; --givenLine:#2E4A70;
  --merk:#E8BE3A; --merkSoft:#3A3214; --merkInk:#F2CF5B;
}}
:root[data-theme="dark"]{
  --bg:#0B121C; --panel:#152030; --ink:#F0F4F9; --muted:#B3C1D1; --line:#3A4C63;
  --navy:#9CC0F0; --navySoft:#1A2A40; --green:#74CC90; --greenSoft:#173523;
  --bad:#F59A93; --badSoft:#3E1E1C;
  --head:#7DB0FF; --accent:#4D8EF0; --givenLine:#2E4A70;
  --merk:#E8BE3A; --merkSoft:#3A3214; --merkInk:#F2CF5B;
}
h1,h2,.card h2,.card h3{color:var(--head)}
.card h2,.card h3,h2{font-weight:800}
.card,.score,nav button{border-width:2px}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav button[aria-selected="true"] .n,nav button[aria-selected="true"] .done{color:#fff}
.given,.read{border:1.5px solid var(--givenLine)}
input[type=range]{accent-color:var(--accent)}
.merk{border-left:6px solid var(--merk);background:var(--merkSoft)}
.merk b{color:var(--merkInk)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Abi-Trainer Interferenz<small>TG2 · Übung zum Einstieg, Aufgaben im Abi-Stil und zwei originale IQB-Abiaufgaben zu Doppelspalt und Gitter · Formelzeichen wie in der IQB-Formelsammlung</small></h1>
  <div class="score" aria-live="polite">BE: <b id="scoreNow">0</b> / <span id="scoreMax">0</span></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
</div>

<script src="../bridge.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function parse(v) { v = String(v).trim().replace(/\s/g, '').replace(/,/g, '.').replace(/−/g, '-').replace(/[·*x×]10\^?/i, 'e'); if (v === '') return NaN; const n = Number(v); return isFinite(n) ? n : NaN; }
function fit(c, h) { const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + 'px'; const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h); return [x, w, h]; }

/* ===================== Material-Zeichnungen ===================== */
function setup(c, o) { // Schemazeichnung: Quelle – Blende – Schirm (nicht maßstäblich)
  const [x, w, h] = fit(c, 170), ink = cv('--ink'), mu = cv('--muted'), xs = Math.min(190, w * .32), xe = w - 70, my = 76, col = o.col || '#E0331F';
  x.font = '13px ' + cv('--f-mono'); x.lineWidth = 2;
  x.fillStyle = cv('--navy'); x.fillRect(8, my - 13, 64, 26); x.fillStyle = cv('--bg'); x.fillText(o.src || 'Laser', 14, my + 5);
  x.strokeStyle = col; x.beginPath(); x.moveTo(72, my); x.lineTo(xs, my); x.stroke();
  x.fillStyle = ink; x.fillRect(xs - 3, 10, 6, my - 10 - 9); x.fillRect(xs - 3, my - 4, 6, 8); x.fillRect(xs - 3, my + 9, 6, 136 - my - 9); x.fillRect(xe - 2, 6, 4, 132);
  x.strokeStyle = mu; x.lineWidth = 1; x.setLineDash([5, 5]); x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, my); x.stroke(); x.setLineDash([]);
  const ya = my - 46; x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, ya); x.stroke(); x.fillStyle = col; x.beginPath(); x.arc(xe, ya, 5, 0, 7); x.fill(); x.beginPath(); x.arc(xe, my, 5, 0, 7); x.fill();
  x.fillStyle = ink; x.fillText(o.mid || 'Doppelspalt', xs - 42, 156); x.fillText(o.end || 'Schirm', xe - 24, 156); x.fillText('α', xs + 50, my - 5);
  x.fillText('k = 0', xe + 10, my + 4); x.fillText(o.k || 'k = 1', xe + 10, ya + 4);
  x.strokeStyle = cv('--orange'); x.beginPath(); x.moveTo(xe - 14, my); x.lineTo(xe - 14, ya); x.stroke(); x.fillStyle = cv('--orange'); x.fillText(o.a || 'a₁', xe - 38, (my + ya) / 2 + 4);
  x.strokeStyle = mu; x.lineWidth = 1; x.beginPath(); x.moveTo(xs + 8, 128); x.lineTo(xe - 8, 128); x.stroke(); x.fillStyle = mu; x.fillText(o.e || 'e', (xs + xe) / 2 - 10, 123);
}
const MW = { g: 9, lam: 3.152 };
function messkurve(c) { // Mikrowellen: Empfängerspannung über dem Winkel
  const [x, w, h] = fit(c, 250), mu = cv('--muted'), L = 44, B = h - 34, px = a => L + (a + 70) / 140 * (w - L - 12), py = v => B - v / 5 * (B - 14);
  x.font = '12px ' + cv('--f-mono'); x.textAlign = 'center';
  for (let a = -70; a <= 70; a += 5) { x.strokeStyle = cv('--line'); x.lineWidth = a % 10 ? .6 : 1.2; x.beginPath(); x.moveTo(px(a), 14); x.lineTo(px(a), B); x.stroke(); if (a % 10 === 0 && (w > 520 || a % 20 === 0)) { x.fillStyle = mu; x.fillText(a, px(a), B + 15); } }
  x.textAlign = 'right'; for (let v = 0; v <= 5; v++) { x.strokeStyle = cv('--line'); x.lineWidth = 1; x.beginPath(); x.moveTo(L, py(v)); x.lineTo(w - 12, py(v)); x.stroke(); x.fillStyle = mu; x.fillText(v, L - 6, py(v) + 4); }
  x.textAlign = 'start'; x.fillStyle = mu; x.fillText('U in V', L + 8, 12); x.textAlign = 'right'; x.fillText('α in °', w - 12, h - 4); x.textAlign = 'start';
  x.strokeStyle = cv('--green'); x.lineWidth = 2.4; x.beginPath();
  for (let a = -70; a <= 70; a += .25) { const s = Math.sin(rad(a)), v = 4.6 * Math.pow(Math.cos(Math.PI * MW.g * s / MW.lam), 2) * Math.pow(Math.cos(rad(a)), 1.3) + .08; a === -70 ? x.moveTo(px(a), py(v)) : x.lineTo(px(a), py(v)); }
  x.stroke();
}
function cdbild(c) {
  const [x, w, h] = fit(c, 180), ink = cv('--ink'), mu = cv('--muted'), xc = Math.min(120, w * .22), xw = w - 80, my = 96;
  x.font = '13px ' + cv('--f-mono');
  x.fillStyle = ink; x.fillRect(xw - 2, 8, 4, 150); x.fillStyle = cv('--navy'); x.fillRect(xw + 6, my - 12, 62, 24); x.fillStyle = cv('--bg'); x.fillText('Laser', xw + 14, my + 5);
  const gr = x.createLinearGradient(0, my - 44, 0, my + 44); gr.addColorStop(0, '#B9C6D6'); gr.addColorStop(.5, '#E9EEF4'); gr.addColorStop(1, '#B9C6D6'); x.fillStyle = gr; x.fillRect(xc - 5, my - 44, 10, 88);
  x.strokeStyle = '#E0331F'; x.lineWidth = 2; x.beginPath(); x.moveTo(xw + 6, my); x.lineTo(xc + 5, my); x.stroke();
  [[-1, 'k = 1'], [1, 'k = 1']].forEach(([sg, t]) => { const ya = my + sg * 62; x.beginPath(); x.moveTo(xc + 5, my); x.lineTo(xw - 2, ya); x.stroke(); x.fillStyle = '#E0331F'; x.beginPath(); x.arc(xw - 2, ya, 5, 0, 7); x.fill(); x.fillStyle = ink; if (sg < 0) x.fillText(t, xw - 62, ya - 4); });
  x.fillStyle = ink; x.fillText('CD', xc - 10, 172); x.fillText('Wand mit Loch', xw - 108, 174); x.fillText('α₁', xc + 46, my - 8);
  x.strokeStyle = cv('--orange'); x.beginPath(); x.moveTo(xw - 16, my); x.lineTo(xw - 16, my - 62); x.stroke(); x.fillStyle = cv('--orange'); x.fillText('a₁', xw - 40, my - 26);
  x.strokeStyle = mu; x.lineWidth = 1; x.beginPath(); x.moveTo(xc + 10, 150); x.lineTo(xw - 10, 150); x.stroke(); x.fillStyle = mu; x.fillText('e = 30 cm', (xc + xw) / 2 - 36, 145);

  <div class="simctl"><label>Spaltabstand g <input type="range" class="sg" min="30" max="110" value="60"><span class="v vg"></span></label>
  <label>Wellenlänge λ <input type="range" class="sl" min="420" max="700" value="650"><span class="v vl"></span></label>
  <button type="button" class="btn ghost" data-nm="650">rot</button><button type="button" class="btn ghost" data-nm="532">grün</button><button type="button" class="btn ghost" data-nm="450">blau</button></div></div>`;
  const c = box.querySelector('canvas'), x = c.getContext('2d'), W = c.width, H = c.height;
  const gIn = box.querySelector('.sg'), lIn = box.querySelector('.sl'), gO = box.querySelector('.vg'), lO = box.querySelector('.vl');
  box.querySelectorAll('button[data-nm]').forEach(b => b.onclick = () => { lIn.value = b.dataset.nm; });
  const xs = 50, FW = 380, xScr = xs + FW, img = x.createImageData(FW, H);
  const farbe = nm => { let r = 0, g = 0, b = 0;
    if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else r = 1; return [r, g, b]; };
  const rgb = (col, s) => `rgb(${Math.round(col[0] * 255 * s)},${Math.round(col[1] * 255 * s)},${Math.round(col[2] * 255 * s)})`;
  let t = 0, last = null;
  function frame(now) {
    if (!c.isConnected) return; // Tab gewechselt: Animation beenden
    if (last === null) last = now; t += Math.min((now - last) / 1000, .05); last = now;
    const g = +gIn.value, nm = +lIn.value, k = 2 * Math.PI / (nm / 60), om = 2 * Math.PI, y1 = H / 2 - g / 2, y2 = H / 2 + g / 2, col = farbe(nm), d = img.data;
    gO.textContent = fmt(g / 240, 2) + ' mm'; lO.textContent = nm + ' nm';
    for (let X = 0; X < xs - 6; X++) { x.fillStyle = rgb(col, (Math.cos(k * (X - xs) - om * t) + 1) / 2); x.fillRect(X, 0, 1, H); }
    for (let y = 0; y < H; y++) { const a1 = y - y1, a2 = y - y2;
      for (let X = 0; X < FW; X++) { const r1 = Math.sqrt(X * X + a1 * a1), r2 = Math.sqrt(X * X + a2 * a2), s = (Math.cos(k * r1 - om * t) + Math.cos(k * r2 - om * t) + 2) / 4, i = (y * FW + X) * 4;
        d[i] = col[0] * 255 * s; d[i + 1] = col[1] * 255 * s; d[i + 2] = col[2] * 255 * s; d[i + 3] = 255; } }
    x.putImageData(img, xs, 0);
    x.fillStyle = '#555'; x.fillRect(xs - 6, 0, 6, y1 - 2); x.fillRect(xs - 6, y1 + 2, 6, y2 - y1 - 4); x.fillRect(xs - 6, y2 + 2, 6, H - y2 - 2);
    x.fillStyle = '#222'; x.fillRect(xScr, 0, W - xScr, H);
    const sx = xScr + 15, gx = xScr + 70; x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.beginPath();
    for (let y = 0; y < H; y++) { const q1 = Math.sqrt(FW * FW + (y - y1) ** 2), q2 = Math.sqrt(FW * FW + (y - y2) ** 2), I = Math.cos(k * (q2 - q1) / 2) ** 2;
      x.fillStyle = rgb(col, I); x.fillRect(sx, y, 40, 1); const px = gx + I * (W - gx - 10); y ? x.lineTo(px, y) : x.moveTo(px, y); }
    x.stroke();
    x.font = '12px ' + cv('--f-mono'); x.fillStyle = '#fff'; x.fillText('Schirm', sx, 14); x.fillText('Intensität', gx, 14);
    x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(2, H - 20, 92, 18); x.fillStyle = '#000'; x.fillText('Doppelspalt', 6, H - 6);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

      solution: '<div class="mono">Rot, 2. Ordnung:     sin α = 2 · 700 nm / 4000 nm = 0,350 → α = 20,5°\nViolett, 3. Ordnung: sin α = 3 · 400 nm / 4000 nm = 0,300 → α = 17,5°\n20,5° > 17,5°: Das Violett der 3. Ordnung beginnt schon innerhalb des Spektrums 2. Ordnung.</div>Das gilt bei jedem Gitter, denn 2 · 700 nm > 3 · 400 nm.' },
    { nr: '2.6', afb: 'II', q: '<b>Nenne</b> den Vorteil eines Gitters gegenüber einem Doppelspalt, wenn man Wellenlängen messen will.',
      comps: [{ kind: 'choice', be: 2, q: 'Vorteil:', opts: ['Beim Gitter braucht man die Formel sin α<sub>k</sub> = k · λ / g nicht.', 'Die Maxima sind viel schärfer und heller und liegen weiter auseinander. Man kann sie genauer ausmessen.', 'Ein Gitter funktioniert auch ohne Wellen.'], correct: 1 }],
      help: ['Denk an das Schirmbild bei 2 Spalten und bei 50 Spalten.'], solution: 'Viele Spalte liefern sehr scharfe und helle Maxima. Wegen der kleinen Gitterkonstante sind außerdem die Winkel groß. Beides macht die Messung von a<sub>k</sub> und damit von λ genauer.' }
  ] },
{ id: 'A3', tab: 'Mikrowellen', title: 'Aufgabe 3 · Mikrowellen am Doppelspalt', mat: messkurve, matT: 'Material: Messkurve des Empfängers',
  intro: 'Ein Mikrowellensender strahlt senkrecht auf einen Doppelspalt aus Metallplatten. Die Spaltmitten haben den Abstand g = 9,0 cm. Ein Empfänger wird auf einem Kreisbogen um den Doppelspalt bewegt. Das Material zeigt die Empfängerspannung U in Abhängigkeit vom Winkel α.',
  parts: [
    { nr: '3.1', afb: 'I', q: '<b>Lies</b> aus der Messkurve die Winkel der Maxima 1. und 2. Ordnung <b>ab</b>.',
      comps: [{ kind: 'num', be: 1, label: 'α₁ =', unit: '°', value: 20.5, abs: 1.3 }, { kind: 'num', be: 1, label: 'α₂ =', unit: '°', value: 44.5, abs: 1.8 }],
      help: ['Das Maximum 0. Ordnung liegt bei 0°. Das nächste Maximum daneben ist die 1. Ordnung.', 'Das Gitternetz hat eine Linie alle 5°.'], solution: 'α₁ ≈ 20,5° und α₂ ≈ 44,5° (links und rechts symmetrisch).' },
    { nr: '3.2', afb: 'II', q: '<b>Bestimme</b> die Wellenlänge der Mikrowellen aus beiden Maxima und bilde den Mittelwert. Rechne mit α₁ = 20,5° und α₂ = 44,5°.',
      comps: [{ kind: 'num', be: 4, label: 'λ =', unit: 'cm', value: 3.153, tol: .02, d: 2 }],
      help: ['sin α<sub>k</sub> = k · λ / g, also λ = g · sin α<sub>k</sub> / k.', 'Aus der 1. Ordnung: λ = 9,0 cm · sin 20,5°.', 'Aus der 2. Ordnung: λ = 9,0 cm · sin 44,5° / 2. Beide Werte sollten fast gleich sein.'],
      solution: '<div class="mono">λ = g · sin α_k / k\n1. Ordnung: λ = 9,0 cm · sin 20,5° = 3,15 cm\n2. Ordnung: λ = 9,0 cm · sin 44,5° / 2 = 3,15 cm\nMittelwert: λ ≈ 3,15 cm</div>' },
    { nr: '3.3', afb: 'II', q: '<b>Berechne</b> die Frequenz des Senders (c = 3,0·10⁸ m/s).', comps: [{ kind: 'num', be: 2, label: 'f =', unit: 'GHz', value: 3e8 / .0315 / 1e9, tol: .03 }],
      help: ['c = λ · f', 'λ in Metern einsetzen: 3,15 cm = 0,0315 m. 1 GHz = 10⁹ Hz.'], solution: '<div class="mono">f = c / λ = 3,0·10⁸ m/s / 0,0315 m = 9,5·10⁹ Hz = 9,5 GHz</div>' },
    { nr: '3.4', afb: 'II', q: '<b>Begründe</b> durch eine Rechnung, dass es kein Maximum 3. Ordnung gibt.',
      comps: [{ kind: 'num', be: 2, label: '3·λ/g =', unit: '', value: 1.05, abs: .02, d: 2 }, { kind: 'choice', be: 1, q: 'Folgerung:', opts: ['Der Wert ist größer als 1. Es gibt keinen Winkel mit diesem Sinus, also kein Maximum 3. Ordnung.', 'Der Wert ist größer als 1, also liegt das Maximum bei α > 90° hinter dem Sender.', 'Der Empfänger ist für die 3. Ordnung zu unempfindlich.'], correct: 0 }],
      help: ['Setz k = 3 in sin α<sub>k</sub> = k · λ / g ein.', 'Welche Werte kann ein Sinus annehmen?'], solution: '<div class="mono">sin α₃ = 3 · λ / g = 3 · 3,15 cm / 9,0 cm = 1,05 > 1</div>Einen Sinus größer als 1 gibt es nicht. Der Gangunterschied kann höchstens g = 9,0 cm werden, für die 3. Ordnung wären aber 3 · λ = 9,45 cm nötig.' },
    { nr: '3.5', afb: 'III', q: 'Beim Doppelspalt mit Laserlicht rechnet man oft mit a<sub>k</sub> = k · λ · e / g. <b>Beurteile</b>, ob eine solche Näherung auch bei diesem Versuch sinnvoll wäre.',
      comps: [{ kind: 'choice', be: 3, q: 'Urteil:', opts: ['Ja. Die Näherung gilt für jeden Doppelspalt.', 'Nein. Sie setzt kleine Winkel voraus (sin α ≈ tan α). Hier ist zum Beispiel sin 44,5° = 0,70, aber tan 44,5° = 0,98.', 'Nein, weil Mikrowellen keine Lichtwellen sind.'], correct: 1 }],
      help: ['Die Näherung benutzt sin α ≈ tan α. Vergleiche beide Werte für α₂.'], solution: 'Nicht sinnvoll. Die Näherung sin α ≈ tan α gilt nur für kleine Winkel (wenige Grad). Hier ist die Wellenlänge fast so groß wie der Spaltabstand, deshalb sind die Winkel groß: sin 44,5° = 0,70, tan 44,5° = 0,98. Der Fehler wäre riesig.' },
    { nr: '3.6', afb: 'II', q: 'Der Empfänger ist ein Dipol. <b>Berechne</b> die Länge, bei der er am besten empfängt, und <b>gib an</b>, was passiert, wenn man ihn um 90° um die Ausbreitungsrichtung dreht.',
      comps: [{ kind: 'num', be: 2, label: 'ℓ =', unit: 'cm', value: 1.575, tol: .03, d: 2 }, { kind: 'choice', be: 1, q: 'Nach der Drehung:', opts: ['Der Empfang wird stärker.', 'Es ändert sich nichts.', 'Der Empfang verschwindet (fast), weil das elektrische Feld jetzt senkrecht zum Dipol schwingt.'], correct: 2 }],
      help: ['Hertz\'scher Dipol: Die Grundschwingung passt, wenn die Dipollänge eine halbe Wellenlänge ist.', 'Die Welle des Sendedipols ist linear polarisiert.'], solution: '<div class="mono">ℓ = λ / 2 = 3,15 cm / 2 ≈ 1,6 cm</div>Nach der Drehung steht der Empfangsdipol senkrecht zum elektrischen Feld der Welle. Die Elektronen im Dipol werden nicht mehr längs des Stabes angetrieben, der Empfang bricht zusammen (Polarisation).' }
  ] },
{ id: 'A4', tab: 'CD', title: 'Aufgabe 4 · Die CD als Gitter', mat: cdbild, matT: 'Versuchsaufbau (nicht maßstäblich)',
  intro: 'Auf einer CD liegen die Datenspuren sehr dicht nebeneinander. Der Abstand benachbarter Spuren beträgt 1,6 µm. Für Licht wirkt die CD deshalb wie ein Gitter, das in Reflexion arbeitet. Ein roter Laser (λ = 650 nm) leuchtet durch ein Loch in einer Wand senkrecht auf die CD. Die Wand steht im Abstand e = 30 cm parallel zur CD und dient als Schirm.',
  parts: [
    { nr: '4.1', afb: 'I', q: '<b>Berechne</b>, wie vielen „Strichen pro Millimeter“ der Spurabstand entspricht.', comps: [{ kind: 'num', be: 2, label: 'n =', unit: '/mm', value: 625, tol: .01, d: 0 }],
      help: ['Wie oft passt 1,6 µm in 1 mm? 1 mm = 1000 µm.'], solution: '<div class="mono">n = 1 mm / 1,6 µm = 1000 µm / 1,6 µm = 625 pro mm</div>' },
    { nr: '4.2', afb: 'II', q: '<b>Berechne</b> den Winkel α₁ und den Abstand a₁ des Maximums 1. Ordnung von der Mitte (vom Loch).',
      comps: [{ kind: 'num', be: 2, label: 'α₁ =', unit: '°', value: deg(acd), abs: .3 }, { kind: 'num', be: 2, label: 'a₁ =', unit: 'cm', value: 30 * Math.tan(acd), tol: .02 }],
      help: ['Gleiche Formeln wie beim Gitter: sin α₁ = λ / g mit g = 1,6 µm = 1600 nm.', 'a₁ = e · tan α₁. Keine Kleinwinkelnäherung.'],
      solution: '<div class="mono">sin α₁ = λ / g = 650 nm / 1600 nm = 0,406  ⇒  α₁ = 24,0°\na₁ = e · tan α₁ = 30 cm · tan 24,0° = 13,3 cm</div>' },
    { nr: '4.3', afb: 'II', q: '<b>Bestimme</b>, bis zu welcher Ordnung Maxima auftreten.', comps: [{ kind: 'num', be: 3, label: 'k_max =', unit: '', value: 2, abs: 0, d: 0 }],
      help: ['k · λ / g ≤ 1', 'k ≤ g / λ = 1600 nm / 650 nm, dann abrunden.'], solution: '<div class="mono">k ≤ g / λ = 1600 nm / 650 nm = 2,46  ⇒  k_max = 2</div>' },
    { nr: '4.4', afb: 'III', q: 'Die CD wird gegen eine unbekannte Scheibe getauscht. Jetzt liegt das Maximum 1. Ordnung 55 cm von der Mitte entfernt (e = 30 cm). <b>Bestimme</b> den Spurabstand dieser Scheibe und <b>vergleiche</b> mit der CD.',
      comps: [{ kind: 'num', be: 2, label: 'α₁ =', unit: '°', value: deg(advd), abs: .4 }, { kind: 'num', be: 2, label: 'g =', unit: 'µm', value: .65 / Math.sin(advd), tol: .02, d: 2 }, { kind: 'choice', be: 1, q: 'Vergleich:', opts: ['Die Spuren liegen weiter auseinander als bei der CD. Es passen weniger Daten auf die Scheibe.', 'Die Spuren liegen enger als bei der CD. Es passen mehr Daten auf die Scheibe (zum Beispiel eine DVD).', 'Der Spurabstand ist derselbe wie bei der CD.'], correct: 1 }],
      help: ['Jetzt rückwärts: Erst den Winkel aus der Geometrie, tan α₁ = a₁ / e.', 'Dann g = λ / sin α₁.'],
      solution: '<div class="mono">tan α₁ = a₁ / e = 55 cm / 30 cm = 1,83  ⇒  α₁ = 61,4°\ng = λ / sin α₁ = 650 nm / sin 61,4° = 740 nm = 0,74 µm</div>Der Spurabstand ist weniger als halb so groß wie bei der CD (1,6 µm). Die Spuren liegen enger, es passen mehr Daten darauf. 0,74 µm ist der Spurabstand einer DVD.' },
    { nr: '4.5', afb: 'II', q: 'Hält man eine CD ins Sonnenlicht, schillert sie in allen Farben. <b>Erkläre</b> das.',
      comps: [{ kind: 'choice', be: 2, q: 'Erklärung:', opts: ['Die Kunststoffschicht der CD ist bunt eingefärbt.', 'Die Maxima liegen für jede Wellenlänge unter einem anderen Winkel (sin α ~ λ). Weißes Licht wird so in seine Farben aufgefächert.', 'Das Licht wird in der CD wie in einem Prisma gebrochen.'], correct: 1 }],
      help: ['Was passiert mit weißem Licht an einem Gitter?'], solution: 'Die Spuren wirken als Gitter. Wegen sin α<sub>k</sub> = k · λ / g wird jede Wellenlänge in eine andere Richtung verstärkt: Rot stärker abgelenkt als Violett. Aus dem weißen Sonnenlicht entstehen so Spektren, je nach Blickwinkel sieht man eine andere Farbe.' }
  ] }
];

    <p>In der folgenden Skizze bezeichnen g den Abstand der beiden Spaltmitten, a den Abstand zwischen Doppelspalt und einer Projektionsfläche, d<sub>k</sub> den Abstand des k-ten Maximums vom Maximum 0. Ordnung und α<sub>k</sub> den Winkel, unter dem das Maximum k-ter Ordnung erscheint.</p>
    ${fig('lp_m2', 'Abb. 2: Skizze des Doppelspaltversuchs')}
    <p>Der Abstand g der beiden Spaltmitten ist bei einem Doppelspaltversuch mit sichtbarem Licht üblicherweise deutlich kleiner als der Abstand a zwischen Doppelspalt und Schirm.</p>`,
  M3: `<div class="mh">Material 3: Intensitätsverteilungen bei Mehrfachspalten</div>
    <p>Bei einem Doppelspalt befinden sich zwei Spalte in einem bestimmten Abstand nebeneinander. Die folgende Abbildung zeigt die Intensitätsverteilungen für Mehrfachspalte mit unterschiedlich vielen Spalten, aber jeweils gleichen Spaltabständen g auf dem Schirm.</p>
    ${fig('lp_m3', 'Abb. 3: Intensitätsverteilungen bei Mehrfachspalten')}
    <p>Ein optisches Gitter ist eine Aneinanderreihung von einer sehr großen Anzahl an nebeneinanderliegenden Spalten.</p>`,
  M4: `<div class="mh">Material 4: Hellempfindlichkeit</div>
    <p>Die folgende Abbildung zeigt die vom menschlichen Auge empfundene Helligkeit (Hellempfindlichkeit) in Abhängigkeit von der Wellenlänge des Lichts bei konstanter Strahlungsleistung.</p>
    ${fig('lp_m4', 'Abb. 4: Hellempfindlichkeit in Abhängigkeit von der Wellenlänge')}
    <p>Die Hellempfindlichkeit ist eine einheitenlose Größe, deren Wert zwischen 0 und 1 liegt.</p>`,
  M5: `<div class="mh">Material 5: Aufnahme des Interferenzbildes mit einer Smartphonekamera</div>
    <p>Die folgende Abbildung zeigt das mit einer Smartphonekamera aufgenommene Interferenzmuster bei Verwendung eines optischen Gitters. Die Smartphonekamera kann Licht mit einer Wellenlänge im Bereich 400 nm ≤ λ ≤ 1200 nm erfassen.</p>
    ${fig('lp_m5', 'Abb. 5: Interferenzbild am Gitter')}
    <p>Das Maximum 0. Ordnung befindet sich auf dem Zentimetermaßstab bei 12 cm. Die benachbarten Maxima des grünen Lichts (λ<sub>g</sub> = 532 nm) haben hier jeweils etwa einen Abstand von 1 cm.</p>`,
  M6: `<div class="mh">Material 6: Spektrum des verwendeten Laserpointers und Informationen vom Bundesamt für Strahlenschutz</div>
    <p>Das folgende Diagramm zeigt das gemessene Spektrum des verwendeten Laserpointers im Wellenlängenbereich 400 nm ≤ λ ≤ 1200 nm.</p>
    ${fig('lp_m6', 'Abb. 6: Spektrum des Laserpointers')}
    <p><b>Informationen vom Bundesamt für Strahlenschutz:</b></p>
    <ul><li>Der Grenzwert für die Strahlungsleistung eines frei verkäuflichen Laserpointers beträgt in Deutschland 1 mW.</li>
    <li>Besondere Aufmerksamkeit beim Auge verdient der kurzwellige Infrarot-Anteil (780 nm – 1400 nm). Für diesen Bereich ist der vordere Teil des Auges durchlässig, so dass die Netzhaut erreicht wird und Netzhautschädigungen möglich sind.</li></ul>`
};

const BS_MAT = {
  M1: `<div class="mh">Material 1: Versuch zur Erzeugung eines Spektrums mit einem Doppelspalt</div>
    <p>Abb. 1 zeigt das Schirmbild, wenn monochromatisches Licht der Wellenlänge λ senkrecht auf einen Doppelspalt mit Spaltmittenabstand g trifft, der Maßstab ist in Zentimetern skaliert. Der Schirm ist im Abstand e vom Doppelspalt und parallel zu diesem platziert. Auf diesem werden die Abstände a<sub>n</sub> der Maxima n-ter Ordnung vom Maximum 0. Ordnung gemessen. Für den Winkel α, unter dem das Maximum n-ter Ordnung gegenüber dem Maximum 0. Ordnung auftritt, gilt: <b>n · λ = g · sin(α)</b> und <b>tan(α) = a<sub>n</sub> / e</b>.</p>
    ${fig('bs_m1', 'Abb. 1: Schirmbild eines Doppelspalt-Experiments bei e = 12,0 cm und g = 2,0 µm. Die Schirmmitte ist bei 0,0 cm.')}`,
  M2: `<div class="mh">Material 2: Bildschirm-Spektren</div>
    <p>In den nachfolgenden Abbildungen ist jeweils die Intensität I des Lichts eines weißen Bildschirmes in Abhängigkeit von der Wellenlänge aufgetragen. Als Einheit für die Intensität sind Skalenteile („Skt.“) verwendet. Die Messungen erfolgten so, dass die Intensität des untersuchten Lichts in gleicher Skalierung aufgetragen wurde, die drei abgebildeten Diagramme sind also quantitativ miteinander vergleichbar.</p>
    ${fig('bs_m2', 'Abb. 2: weiß leuchtender Bildschirm · Abb. 3: Bildschirm, betrachtet durch eine „Blauschutzbrille“ · Abb. 4: Bildschirm im „Augenschon-Modus“')}
    <p>Eine Schülerin sagt wegen Abbildung 4:<br>„Der Augenschon-Modus filtert doch bei der Maximalintensität von blau und grün den gleichen Prozentsatz heraus, nur bei rot nicht!“</p>`,
  M3: `<div class="mh">Material 3: Varianten von Blauschutzbrillen</div>
    <p>Blauschutzbrillen gibt es in zwei unterschiedliche Varianten: Entweder besitzen die Gläser eine Tönung, die dazu führt, dass beim Durchqueren des Glases der blaue Lichtanteil absorbiert wird. Oder die Gläser sind an ihrer dem Auge abgewandten Oberfläche mit einer speziellen spiegelnden Schicht versehen, die den blauen Lichtanteil reflektiert.</p>
    <p>Ein Schüler sagt: „Egal, wie der Typ meiner Blauschutzbrille ist, ist es doch so: Wenn jemand anderes in meine Augen schauen will, dann sieht diese Person doch etwas anderes, als wenn ich eine normale Brille ohne Schutz aufhätte, oder?“</p>`,
  M4: `<div class="mh">Material 4: Empfehlung der Schülergruppe</div>
    <p><b>Unser Auftrag:</b> Was ist dran an der „blauen Gefahr“? Ist eher eine Blauschutzbrille oder der Augenschon-Modus des Bildschirms sinnvoller?</p>
    <p>Erstmal ein paar <b>physikalische Fakten</b>, wenn wir da richtig liegen: Das blaue Licht liefert im Vergleich zu den anderen Farben des sichtbaren Lichts die meiste Energie. Aus einem Bildschirm kommt blaues Licht zwar nur mit einer Intensität heraus, die um einen Faktor 100 bis 100.000 kleiner ist als die, die an trüben Wintertagen draußen ist. Aber während natürliches blaues Licht von der Sonne eine positive Rolle für unsere Gesundheit spielt, kann künstliches blaues Licht gesundheitliche Probleme verursachen, ist also eine Gefahr.</p>
    <p>Als aktuellen Wissensstand zur blauen Gefahr durch Bildschirme haben wir herausgefunden:</p>
    <ul><li><b>Störung des Schlaf-Wach-Rhythmus:</b> Blaues Licht kann die Produktion des sogenannten „Schlafhormons“ Melatonin hemmen und Schlafstörungen verursachen, so sagen es manche Forschergruppen. In einer Studie vom August 2021 wurde allerdings bei 167 Leuten keine Veränderung des Schlafs gefunden, egal ob ein Smartphone mit bzw. ohne Augenschon-Modus verwendet wurde.</li>
    <li><b>Langfristige Augenschäden:</b> Es gibt die Meinung, dass blaues Licht das Risiko für eine eigentlich erst im Alter häufiger auftretende Krankheit („AMD“) erhöhen könnte. Wir haben dazu auch ein Bild gefunden, das die Notwendigkeit von Schutz vor dem blauen Licht unterstreicht.</li></ul>
    ${fig('bs_m4', 'Bild aus der Empfehlung der Schülergruppe')}
    <p>Wir ziehen zu den Schutzmaßnahmen folgende <b>Bilanz</b>:</p>
    <table class="aus mtab"><tr><th></th><th>Blauschutzbrillen</th><th>Augenschon-Modus</th></tr>
    <tr><th>Vorteile</th><td>Effektiver Schutz vor blauem Licht, besonders bei langer Nutzung.<br>Verbessert den Schlaf-Wach-Rhythmus.</td><td>Einfach zu aktivieren, keine zusätzlichen Kosten.<br>Verbessert den Schlaf-Wach-Rhythmus.</td></tr>
    <tr><th>Nachteile</th><td>Zusätzliche Kosten.<br>Kann unbequem sein oder uncool aussehen.</td><td>Schlechtere Reduktion von Blaulicht.<br>Kann die Farbwiedergabe des Bildschirms störend verändern.</td></tr></table>
    <p><b>Empfehlung: Aktiviert den Augenschon-Modus</b> auf euren Geräten, insbesondere abends. Dies ist eine einfache und kostengünstige Maßnahme, um den blauen Lichtanteil zu reduzieren und eure Schlafqualität zu verbessern. Wenn ihr viel Zeit vor dem Bildschirm verbringt, <b>kann die Anschaffung einer Bildschirmbrille</b> sinnvoll sein. Achtet auf Qualität und Tragekomfort.</p>
    <p>Hoffentlich könnt ihr eure Augen nun vor der gefährlichen blauen Strahlung besser schützen!</p>`
};

      help: ['In der Lupe von Material 2 laufen zwei Strahlen von S₁ und S₂ zum selben Maximum. Welcher Strahl hat den längeren Weg? Das Wegstück, um das er länger ist, heißt Gangunterschied Δs.', 'Fäll von S₁ das Lot auf den unteren Strahl. So entsteht ein rechtwinkliges Dreieck. Welche Seite ist g, welche ist Δs?', 'Warum ist der Winkel im Dreieck bei S₁ derselbe wie α<sub>k</sub>? Tipp: g ist sehr viel kleiner als a, die Strahlen sind praktisch parallel. Und wie groß muss Δs für ein Maximum sein?'],
      solution: `<figure class="mimg" style="max-width:300px"><img src="${IQB_IMG.lp_eh1b}" alt="Ergänzte Skizze mit Lot, rechtwinkligem Dreieck und Gangunterschied"></figure>Für das Maximum k-ter Ordnung muss der in der Zeichnung mit Δs bezeichnete Gangunterschied ein ganzzahliges Vielfaches der Wellenlänge betragen, d. h. Δs = k · λ. Da der Abstand a viel größer ist als der Abstand g, hat das grau unterlegte Dreieck (näherungsweise) den Winkel α<sub>k</sub> im Punkt S₁ und einen rechten Winkel im Punkt P. Damit ist Δs = g · sin(α<sub>k</sub>) bzw. k · λ = g · sin(α<sub>k</sub>).` },
    { id: 'LP2a', nr: '2a', afb: 'I', m: ['M1'], q: 'Auf dem Typenschild des Lasers ist die Wellenlänge λ = 532 nm angegeben. Es wird nun getestet, ob die Angabe der Wellenlänge auf dem Typenschild korrekt angegeben ist.<br><b>Untersuchen</b> Sie anhand von Material 1, ob der in dem Versuch verwendete Laser Licht der auf dem Typenschild angegebenen Wellenlänge emittiert.',

      solution: '<b>Für den absorbierenden Typ:</b> Wenn das blaue Licht bei seinem Weg durch das Brillenglas teilweise absorbiert wird, dann wird auch das Licht von den Augen zur anderen Person entsprechend gefiltert. Im Gegensatz zu einem durchsichtigen Brillenglas wird der Farbeindruck entsprechend verfälscht bzw. farbig sein. (Die Benennung der Tönung als gelblich ist nicht verlangt.)<br><b>Für den reflektierenden Typ:</b> Wenn von vorne Licht auf das Brillenglas trifft, dann wird bei diesem Brillentyp wegen der Beschichtung das reflektierte Licht einen deutlich höheren Anteil an blauem Licht haben. Für die außenstehende Person kann es daher sein, dass das von der Augenpartie kommende Licht von diesem Spiegeln des Brillenglases überlagert ist. Im Vergleich zu einer normalen Brille ist das Spiegeln dann deutlich bläulich.<br>Es können auch andere Lichtwege betrachtet werden.' },

function auswertung(m) {
  redraw = null; const c = el('div', 'card'); let now = 0, max = 0, rows = '';
  TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), mx = t.parts.reduce((a, p) => a + p.be, 0); now += e; max += mx;
    rows += `<tr><td><b>${t.title}</b><div class="legend">${t.parts.map(p => `<span class="status ${status(p) === 'part' ? '' : status(p)}">${p.nr} ${NAMES[status(p)]}</span>`).join('')}</div></td><td class="r">${e} / ${mx}</td></tr>`; });
  const offen = PARTS.filter(p => !closed(p)).length, pr = max ? Math.round(100 * now / max) : 0;
  c.innerHTML = `<h2>Auswertung</h2><p class="lead">Du hast <b>${now} von ${max} BE</b> (${pr} %). ${offen ? `Noch ${offen} Teilaufgaben offen.` : 'Alle Teilaufgaben bearbeitet.'}</p><table class="aus"><tr><th>Aufgabe</th><th class="r">BE</th></tr>${rows}</table>
  <p class="small" style="margin-top:14px">So wird gezählt: Rechenergebnisse darfst du beliebig oft prüfen. Bei Auswahlfragen zählt nur der erste Versuch. Hilfen kosten keine BE, werden aber im Status vermerkt. Nach „Lösung zeigen“ gibt es für offene Felder keine BE mehr. Bei den IQB-Aufgaben bewertest du deine Textantworten selbst mit dem offiziellen Erwartungshorizont.<br>Im echten Abi zählen außerdem Ansatz, Rechenweg und Einheiten. Schreib deine Lösungen deshalb immer vollständig auf Papier und vergleiche am Ende mit der Musterlösung.</p>`;
  m.appendChild(c);
}
/* ===================== Reiter Formeln (wie IQB-Formelsammlung, Stand 14.02.2024) ===================== */
function skizzeAufbau(c) { // Draufsicht: Laser – Doppelspalt/Gitter – Schirm mit α_k, a_k, e
  const [x, w] = fit(c, 290), ink = cv('--ink'), mu = cv('--muted'), or = cv('--orange'), red = '#E0331F';
  const it = s => 'italic ' + s + 'px "Times New Roman",Georgia,serif', sm = '13px ' + cv('--f-body');
  const xs = Math.max(110, Math.min(200, w * .27)), xe = w - 62, my = 130, da = 44, k = 2, ya = my - k * da;
  // Laser
  x.fillStyle = '#13305A'; x.fillRect(6, my - 14, 66, 28); x.fillStyle = '#fff'; x.font = sm; x.fillText('Laser', 18, my + 5);
  x.strokeStyle = red; x.lineWidth = 2.5; x.beginPath(); x.moveTo(72, my); x.lineTo(xs, my); x.stroke();
  // Blende mit zwei Spalten
  x.fillStyle = ink; x.fillRect(xs - 3, 18, 6, my - 8 - 18); x.fillRect(xs - 3, my - 3, 6, 6); x.fillRect(xs - 3, my + 8, 6, 240 - my - 8);
  // Schirm
  x.fillRect(xe - 2, 14, 5, 232);
  // Achse
  x.strokeStyle = mu; x.lineWidth = 1; x.setLineDash([6, 5]); x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, my); x.stroke(); x.setLineDash([]);
  // Maxima auf dem Schirm
  for (let j = -2; j <= 2; j++) { const y = my - j * da; x.fillStyle = red; x.globalAlpha = j ? .85 : 1; x.beginPath(); x.arc(xe, y, j ? 5 : 6.5, 0, 7); x.fill(); x.globalAlpha = 1;
    x.fillStyle = mu; x.font = it(16); x.fillText('k = ' + Math.abs(j), xe + 12, y + 5); }
  // Strahl zum Maximum k-ter Ordnung
  x.strokeStyle = red; x.lineWidth = 2; x.beginPath(); x.moveTo(xs, my); x.lineTo(xe, ya); x.stroke();
  // Winkel α_k
  const al = Math.atan2(my - ya, xe - xs), R = 62; x.strokeStyle = ink; x.lineWidth = 1.5; x.beginPath(); x.arc(xs, my, R, -al, 0); x.stroke();
  x.fillStyle = ink; x.font = it(19); x.fillText('α', xs + R + 6, my - 9); x.font = it(13); x.fillText('k', xs + R + 17, my - 4);
  // a_k
  const xa = xe - 18; x.strokeStyle = or; x.lineWidth = 2; x.beginPath(); x.moveTo(xa, my); x.lineTo(xa, ya); x.moveTo(xa - 5, my); x.lineTo(xa + 5, my); x.moveTo(xa - 5, ya); x.lineTo(xa + 5, ya); x.stroke();
  x.fillStyle = or; x.font = it(19); x.fillText('a', xa - 26, (my + ya) / 2 + 6); x.font = it(13); x.fillText('k', xa - 16, (my + ya) / 2 + 11);
  // e
  const ye = 262; x.strokeStyle = mu; x.lineWidth = 1.2; x.beginPath(); x.moveTo(xs, ye); x.lineTo(xe, ye); x.moveTo(xs, ye - 6); x.lineTo(xs, ye + 6); x.moveTo(xe, ye - 6); x.lineTo(xe, ye + 6); x.stroke();
  x.fillStyle = ink; x.font = it(19); x.fillText('e', (xs + xe) / 2 - 4, ye - 8);
  // Beschriftung
  x.font = sm; x.fillStyle = ink; x.textAlign = 'center'; x.fillText('Doppelspalt bzw. Gitter', xs, 284); x.fillText('Schirm', xe, 284); x.textAlign = 'start';
}
function skizzeSpalt(c) { // Ausschnitt am Doppelspalt: Spaltmittenabstand g und Gangunterschied
  const [x, w] = fit(c, 280), ink = cv('--ink'), mu = cv('--muted'), or = cv('--orange'), red = '#E0331F';
  const it = s => 'italic ' + s + 'px "Times New Roman",Georgia,serif', sm = '13px ' + cv('--f-body');
  const x0 = Math.max(90, Math.min(170, w * .28)), cy = 165, G = 100, y1 = cy - G / 2, y2 = cy + G / 2, al = rad(28), ux = Math.cos(al), uy = -Math.sin(al), L = Math.min(w - x0 - 20, 220);
  // Blende
  x.fillStyle = ink; x.fillRect(x0 - 4, 10, 8, y1 - 6 - 10); x.fillRect(x0 - 4, y1 + 6, 8, y2 - 6 - y1 - 6); x.fillRect(x0 - 4, y2 + 6, 8, 272 - y2 - 6);
  // einfallendes Licht
  x.strokeStyle = red; x.globalAlpha = .45; x.lineWidth = 2; [y1, y2].forEach(y => { x.beginPath(); x.moveTo(x0 - 70, y); x.lineTo(x0 - 6, y); x.stroke(); }); x.globalAlpha = 1;
  // Strahlen unter α_k
  x.strokeStyle = red; x.lineWidth = 2.2; [y1, y2].forEach(y => { x.beginPath(); x.moveTo(x0, y); x.lineTo(x0 + ux * L, y + uy * L); x.stroke(); });
  // Lot von S1 auf den unteren Strahl
  const t = (0) * ux + (y1 - y2) * uy, fx = x0 + t * ux, fy = y2 + t * uy;
  x.strokeStyle = mu; x.lineWidth = 1.2; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(x0, y1); x.lineTo(fx, fy); x.stroke(); x.setLineDash([]);
  // rechter Winkel
  const q = 9, px = -uy, py = ux; x.beginPath(); x.moveTo(fx - ux * q, fy - uy * q); x.lineTo(fx - ux * q - px * q, fy - uy * q - py * q); x.lineTo(fx - px * q, fy - py * q); x.stroke();
  // Δs
  x.strokeStyle = or; x.lineWidth = 4; x.beginPath(); x.moveTo(x0, y2); x.lineTo(fx, fy); x.stroke();
  x.fillStyle = or; x.font = it(19); x.fillText('Δs', (x0 + fx) / 2 + 10, (y2 + fy) / 2 + 22);
  // g
  const xg = x0 - 26; x.strokeStyle = ink; x.lineWidth = 1.3; x.beginPath(); x.moveTo(xg, y1); x.lineTo(xg, y2); x.moveTo(xg - 5, y1); x.lineTo(xg + 5, y1); x.moveTo(xg - 5, y2); x.lineTo(xg + 5, y2); x.stroke();
  x.fillStyle = ink; x.font = it(20); x.fillText('g', xg - 18, cy + 6);
  // Winkel α_k am unteren Strahl (gegen die Achse)
  x.strokeStyle = mu; x.lineWidth = 1; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(x0, y2); x.lineTo(x0 + 150, y2); x.stroke(); x.setLineDash([]);
  x.strokeStyle = ink; x.lineWidth = 1.4; x.beginPath(); x.arc(x0, y2, 110, -al, 0); x.stroke();
  x.fillStyle = ink; x.font = it(18); x.fillText('α', x0 + 116, y2 - 10); x.font = it(12); x.fillText('k', x0 + 127, y2 - 5);
  // Winkel α_k im kleinen Dreieck (bei S1, zwischen Blende und Lot)
  x.beginPath(); x.arc(x0, y1, 26, Math.PI / 2 - al, Math.PI / 2); x.stroke();
  x.font = it(15); x.fillText('α', x0 + 6, y1 + 42); x.font = it(11); x.fillText('k', x0 + 15, y1 + 46);
  x.font = sm; x.fillStyle = mu; x.textAlign = 'right'; x.fillText('→ zum Schirm (weit weg)', w - 10, 270); x.textAlign = 'start';
}
function formeln(m) {
  const c = el('div', 'card');
  c.innerHTML = `<h2>Formeln · Interferenz</h2><p class="src">So stehen sie in der IQB-Formelsammlung (Abschnitt Wellenoptik). Gestrichelte Kästen: brauchst du oft, stehen aber <b>nicht</b> in der Formelsammlung.</p>
  <div class="mat"><div class="mh">Abb. 1: Versuchsaufbau von oben (nicht maßstäblich)</div><canvas id="skA"></canvas></div>
  <div class="mat"><div class="mh">Abb. 2: Ausschnitt am Doppelspalt – woher die Formel kommt</div><canvas id="skB"></canvas></div>
  <div class="fgrid">
    <div class="fbox"><h3>Doppelspalt · Maxima</h3><div class="fx"><span>sin <i>α</i><sub><i>k</i></sub> =</span><span class="frac"><span><i>k</i> · <i>λ</i></span><span><i>g</i></span></span></div><p class="bed"><i>k</i> = 0, 1, 2, …</p></div>
    <div class="fbox"><h3>Doppelspalt · Minima</h3><div class="fx"><span>sin <i>α</i><sub><i>k</i></sub> =</span><span class="frac"><span>(2<i>k</i> − 1) · <i>λ</i></span><span>2 · <i>g</i></span></span></div><p class="bed"><i>k</i> = 1, 2, 3, …</p></div>
    <div class="fbox"><h3>Gitter · Hauptmaxima</h3><div class="fx"><span>sin <i>α</i><sub><i>k</i></sub> =</span><span class="frac"><span><i>k</i> · <i>λ</i></span><span><i>g</i></span></span></div><p class="bed"><i>k</i> = 0, 1, 2, … &nbsp;·&nbsp; gleiche Formel wie beim Doppelspalt, die Maxima sind nur viel schärfer</p></div>
    <div class="fbox"><h3>Wellen allgemein</h3><div class="fx"><span><i>c</i> = <i>λ</i> · <i>f</i></span></div><p class="bed">für Licht: <i>c</i> ≈ 3,00 · 10⁸ m/s</p></div>
    <div class="fbox extra"><h3>Winkel aus der Messung am Schirm<span class="tag">nicht in der FS</span></h3><div class="fx"><span>tan <i>α</i><sub><i>k</i></sub> =</span><span class="frac"><span><i>a</i><sub><i>k</i></sub></span><span><i>e</i></span></span></div><p class="bed">rechtwinkliges Dreieck in Abb. 1 – im Abi selbst aufstellen</p></div>
    <div class="fbox extra"><h3>Gangunterschied<span class="tag">nicht in der FS</span></h3><div class="fx"><span>Δ<i>s</i> = <i>g</i> · sin <i>α</i><sub><i>k</i></sub></span></div><p class="bed">hell (Maximum): Δ<i>s</i> = <i>k</i> · <i>λ</i> &nbsp;·&nbsp; dunkel (Minimum): Δ<i>s</i> = (2<i>k</i> − 1) · <i>λ</i>/2</p></div>
  </div>
  <div class="merk"><b>Merke:</b> Rechne immer in zwei Schritten: erst <b>α<sub>k</sub> aus tan α<sub>k</sub> = a<sub>k</sub>/e</b>, dann <b>λ oder g aus sin α<sub>k</sub> = k · λ/g</b>. Die Abkürzung a<sub>k</sub> ≈ k · λ · e/g (Kleinwinkelnäherung, sin α ≈ tan α) darfst du nur bei kleinen Winkeln (wenige Grad) nehmen, also meist beim Doppelspalt mit Licht – beim Gitter fast nie. Wenn du sie benutzt, schreib dazu, dass α klein ist.</div>
  <h3 style="margin:18px 0 6px">Formelzeichen</h3>
  <table class="aus sym">
    <tr><th>Zeichen</th><th>Bedeutung</th><th>Einheit</th></tr>
    <tr><td>λ</td><td>Wellenlänge</td><td class="u">m, oft nm</td></tr>
    <tr><td>f</td><td>Frequenz</td><td class="u">Hz</td></tr>
    <tr><td>c</td><td>Ausbreitungsgeschwindigkeit</td><td class="u">m/s</td></tr>
    <tr><td>g</td><td>Spaltmittenabstand (Doppelspalt) bzw. Gitterkonstante (Gitter). Bei „N Linien pro mm“ gilt g = 1 mm / N, z. B. 600 Linien/mm → g ≈ 1,67 µm</td><td class="u">m</td></tr>
    <tr><td>k</td><td>Ordnung des Maximums bzw. Minimums (Mitte: k = 0)</td><td class="u">–</td></tr>
    <tr><td>α<sub>k</sub></td><td>Winkel, unter dem das Maximum bzw. Minimum k-ter Ordnung erscheint (gemessen gegen die Mittelachse)</td><td class="u">°</td></tr>
    <tr><td>e</td><td>Abstand Doppelspalt bzw. Gitter – Schirm <span class="small">(nicht in der FS, so in IQB-Aufgaben)</span></td><td class="u">m</td></tr>
    <tr><td>a<sub>k</sub></td><td>Abstand zwischen dem Maximum 0. Ordnung und dem Maximum k-ter Ordnung auf dem Schirm <span class="small">(nicht in der FS, so in IQB-Aufgaben)</span></td><td class="u">m</td></tr>
    <tr><td>Δs</td><td>Gangunterschied der beiden Wellen <span class="small">(nicht in der FS)</span></td><td class="u">m</td></tr>
  </table>
  <p class="small" style="margin-top:12px">Tipp: Ist der Abstand zwischen den beiden Maxima k-ter Ordnung (links und rechts) gegeben, ist a<sub>k</sub> die Hälfte davon.</p>`;
  m.appendChild(c);
