<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abi-Trainer Schwingkreis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Kopf mit BE-Stand, Tabs je Abiaufgabe, je Teilaufgabe eine Karte mit Antwortfeld, Prüfen und Hilfe-Treppe */
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#15253A; --muted:#58697C; --line:#D3DCE6;
  --navy:#1F3A5F; --green:#3C7A4E; --greenSoft:#E2F0E5; --navySoft:#E3EAF3;
  --orange:#C2571A; --blue:#2F6FB5; --bad:#B3261E; --badSoft:#FBE6E4; --warnSoft:#FFF3D6;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1621; --panel:#162131; --ink:#E5ECF4; --muted:#9BABBD; --line:#2A3A4F;
  --navy:#93B4DE; --green:#6FC089; --greenSoft:#1B3325; --navySoft:#1B293C;
  --orange:#F09A5E; --blue:#7FB2EE; --bad:#F2918A; --badSoft:#3B1F1E; --warnSoft:#3A321C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:15px;color:var(--muted);margin-top:6px}
.score{font-family:var(--f-mono);font-size:15px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.score b{color:var(--green);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
nav button{flex:0 0 auto;font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
nav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
nav button[aria-selected="true"] .n{color:var(--bg);opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;min-width:0;margin-bottom:16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 4px;color:var(--navy);text-wrap:balance}
.src{font-size:14px;color:var(--green);margin:0 0 10px}
.lead{margin:0 0 10px}
.task{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
.task.solo{border-color:var(--green)}
.task.help{border-color:var(--blue)}
.task.shown{border-color:var(--orange)}
.thead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tnr{font-family:var(--f-mono);font-weight:700;color:var(--green);margin-right:8px}
.be{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.status{font-size:13.5px;border-radius:999px;padding:2px 10px;background:var(--navySoft);white-space:nowrap}
.status.solo{background:var(--greenSoft)} .status.help{background:color-mix(in srgb,var(--blue) 18%,var(--panel))} .status.shown{background:var(--warnSoft)}
.qtext{margin:8px 0 10px}
.qtext b{color:var(--navy)}
.mat{border-left:4px solid var(--green);padding:6px 0 6px 12px;margin:10px 0}
.mat .mh{font-weight:700;color:var(--green);font-size:15px;margin-bottom:6px}
canvas{display:block;width:100%;max-width:100%;border-radius:10px;background:var(--bg)}
.comp{margin-top:10px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ansrow label{font-weight:700;min-width:4.5em}
.ansrow input{font:inherit;font-family:var(--f-mono);font-size:18px;width:9em;max-width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ansrow select,.sel select{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.ok{border-color:var(--green)!important;background:var(--greenSoft)!important}
.no{border-color:var(--bad)!important;background:var(--badSoft)!important}
.mark{font-size:20px;width:1.2em}
.opts{display:grid;gap:8px;margin-top:8px}
.opts.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.opts.grid{grid-template-columns:minmax(0,1fr)}}
.opts button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:48px}
.opts button canvas,.opts button svg{margin-top:6px;width:100%;height:auto}
.opts button.sel{border-color:var(--navy);box-shadow:0 0 0 3px var(--navySoft)}
.pq{font-weight:700;margin:12px 0 2px}
textarea{width:100%;min-height:120px;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--navy);color:var(--bg);padding:10px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.warn{background:transparent;color:var(--orange);border-color:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
.fb{border-radius:10px;padding:10px 14px;margin-top:10px}
.fb.ok{background:var(--greenSoft);border:1.5px solid var(--green)}
.fb.no{background:var(--badSoft);border:1.5px solid var(--bad)}
.warnbox{background:var(--warnSoft);border:1.5px solid var(--orange);margin-bottom:12px}
.rb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.fb.info{background:var(--navySoft);border:1.5px solid var(--line)}
.helpbox{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px}
.hstep{background:color-mix(in srgb,var(--blue) 9%,var(--panel));border-radius:10px;padding:10px 12px;margin-top:8px}
.hstep .hl{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.sol{background:var(--warnSoft);border-radius:10px;padding:10px 14px;margin-top:10px}
.mono{font-family:var(--f-mono);font-size:15px;line-height:1.8}
.rubric{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.rubric label{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.rubric input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--green)}
.small{font-size:14.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slider{display:grid;grid-template-columns:6em minmax(0,1fr) 6em;gap:10px;align-items:center;margin:6px 0}
.slider output{font-family:var(--f-mono);font-size:15px;text-align:right}
input[type=range]{width:100%;accent-color:var(--navy);min-height:32px}
table.res{border-collapse:collapse;width:100%;font-size:15.5px}
table.res th,table.res td{border:1.5px solid var(--line);padding:8px;text-align:left}
table.res th{background:var(--navySoft)}
table.res td.n{font-family:var(--f-mono);text-align:right}
.big{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14.5px;margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c)}
.mtab{border-collapse:collapse;font-family:var(--f-mono);font-size:15px;margin:6px 0}
.mtab td,.mtab th{border:1.5px solid var(--line);padding:6px 10px;text-align:center}
.mtab th{background:var(--navySoft);font-family:var(--f-body)}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html !== undefined) e.innerHTML = html; return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PI = Math.PI;

function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(/,/g, '.').replace(/[·×x]/g, '*');
  if (!s) return NaN;
  let m = s.match(/^([+-]?\d*\.?\d+)(?:(?:\*10\^?|e|E)\(?([+-]?\d+)\)?)?$/);
  if (m) return parseFloat(m[1]) * (m[2] ? Math.pow(10, parseInt(m[2])) : 1);
  m = s.match(/^10\^\(?([+-]?\d+)\)?$/);
  if (m) return Math.pow(10, parseInt(m[1]));
  return NaN;
}

function setupCanvas(cv, w, h) {
  const dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.aspectRatio = w + '/' + h;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c;
}
function grid(c, x0, y0, nx, ny, s) {
  c.strokeStyle = css('--line'); c.lineWidth = 1;
  for (let i = 0; i <= nx; i++) { c.beginPath(); c.moveTo(x0 + i * s, y0); c.lineTo(x0 + i * s, y0 + ny * s); c.stroke(); }
  for (let j = 0; j <= ny; j++) { c.beginPath(); c.moveTo(x0, y0 + j * s); c.lineTo(x0 + nx * s, y0 + j * s); c.stroke(); }

function axes(c, x0, ymid, x1, ytop, ybot, lx, ly) {
  c.strokeStyle = css('--ink'); c.fillStyle = css('--ink'); c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x0, ymid); c.lineTo(x1, ymid); c.stroke();
  c.beginPath(); c.moveTo(x0, ybot); c.lineTo(x0, ytop); c.stroke();
  c.beginPath(); c.moveTo(x1, ymid); c.lineTo(x1 - 8, ymid - 4); c.lineTo(x1 - 8, ymid + 4); c.fill();
  c.beginPath(); c.moveTo(x0, ytop); c.lineTo(x0 - 4, ytop + 8); c.lineTo(x0 + 4, ytop + 8); c.fill();
  c.font = 'italic 15px ' + css('--f-body'); c.fillText(lx, x1 - 10, ymid + 18); c.fillText(ly, x0 + 8, ytop + 12);
}
function plot(c, f, x0, x1, ymid, amp, color, dash) {
  c.strokeStyle = color; c.lineWidth = 2.5; c.setLineDash(dash || []);
  c.beginPath();
  for (let x = x0; x <= x1; x++) { const y = ymid - amp * f(x); x === x0 ? c.moveTo(x, y) : c.lineTo(x, y); }
  c.stroke(); c.setLineDash([]);
}
// Material 2 (LA19): U_C(t), Kästchen 1 µs × 3 V
function drawUC(cv) {
  const s = 40, nx = 11, ny = 6, x0 = 20, y0 = 14, W = x0 + nx * s + 30, H = y0 + ny * s + 14;
  const c = setupCanvas(cv, W, H);
  grid(c, x0, y0, nx, ny, s);
  axes(c, x0, y0 + 3 * s, x0 + nx * s + 16, y0 - 6, y0 + ny * s, 't', 'UC(t)');
  plot(c, x => Math.cos(2 * PI * ((x - x0) / s) / 4), x0, x0 + nx * s, y0 + 3 * s, 2 * s, css('--navy'));
}
function drawSmallGraph(cv, f, color) {
  const s = 18, nx = 11, x0 = 6, W = x0 + nx * s + 8, H = 6 * s + 8, ym = H / 2;
  const c = setupCanvas(cv, W, H);
  grid(c, x0, 4, nx, 6, s);
  c.strokeStyle = css('--ink'); c.lineWidth = 1.2; c.beginPath(); c.moveTo(x0, ym); c.lineTo(x0 + nx * s, ym); c.moveTo(x0, 4); c.lineTo(x0, H - 4); c.stroke();
  plot(c, x => f((x - x0) / s), x0, x0 + nx * s, ym, 2 * s, color || css('--orange'));

// Material 3 (LA19): E_el(t) mit Positionsmarken
function drawEel(cv, marks, emag) {
  const W = 560, H = 210, x0 = 30, x1 = 520, ym = 175, A = 135, u = (x1 - x0) / 6.2;
  const c = setupCanvas(cv, W, H);
  axes(c, x0, ym, x1 + 25, 14, ym + 20, 't', 'Eel(t)');
  plot(c, x => Math.cos(2 * PI * ((x - x0) / u) / 4) ** 2, x0, x0 + 6 * u, ym, A, css('--navy'));
  if (emag) plot(c, x => Math.sin(2 * PI * ((x - x0) / u) / 4) ** 2, x0, x0 + 6 * u, ym, A, css('--orange'), [7, 5]);
  if (marks) {
    c.font = 'bold 15px ' + css('--f-body'); c.fillStyle = css('--green'); c.strokeStyle = css('--green'); c.lineWidth = 2;
    marks.forEach(([lab, pos]) => { const x = x0 + pos * u; c.beginPath(); c.moveTo(x, ym - 6); c.lineTo(x, ym + 6); c.stroke(); c.fillText(lab, x - 5, ym + 22); });
  }
}
// Material 6 (IQB): gedämpfte Schwingung mit zwei Messmarken
const BL = { L: 4.7e-3, C: 69e-12, R: 144 };
BL.d = BL.R / (2 * BL.L); BL.w = Math.sqrt(1 / (BL.L * BL.C) - BL.d ** 2);
function drawBlitz(cv, mA, mB) {
  const W = 640, H = 270, x0 = 50, x1 = 620, ym = 125, A = 100, tmax = 80;
  const c = setupCanvas(cv, W, H);
  c.strokeStyle = css('--line'); c.lineWidth = 1; c.fillStyle = css('--muted'); c.font = '13px ' + css('--f-mono');
  for (let t = 0; t <= tmax; t += 5) { const x = x0 + (x1 - x0) * t / tmax; c.beginPath(); c.moveTo(x, ym - A - 8); c.lineTo(x, ym + A + 8); c.stroke(); if (t % 10 === 0) c.fillText(t, x - 7, ym + A + 26); }
  for (let u = -150; u <= 150; u += 50) { const y = ym - A * u / 150; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.fillText(u, 8, y + 4); }
  c.fillStyle = css('--ink'); c.font = '14px ' + css('--f-body'); c.fillText('t in µs', x1 - 50, H - 4); c.fillText('U in V', x0 + 4, 14);
  c.strokeStyle = css('--ink'); c.lineWidth = 1.2; c.beginPath(); c.moveTo(x0, ym); c.lineTo(x1, ym); c.stroke();
  c.strokeStyle = css('--navy'); c.lineWidth = 1.4; c.beginPath();
  for (let i = 0; i <= 4000; i++) { const t = tmax * i / 4000 * 1e-6; const U = 150 * Math.exp(-BL.d * t) * Math.cos(BL.w * t); const x = x0 + (x1 - x0) * i / 4000, y = ym - A * U / 150; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  if (mA != null) {
    [[mA, 'A'], [mB, 'B']].forEach(([t, l]) => { const x = x0 + (x1 - x0) * t / tmax; c.strokeStyle = css('--orange'); c.lineWidth = 2; c.beginPath(); c.moveTo(x, ym - A - 10); c.lineTo(x, ym + A + 10); c.stroke(); c.fillStyle = css('--orange'); c.font = 'bold 14px ' + css('--f-body'); c.fillText(l, x + 4, ym - A - 2); });
  }
}
// Schaltskizzen als SVG
function circ(kind) {
  const k = 'stroke="currentColor" stroke-width="2.2" fill="none"';
  const bat = x => `<line x1="${x}" y1="20" x2="${x}" y2="68" ${k}/><line x1="${x}" y1="82" x2="${x}" y2="130" ${k}/><line x1="${x - 14}" y1="68" x2="${x + 14}" y2="68" ${k}/><line x1="${x - 7}" y1="82" x2="${x + 7}" y2="82" stroke="currentColor" stroke-width="5"/>`;
  const cap = (x, y1, y2) => { const m = (y1 + y2) / 2; return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${m - 5}" ${k}/><line x1="${x}" y1="${m + 5}" x2="${x}" y2="${y2}" ${k}/><line x1="${x - 14}" y1="${m - 5}" x2="${x + 14}" y2="${m - 5}" stroke="currentColor" stroke-width="4"/><line x1="${x - 14}" y1="${m + 5}" x2="${x + 14}" y2="${m + 5}" stroke="currentColor" stroke-width="4"/><text x="${x - 30}" y="${m + 5}" font-size="15" fill="currentColor" font-style="italic">C</text>`; };
  const coil = (x, y1, y2) => { const m = (y1 + y2) / 2; let p = `<line x1="${x}" y1="${y1}" x2="${x}" y2="${m - 25}" ${k}/><line x1="${x}" y1="${m + 25}" x2="${x}" y2="${y2}" ${k}/>`; for (let i = 0; i < 5; i++) p += `<path d="M${x} ${m - 25 + i * 10} a6 5 0 0 1 0 10" ${k}/>`; return p + `<text x="${x + 14}" y="${m + 5}" font-size="15" fill="currentColor" font-style="italic">L</text>`; };
  const sw = (cx, cy, to) => `<circle cx="${cx - 22}" cy="20" r="3.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.8"/><circle cx="${cx + 22}" cy="20" r="3.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.8"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="currentColor"/><line x1="${cx}" y1="${cy}" x2="${cx + (to === 1 ? -20 : 20)}" y2="23" ${k}/><text x="${cx - 32}" y="13" font-size="12" fill="currentColor">1</text><text x="${cx + 26}" y="13" font-size="12" fill="currentColor">2</text>`;
  let g = '';
  if (kind === 'A') { // richtig
    g = bat(30) + `<line x1="30" y1="20" x2="98" y2="20" ${k}/><line x1="142" y1="20" x2="210" y2="20" ${k}/><line x1="30" y1="130" x2="210" y2="130" ${k}/>` + sw(120, 48, 1) + `<line x1="120" y1="48" x2="120" y2="52" ${k}/>` + cap(120, 52, 130) + coil(210, 20, 130);
  } else if (kind === 'B') { // alles in Reihe, kein Schalter
    g = bat(30) + `<line x1="30" y1="20" x2="210" y2="20" ${k}/><line x1="30" y1="130" x2="115" y2="130" ${k}/><line x1="125" y1="130" x2="210" y2="130" ${k}/><line x1="115" y1="116" x2="115" y2="144" stroke="currentColor" stroke-width="4"/><line x1="125" y1="116" x2="125" y2="144" stroke="currentColor" stroke-width="4"/><text x="112" y="110" font-size="15" fill="currentColor" font-style="italic">C</text>` + coil(210, 20, 130);
  } else if (kind === 'C') { // Schalter trennt die Spule ab, Quelle bleibt immer an C
    g = bat(30) + `<line x1="30" y1="20" x2="120" y2="20" ${k}/><line x1="120" y1="20" x2="120" y2="52" ${k}/><line x1="30" y1="130" x2="210" y2="130" ${k}/>` + cap(120, 52, 130) + `<line x1="120" y1="20" x2="148" y2="20" ${k}/><circle cx="152" cy="20" r="3.5" fill="currentColor"/><line x1="152" y1="20" x2="172" y2="8" ${k}/><circle cx="178" cy="20" r="3.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.8"/><line x1="182" y1="20" x2="210" y2="20" ${k}/>` + coil(210, 20, 130);
  } else { // D: Quelle direkt an Spule, C parallel zur Quelle über Schalter
    g = bat(30) + `<line x1="30" y1="20" x2="98" y2="20" ${k}/><line x1="142" y1="20" x2="210" y2="20" ${k}/><line x1="30" y1="130" x2="210" y2="130" ${k}/><line x1="30" y1="20" x2="30" y2="20" ${k}/><path d="M60 20 L60 6 L210 6 L210 20" ${k}/>` + sw(120, 48, 2) + cap(120, 48, 130) + coil(210, 20, 130);
  }
  return `<svg viewBox="0 0 250 140" role="img" aria-label="Schaltung ${kind}" style="color:var(--ink)">${g}</svg>`;
}

        { tip: 'Warum lädt sich der Kondensator nach T/4 wieder auf, obwohl keine Quelle mehr dran ist? Stichwort: Die Spule „will“, dass der Strom weiterfließt.' }],

/* ===================== Zustand: speichert nach jeder Eingabe (localStorage + sessionStorage) ===================== */
const KEY = 'abitrainer-schwingkreis-v1';
let STORAGE_OK = true;
function loadState() {
  let a = null, b = null;
  try { a = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
  try { b = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { }
  const c = [a, b].filter(x => x && typeof x === 'object').sort((x, y) => (y._t || 0) - (x._t || 0));
  return c[0] || {};
}
let ST = loadState();
var appLive = false;
function appChanged() { if (window.AppBridge && appLive) AppBridge.changed(); }
function save() {
  ST._t = Date.now(); appChanged();
  const str = JSON.stringify(ST); let ok = false;
  try { localStorage.setItem(KEY, str); ok = localStorage.getItem(KEY) === str; } catch (e) { ok = false; }
  try { sessionStorage.setItem(KEY, str); } catch (e) { }
  if (ok !== STORAGE_OK) { STORAGE_OK = ok; const w = document.getElementById('storeWarn'); if (w) w.hidden = ok; }
}
(function testStorage() { try { localStorage.setItem(KEY + '-t', '1'); STORAGE_OK = localStorage.getItem(KEY + '-t') === '1'; localStorage.removeItem(KEY + '-t'); } catch (e) { STORAGE_OK = false; } })();
document.addEventListener('visibilitychange', save);
window.addEventListener('pagehide', save);
window.addEventListener('blur', save);
function ps(id) { return ST[id] || (ST[id] = { hints: 0, shown: false, comp: {} }); }

const ALLPARTS = [];
TASKS.forEach(t => t.parts.forEach(p => { p.task = t; p.id = t.id + '-' + p.nr; p.be = p.comps.reduce((a, c) => a + c.be, 0); ALLPARTS.push(p); }));

function earned(p) {
  const s = ps(p.id);
  if (s.rest) return s.rest.e;
  let sum = 0;
  p.comps.forEach((c, i) => {
    const cs = s.comp[i]; if (!cs) return;
    if (c.kind === 'text') { sum += cs.self || 0; return; }
    if (!cs.ok || cs.afterShown) return;
    sum += cs.hintsAt ? Math.max(Math.ceil(c.be / 2), c.be - cs.hintsAt) : c.be;
  });
  return Math.min(sum, p.be);
}
const STNAMES = { solo: 'selbst geschafft', help: 'mit Hilfe geschafft', shown: 'Lösung angesehen' };
function status(p) {

const B36 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function makeCode() {
  const vals = ALLPARTS.map(p => { const [st] = status(p); const e = Math.min(9, earned(p)); if (!st || !(st in STNAMES)) return 0; return 1 + ['solo', 'help', 'shown'].indexOf(st) * 10 + e; });

}
function readCode(code) {

  const vals = [...raw.slice(0, -1)].map(ch => B36.indexOf(ch));

  const chk = vals.reduce((a, v, i) => (a + (i + 1) * v) % 36, 7);
  if (B36[chk] !== raw.slice(-1)) return false;
  ALLPARTS.forEach((p, i) => {

    if (!v) return;
    const st = ['solo', 'help', 'shown'][Math.floor((v - 1) / 10)], e = (v - 1) % 10;

}

const SUBMAP = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉', 'a': 'ₐ', 'e': 'ₑ', 'm': 'ₘ', 'x': 'ₓ', 'l': 'ₗ' };

}

      if (cs.ch != null) ans = c.opts && !c.optLabels ? plain(c.opts[cs.ch]) : (c.optLabels ? c.optLabels[cs.ch] : '');

      c.rows.forEach(([lab], k) => out.push(lab + ': ' + (cs.sel && +cs.sel[k] ? c.opts[+cs.sel[k]] : '–')));
      if (mark) out[out.length - 1] += mark;
    } else if (c.kind === 'text') {

      if (cs.rated) {
        const got = c.rubric.filter((r, k) => cs.ticks && cs.ticks[k]).map(r => '✓ ' + plain(r[0]));
        const miss = c.rubric.filter((r, k) => !(cs.ticks && cs.ticks[k])).map(r => '○ ' + plain(r[0]));
        out.push(...got, ...miss);
      }
    }
  });
  return out;
}

/* ---------- Seite „Auswertung“ ---------- */
function resultPage() {
  const sec = el('section', { role: 'tabpanel' });
  const card = el('div', { class: 'card' });
  card.append(el('h2', {}, 'Auswertung: Wo stehst du?'));
  const tbl = el('table', { class: 'res' });
  tbl.innerHTML = '<tr><th>Aufgabe</th><th>bearbeitet</th><th>selbst</th><th>mit Hilfe</th><th>BE</th></tr>';
  TASKS.forEach(t => {
    let e = 0, m = 0, solo = 0, help = 0;
    t.parts.forEach(p => { const [cls] = status(p); e += earned(p); m += p.be; if (cls === 'solo') solo++; if (cls === 'help') help++; });
    tbl.innerHTML += `<tr><td>${t.title.split(' · ')[0]}${t.id === 'P' ? ' (zählt extra)' : ''}</td><td class="n">${t.parts.filter(p => status(p)[0]).length}/${t.parts.length}</td><td class="n">${solo}</td><td class="n">${help}</td><td class="n">${e}/${m}</td></tr>`;
  });
  card.append(tbl);
  const T = totals();
  const res = el('div', { class: 'fb info' });
  res.innerHTML = T.att === 0 ? 'Du hast noch nichts bearbeitet. Fang mit Aufgabe 1 an!' :
    `<div>In den Teilaufgaben, die du bearbeitet hast, hast du <b>${T.tot} von ${T.att} BE</b> geholt, also <b>${T.pct} %</b>.</div><div class="big">≈ ${T.np} Notenpunkte</div><div class="small">Grobe Einschätzung nach der Abi-Tabelle (45 % = 5 Punkte, 75 % = 11 Punkte). Im echten Abi gibt es keine Hilfe-Knöpfe – „selbst geschafft“ ist also am ehrlichsten.</div>`;
  card.append(res);
  sec.append(card);

  /* Ergebnissicherung */
  const c2 = el('div', { class: 'card' });
  c2.innerHTML = `<h2>Deine Ergebnissicherung</h2><p class="lead">Speicher dir alles als PDF: deine Antworten, was richtig war, und zu jeder Aufgabe den Lösungsweg. Damit kannst du dich später auf die Klassenarbeit vorbereiten.</p>
  <div class="ansrow"><label for="nm">Dein Name</label><input id="nm" type="text" autocomplete="off" style="width:16em;font-family:var(--f-body)"></div>
  <div class="btns"><button class="btn" type="button" id="pdfBtn">Ergebnis-PDF speichern</button><button class="btn ghost" type="button" id="ovBtn">Ergebnisse hier ansehen</button></div>
  <div id="pdfMsg"></div><div id="overview" hidden></div>`;
  sec.append(c2);
  const nm = c2.querySelector('#nm'); nm.value = ST._name || '';
  nm.addEventListener('input', () => { ST._name = nm.value; save(); });
  c2.querySelector('#pdfBtn').addEventListener('click', () => makePdf(nm.value.trim(), c2.querySelector('#pdfMsg')));
  c2.querySelector('#ovBtn').addEventListener('click', () => { const ov = c2.querySelector('#overview'); if (ov.hidden) { renderOverview(ov); ov.hidden = false; } else ov.hidden = true; });

  /* Fortschrittscode */
  const c3 = el('div', { class: 'card' });
  c3.innerHTML = `<h2>Fortschrittscode</h2><p class="lead">Fotografier dir diesen Code ab. Falls dein Stand mal weg ist (anderes Tablet, Browser gelöscht), kannst du ihn hier eingeben und deine Punkte sind wieder da. Deine geschriebenen Texte stecken nicht im Code.</p>
  <div class="big" style="font-family:var(--f-mono);font-size:clamp(20px,4vw,28px);letter-spacing:.04em">${makeCode()}</div>
  <div class="ansrow" style="margin-top:12px"><label for="cdIn">Code eingeben</label><input id="cdIn" type="text" autocomplete="off" style="width:20em;font-size:16px"><button class="btn ghost" type="button" id="cdBtn">Stand wiederherstellen</button></div><div id="cdMsg"></div>`;
  sec.append(c3);
  c3.querySelector('#cdBtn').addEventListener('click', () => {
    const ok = readCode(c3.querySelector('#cdIn').value);
    c3.querySelector('#cdMsg').innerHTML = ok ? '<div class="fb ok">Stand wiederhergestellt.</div>' : '<div class="fb no">Der Code stimmt nicht. Prüf ihn nochmal (0 und O, 1 und I).</div>';
    if (ok) setTimeout(() => show(PAGES.length - 1), 700);
  });

  const reset = el('button', { class: 'btn warn', type: 'button' }, 'Alles zurücksetzen');
  let armed = false;
  reset.addEventListener('click', () => {
    if (!armed) { armed = true; reset.textContent = 'Wirklich alles löschen? Nochmal tippen'; setTimeout(() => { armed = false; reset.textContent = 'Alles zurücksetzen'; }, 5000); return; }
    const name = ST._name; ST = { _name: name }; save(); show(0);
  });
  const bt = el('div', { class: 'btns' }); bt.append(reset); sec.append(bt);
  return sec;
}
function renderOverview(ov) {
  ov.innerHTML = '';
  TASKS.forEach(t => {
    ov.append(el('h3', { style: 'color:var(--navy);margin:18px 0 4px' }, t.title));
    t.parts.forEach(p => {
      const [cls, txt] = status(p);
      const d = el('div', { class: 'task ' + cls });
      d.innerHTML = `<div class="thead"><div><span class="tnr">${p.nr}</span></div><span class="status ${cls}">${txt} · ${earned(p)}/${p.be}</span></div><div class="qtext small">${p.q}</div>`;
      const a = el('div', { class: 'mono', style: 'white-space:pre-wrap;font-size:14.5px' }); a.textContent = answersOf(p).join('\n'); d.append(a);
      d.append(el('div', { class: 'sol' }, '<b>Lösung:</b> ' + p.solution));
      ov.append(d);
    });
  });
}

/* ---------- PDF ---------- */
let jspdfLoading = null;
function loadJsPdf() {
  if (window.jspdf) return Promise.resolve();
  if (!jspdfLoading) jspdfLoading = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; sc.onload = res; sc.onerror = rej; document.head.append(sc); });
  return jspdfLoading;
}
async function makePdf(name, msg) {
  msg.innerHTML = '<div class="fb info">PDF wird erstellt …</div>';
  try { await loadJsPdf(); } catch (e) { msg.innerHTML = '<div class="fb no">Das PDF-Programm konnte nicht geladen werden. Nimm „Ergebnisse hier ansehen“ und mach Screenshots.</div>'; return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  doc.addFileToVFS('dv.ttf', FONT_R); doc.addFont('dv.ttf', 'dv', 'normal');
  doc.addFileToVFS('dvb.ttf', FONT_B); doc.addFont('dvb.ttf', 'dv', 'bold');
  const NAVY = [31, 58, 95], GREEN = [60, 122, 78], GREY = [110, 110, 110], BLUE = [31, 79, 181], INK = [25, 25, 25];
  const PW = 210, PH = 297, X = 20, WD = 170, TOP = 28, BOT = PH - 20;
  let y = TOP;
  const font = (w, sz, col) => { doc.setFont('dv', w); doc.setFontSize(sz); doc.setTextColor(...col); };
  const lh = sz => sz * 0.3528 * 1.45;
  const need = h => { if (y + h > BOT) { doc.addPage(); y = TOP; } };
  const para = (txt, w, sz, col, indent = 0, after = 1.5) => {
    font(w, sz, col);
    String(txt).split('\n').forEach(line => { doc.splitTextToSize(line, WD - indent).forEach(l => { need(lh(sz)); doc.text(l, X + indent, y + lh(sz) * 0.75); y += lh(sz); }); });
    y += after;
  };
  const T = totals(); const today = new Date().toLocaleDateString('de-DE');
  // Titel
  para('ELEKTROMAGNETISCHE SCHWINGUNGEN · ERGEBNISSICHERUNG', 'bold', 9, GREEN, 0, 0.5);
  para('Mein Abi-Check: Schwingkreis', 'bold', 17, NAVY, 0, 2);
  para('Name: ' + (name || '__________________') + '      Datum: ' + today, 'normal', 11, INK, 0, 1);
  para(T.att ? `Bearbeitet: ${T.att} von ${T.max} BE · geholt: ${T.tot} BE (${T.pct} %) · ≈ ${T.np} Notenpunkte` : 'Noch nichts bearbeitet.', 'normal', 11, INK, 0, 1);
  para('Fortschrittscode: ' + makeCode(), 'normal', 10, GREY, 0, 4);
  // Übersicht
  TASKS.forEach(t => { const e = t.parts.reduce((a, p) => a + earned(p), 0), m = t.parts.reduce((a, p) => a + p.be, 0); para(`${t.title}:  ${e} / ${m} BE${t.id === 'P' ? ' (extra)' : ''}`, 'normal', 10.5, INK, 4, 0.5); });
  y += 4;
  // Aufgaben
  TASKS.forEach((t, ti) => {
    doc.addPage(); y = TOP;
    para(t.title, 'bold', 14, NAVY, 0, 0.5);
    para('Quelle: ' + t.src, 'normal', 9, GREEN, 0, 1.5);
    para(plain(t.intro), 'normal', 10.5, INK, 0, 3);
    t.parts.forEach(p => {
      const [cls, txt] = status(p);
      need(30);
      para(`${p.nr}   (${p.be} BE)   ${txt} · ${earned(p)}/${p.be} BE`, 'bold', 11.5, GREEN, 0, 1);
      para(plain(p.q).replace(/Zeichne sie zuerst.*$|Skizziere zuerst.*$/m, ''), 'normal', 10.5, INK, 0, 1.5);
      para('Deine Antwort', 'bold', 10, NAVY, 0, 0.3);
      para(answersOf(p).join('\n'), 'normal', 10, INK, 3, 1.5);
      // Lösung in hellblauem Kasten
      font('normal', 10, BLUE);
      const lines = []; plain(p.solution).split('\n').forEach(l => lines.push(...doc.splitTextToSize(l, WD - 8)));
      const h = lines.length * lh(10) + 9;
      if (h < BOT - TOP) need(h);
      let yy = y; doc.setFillColor(232, 238, 245); doc.setDrawColor(...NAVY);
      const boxH = Math.min(h, BOT - y); doc.rect(X, yy, WD, boxH, 'F');
      font('bold', 10, NAVY); doc.text('Lösung', X + 4, yy + 5);
      y = yy + 7.5; font('normal', 10, BLUE);
      lines.forEach(l => { if (y + lh(10) > BOT) { doc.addPage(); y = TOP; } doc.text(l, X + 4, y + lh(10) * 0.75); y += lh(10); });
      y += 7;
    });
  });
  // Kopf/Fuß auf jeder Seite
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    try { doc.addImage(LOGO, 'JPEG', X, 9, 40, 6.9); } catch (e) { }
    font('bold', 9, NAVY); doc.text('Physik · TG2', X + WD, 14, { align: 'right' });
    doc.setDrawColor(...GREEN); doc.setLineWidth(0.6); doc.line(X, 18, X + WD, 18);
    doc.setDrawColor(190, 190, 190); doc.setLineWidth(0.2); doc.line(X, PH - 14, X + WD, PH - 14);
    font('normal', 8, GREY); doc.text('Abi-Check Schwingkreis' + (name ? ' · ' + name : ''), X, PH - 9.5);
    doc.text(`Seite ${i} / ${n}`, X + WD, PH - 9.5, { align: 'right' });
  }
  const blob = doc.output('blob');
  const fname = 'Abi-Check_Schwingkreis' + (name ? '_' + name.replace(/[^A-Za-z0-9äöüÄÖÜß_-]+/g, '_') : '') + '.pdf';
  let dl = null;
  try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  const fallback = (why) => {
    const url = URL.createObjectURL(blob);
    msg.innerHTML = `<div class="fb info">${why}<br><a href="${url}" target="_blank" rel="noopener">PDF in neuem Tab öffnen</a><br><span class="small">Klappt das auch nicht: Tipp auf „Ergebnisse hier ansehen“ und mach Screenshots. Dein Fortschrittscode steht unten.</span></div>`;
  };
  if (!dl) { fallback('Direktes Speichern geht hier nicht.'); return; }
  try { await dl.save({ filename: fname, data: blob }); msg.innerHTML = '<div class="fb ok">PDF gespeichert: ' + fname + '</div>'; }
  catch (e) { if (e && e.code === 'declined') msg.innerHTML = '<div class="fb info">Speichern abgebrochen.</div>'; else fallback('Speichern hat nicht geklappt.'); }
}

/* ===================== Navigation ===================== */
const PAGES = [{ tab: 'Start', make: startPage }].concat(TASKS.map(t => ({ tab: t.tab, id: t.id, make: () => taskPage(t) }))).concat([{ tab: 'Auswertung', make: resultPage }]);
function show(i) {
  ST._tab = i; save();
  document.querySelectorAll('nav button').forEach((b, k) => b.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  const main = $('#main'); main.innerHTML = ''; main.append(PAGES[i].make());
  const g = $('#go1'); if (g) g.addEventListener('click', () => show(1));
  window.scrollTo({ top: 0 }); updateScore();
}
PAGES.forEach((pg, i) => {
  const b = el('button', { role: 'tab', type: 'button' }, pg.tab + (pg.id ? '<span class="n"></span>' : ''));
  if (pg.id) b.dataset.id = pg.id;
  b.addEventListener('click', () => show(i)); $('#tabs').append(b);
});
(function start() {
  $('#storeWarn').hidden = STORAGE_OK;
  const hasData = ALLPARTS.some(p => status(p)[0]);
  const t = ST._tab || 0;
  show(t > 0 && t < PAGES.length ? t : 0);
  if (hasData) {
    const bn = $('#resumeBanner');
    bn.querySelector('span').innerHTML = 'Willkommen zurück! Dein Stand ist geladen: <b>' + $('#scoreNow').textContent + ' BE</b>. Du bist da, wo du aufgehört hast.';
    bn.hidden = false;
    bn.querySelector('button').addEventListener('click', () => { bn.hidden = true; });
  }
})();

/* ===== Anbindung an die Klassen-App (ohne Namen!) ===== */
if (window.AppBridge) {
  setTimeout(() => { appLive = true; }, 1500);
  const abgeschlossen = (t) => t.parts.every(p => ['solo', 'help', 'shown'].includes(status(p)[0]));
  AppBridge.register({
    getState() {
      const stationen = TASKS.map(t => t.id + ' · ' + t.tab);
      const erledigt = TASKS.filter(abgeschlossen).map(t => t.id + ' · ' + t.tab);
      const details = {};
      let punkte = 0;
      TASKS.forEach(t => {
        const e = t.parts.reduce((a, p) => a + earned(p), 0), m = t.parts.reduce((a, p) => a + p.be, 0);
        if (t.id !== 'P') punkte += e;
        details[t.id + ' · ' + t.tab] = e + ' von ' + m + ' BE';
      });
      const st = JSON.parse(JSON.stringify(ST)); delete st._name;
      return { punkte, stationen, erledigt, details, daten: { st } };
    },
    setState(s) {
      const d = s && s.daten; if (!d || !d.st) return;
      const name = ST._name;
      ST = Object.assign({}, d.st); if (name) ST._name = name;
      appLive = true; save(); show(ST._tab || 0);
    }
  });
}
</script>
