<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinematik-Übungsstudio</title>
<style>

body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 16px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header small{opacity:.85;display:block;font-size:14px;font-weight:400}
.score{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:16px}
h2{color:var(--navy);margin:8px 0 6px;font-size:21px}
p.lead{margin:0 0 14px;color:#41505f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--green);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:96px}
.topic:active,.topic:hover{border-color:var(--green)}

.mix{margin-top:14px;width:100%;background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer}

.back{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;color:var(--navy)}

p.small{font-size:14px;color:#5b6a79;margin:4px 0 0}

div.choice{cursor:default}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px;margin-top:10px}

.bar2{height:10px;background:#DDE6F0;border-radius:99px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--blue)}

h2.ah{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.topic.tx{border-left-color:#7B61C9}

.selfcheck{margin-top:22px}
.gkwrap{margin:6px 0 10px}

h2.ah small .req{font-weight:500;color:#7B61C9;font-size:14px}

ol.how{margin:4px 0 6px 20px;padding:0;font-size:16px;line-height:1.55}
ol.how li{margin:3px 0}
.aline{background:#EEF4FA;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:15px;color:var(--navy)}
.fb.plus{background:#E3F0FA;border-left:8px solid var(--blue);color:var(--navy);line-height:2.2}
.fb.plus .b{min-height:40px;padding:6px 16px;margin-left:8px}

.mt td,.mt th{white-space:nowrap}

<body>
<header><div class="in"><h1>Kinematik-Übungsstudio<small>Vorbereitung auf die Klassenarbeit · üben, prüfen, Challenge freischalten</small></h1><div class="score" id="score">Richtig: 0 von 0</div></div></header>
<main id="app"></main>
<footer>Tipp: Rechne mit Zettel und Stift. Kommazahlen darfst du mit Komma oder Punkt eingeben. Die Einheit musst du nicht mit eintippen.</footer>

<script src="../bridge.js"></script>
<script>
"use strict";
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=(x,d=1)=>{let s=Number(x.toFixed(d)).toString();return s.replace('.',',')};
const NAV='#1F3A5F',BLUE='#2F7FC1',ORG='#E8833A',GRN='#3C7A4E',GRID='#D6DEE8';
function niceStep(max,target=6){const raw=max/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10]){if(m*p>=raw)return m*p}return 10*p}

/* ---------- Diagramme (SVG) ---------- */
function chart(o){
  const W=o.w||440,H=o.h||270,L=o.nums===false?30:48,R=16,Tp=22,B=o.nums===false?30:40;
  const pw=W-L-R,ph=H-Tp-B;
  const x0=o.xmin||0,x1=o.xmax,y0=o.ymin||0,y1=o.ymax;
  const X=x=>L+(x-x0)/(x1-x0)*pw,Y=y=>Tp+ph-(y-y0)/(y1-y0)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">`;
  s+=`<rect x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="#fff" stroke="${GRID}"/>`;
  if(o.nums===false){
    for(let i=1;i<8;i++){s+=`<line x1="${L+pw*i/8}" y1="${Tp}" x2="${L+pw*i/8}" y2="${Tp+ph}" stroke="#EEF2F7"/>`}
    for(let i=1;i<6;i++){s+=`<line x1="${L}" y1="${Tp+ph*i/6}" x2="${L+pw}" y2="${Tp+ph*i/6}" stroke="#EEF2F7"/>`}
  }else{
    const sx=o.xstep||niceStep(x1-x0),sy=o.ystep||niceStep(y1-y0);
    for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){s+=`<line x1="${X(x)}" y1="${Tp}" x2="${X(x)}" y2="${Tp+ph}" stroke="${GRID}"/><text x="${X(x)}" y="${Tp+ph+16}" font-size="12" text-anchor="middle" fill="${NAV}">${fmt(x,2)}</text>`}
    for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){s+=`<line x1="${L}" y1="${Y(y)}" x2="${L+pw}" y2="${Y(y)}" stroke="${GRID}"/><text x="${L-6}" y="${Y(y)+4}" font-size="12" text-anchor="end" fill="${NAV}">${fmt(y,2)}</text>`}
  }
  if(y0<0&&y1>0)s+=`<line x1="${L}" y1="${Y(0)}" x2="${L+pw}" y2="${Y(0)}" stroke="${NAV}" stroke-width="1.6"/>`;
  s+=`<line x1="${L}" y1="${Tp}" x2="${L}" y2="${Tp+ph}" stroke="${NAV}" stroke-width="1.6"/>`;
  if(!(y0<0&&y1>0))s+=`<line x1="${L}" y1="${Tp+ph}" x2="${L+pw}" y2="${Tp+ph}" stroke="${NAV}" stroke-width="1.6"/>`;
  (o.secs||[]).forEach(([a,b,lab])=>{s+=`<line x1="${X(b)}" y1="${Tp}" x2="${X(b)}" y2="${Tp+ph}" stroke="#9AA9BA" stroke-dasharray="4 4"/><text x="${(X(a)+X(b))/2}" y="${Tp+14}" font-size="13" font-weight="700" text-anchor="middle" fill="${NAV}">${lab}</text>`});
  (o.series||[]).forEach(se=>{
    const c=se.color||BLUE;
    if(se.segs){se.segs.forEach(([a,b,v])=>{s+=`<line x1="${X(a)}" y1="${Y(v)}" x2="${X(b)}" y2="${Y(v)}" stroke="${c}" stroke-width="3.4" stroke-linecap="round"/>`})}
    else{s+=`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`}
    if(se.label){const p=se.pts[se.pts.length-1];s+=`<text x="${Math.min(X(p[0])-4,W-R-2)}" y="${Y(p[1])-7}" font-size="13" font-weight="700" text-anchor="end" fill="${c}">${se.label}</text>`}
  });
  s+=`<text x="${L+pw}" y="${H-4}" font-size="13" text-anchor="end" fill="${NAV}" font-weight="700">${o.xlabel||''}</text>`;
  s+=`<text x="${L}" y="14" font-size="13" fill="${NAV}" font-weight="700">${o.ylabel||''}</text>`;
  return s+'</svg>';
}

/* ---------- Bewegung aus Abschnitten ---------- */
function pathFrom(segs,s0){let t=0,s=s0;const pts=[[0,s0]];segs.forEach(g=>{t+=g.d;s+=g.v*g.d;pts.push([t,s])});return pts}
function s0For(segs){const p=pathFrom(segs,0);const m=Math.min(...p.map(q=>q[1]));return m<0?-m:0}
function vSegs(segs){let t=0;return segs.map(g=>{const a=t;t+=g.d;return [a,t,g.v]})}
function key(segs){return JSON.stringify(segs.map(g=>[g.v,g.d]))}
function distractors(segs,vals,allowDur){
  const c=[];
  const rev=segs.slice().reverse().map((g,i)=>({v:g.v,d:segs[i].d}));c.push(rev);
  segs.forEach((g,i)=>{vals.filter(v=>v!==g.v).forEach(v=>{const n=segs.map(x=>({...x}));n[i].v=v;c.push(n)})});
  const neg=segs.map(g=>({v:-g.v,d:g.d}));c.push(neg);
  if(allowDur){for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){if(segs[i].d!==segs[j].d){const n=segs.map(x=>({...x}));n[i].d=segs[j].d;n[j].d=segs[i].d;c.push(n)}}}
  const seen=new Set([key(segs)]);const out=[];
  shuffle(c).forEach(n=>{const k=key(n);if(seen.has(k))return;seen.add(k);out.push(n)});
  return out;
}
function motionTask(segs,vals,mode,opt){
  /* mode 'sv': s(t) gegeben -> v(t) wählen ; 'vs': v(t) gegeben -> s(t) wählen */
  const ds=distractors(segs,vals,opt.allowDur).slice(0,2);
  const all=shuffle([{segs,ok:true},...ds.map(d=>({segs:d,ok:false}))]);
  const Ttot=segs.reduce((a,g)=>a+g.d,0);
  const q=opt.nums!==false;
  const sAll=all.map(a=>{const s0=s0For(a.segs);return pathFrom(a.segs,s0)});
  const smax=Math.max(...sAll.flat().map(p=>p[1]));
  const vmaxA=Math.max(...all.flatMap(a=>a.segs.map(g=>g.v)),0),vminA=Math.min(...all.flatMap(a=>a.segs.map(g=>g.v)),0);
  const vtop=vmaxA+ (vmaxA===0?1:Math.max(1,vmaxA*0.15)),vbot=vminA<0?vminA-Math.max(1,-vminA*0.15):0;
  const sy=q?Math.ceil(smax*1.1/ (niceStep(smax))) *niceStep(smax):smax*1.12;
  const common={xmax:Ttot,nums:q};
  const sOpt=(a,i)=>chart({...common,w:300,h:200,ymax:sy,ylabel:'s',xlabel:'t',series:[{pts:sAll[i],color:BLUE}],xstep:opt.xstep,ystep:opt.ystep});
  const vOpt=a=>chart({...common,w:300,h:200,ymax:vtop,ymin:vbot,ylabel:'v',xlabel:'t',series:[{segs:vSegs(a.segs),color:ORG}],xstep:opt.xstep,ystep:opt.vstep});
  const correct=all.find(a=>a.ok),ci=all.indexOf(correct);
  const sOK=sAll[ci];
  let fig,choices,qtxt;
  if(mode==='sv'){
    fig=chart({...common,w:440,h:270,ymax:sy,ylabel:'s',xlabel:'t',series:[{pts:sOK,color:BLUE}],xstep:opt.xstep,ystep:opt.ystep});
    choices=all.map((a,i)=>({html:vOpt(a),correct:a.ok}));
    qtxt='Hier siehst du das <b>s(t)-Diagramm</b>. Welches <b>v(t)-Diagramm</b> gehört dazu?';
  }else{
    const cmx=Math.max(...segs.map(g=>g.v),0),cmn=Math.min(...segs.map(g=>g.v),0);fig=chart({...common,w:440,h:270,ymax:cmx+(cmx===0?1:Math.max(1,cmx*.15)),ymin:cmn<0?cmn-1:0,ylabel:'v',xlabel:'t',series:[{segs:vSegs(segs),color:ORG}],xstep:opt.xstep,ystep:opt.vstep});
    choices=all.map((a,i)=>({html:sOpt(a,i),correct:a.ok}));
    qtxt='Hier siehst du das <b>v(t)-Diagramm</b>. Welches <b>s(t)-Diagramm</b> gehört dazu?';
  }
  return {fig,choices,qtxt,all};
}
function explainMotion(segs,names,qual){
  const li=segs.map((g,i)=>{
    const n=names[i]||('Abschnitt '+(i+1));
    let t;
    if(g.v===0)t=`<b>${n}:</b> Die s(t)-Linie ist <b>waagrecht</b>, der Körper steht. Im v(t)-Diagramm liegt die Linie deshalb auf <b>v = 0</b>.`;
    else if(g.v>0)t=`<b>${n}:</b> Die s(t)-Linie <b>steigt</b>. Der Weg wächst, v ist positiv.${qual?'':' Steigung = '+fmt(g.v,1)+' m/s, also v = '+fmt(g.v,1)+' m/s.'}`;
    else t=`<b>${n}:</b> Die s(t)-Linie <b>fällt</b>. Der Körper fährt zurück, v ist <b>negativ</b>.${qual?'':' Steigung = '+fmt(g.v,1)+' m/s.'}`;
    return '<li>'+t+'</li>';
  }).join('');
  return `<p>Die Geschwindigkeit ist die <b>Steigung</b> der Linie im s(t)-Diagramm. Gehe Abschnitt für Abschnitt vor:</p><ol>${li}</ol><p>Gleichförmige Abschnitte erscheinen im v(t)-Diagramm als <b>waagrechte Linien</b>. Je steiler die s(t)-Linie, desto höher liegt die v(t)-Linie.</p>`;
}

/* ---------- Aufgabentypen ---------- */
const TOPICS=[];

/* 1 Zeitpunkt oder Zeitraum */
TOPICS.push({id:'zz',title:'Zeitpunkt oder Zeitraum?',desc:'Momentan- oder Durchschnittsgeschwindigkeit erkennen',gen(){
  const P=['Der Tacho zeigt gerade 120 km/h.','Der Blitzer misst bei deinem Auto 63 km/h.','Beim Überqueren der Ziellinie hat die Läuferin 8,5 m/s.','In diesem Augenblick fährt der Bus 50 km/h.','Das Navi zeigt jetzt 87 km/h an.','Der Radar misst am Ortseingang 58 km/h.'];
  const Z=['Der Zug fährt in 2 Stunden 200 km weit.','Jonas joggt in 20 Minuten 3 km weit.','Die Radfahrerin braucht für 30 km genau 1,5 Stunden.','Das Auto kommt von 8 bis 10 Uhr 180 km weit.','Die Marathonläuferin läuft 42 km in 3 Stunden.','Der Bus fährt in 45 Minuten 30 km weit.'];
  const isP=Math.random()<.5;const sent=pick(isP?P:Z);
  return {title:'Zeitpunkt oder Zeitraum?',q:`<p>„<i>${sent}</i>“</p><p>Sagt dieser Satz etwas über einen <b>Zeitpunkt</b> oder über einen <b>Zeitraum</b>? Welche Geschwindigkeit ist gemeint?</p>`,
  choices:shuffle([{html:'<b>Zeitpunkt</b><br>Momentangeschwindigkeit',correct:isP},{html:'<b>Zeitraum</b><br>Durchschnittsgeschwindigkeit',correct:!isP}]),cl:'c2',
  hint:'Frage dich: Gilt die Zahl für einen einzigen Augenblick („gerade“, „jetzt“, „in diesem Moment“) oder für eine Fahrt mit Anfang und Ende?',
  expl:isP?`<p>Der Satz beschreibt einen <b>einzigen Augenblick</b>. Gemessen wird die <b>Momentangeschwindigkeit</b>: So schnell ist der Körper <i>genau jetzt</i>. Davor oder danach kann er schneller oder langsamer sein.</p>`:`<p>Im Satz kommen eine <b>Strecke und eine Dauer</b> vor. Das beschreibt einen <b>Zeitraum</b>. Gemeint ist die <b>Durchschnittsgeschwindigkeit</b>: v = s : t. Zwischendurch kann der Körper schneller oder langsamer gewesen sein.</p>`};
}});

/* 2 Umrechnen */
TOPICS.push({id:'um',title:'Umrechnen km/h ↔ m/s',desc:'km/h, m/s und m/min sicher umrechnen',gen(){
  const m=rnd(1,4);let q,ans,tol,expl,hint,unit;
  if(m===1){const k=pick([18,36,54,72,90,108,126,144]);ans=k/3.6;tol=.05;q=`Rechne <b>${k} km/h</b> in <b>m/s</b> um.`;unit='m/s';hint='km/h → m/s: durch 3,6 teilen.';expl=`<p>km/h → m/s: <b>durch 3,6</b>.</p><p class="res">${k} km/h : 3,6 = ${fmt(ans,0)} m/s</p><p>Probe: ${fmt(ans,0)} m/s · 3,6 = ${k} km/h ✓</p>`}
  else if(m===2){const k=pick([50,80,100,120,130,30,60]);ans=k/3.6;tol=.12;q=`Rechne <b>${k} km/h</b> in <b>m/s</b> um. Runde auf eine Nachkommastelle.`;unit='m/s';hint='km/h → m/s: durch 3,6 teilen.';expl=`<p>km/h → m/s: <b>durch 3,6</b>.</p><p class="res">${k} km/h : 3,6 = ${fmt(ans,2)} m/s ≈ ${fmt(ans,1)} m/s</p>`}
  else if(m===3){const k=pick([5,8,10,12,15,20,25,30,35]);ans=k*3.6;tol=.15;q=`Rechne <b>${k} m/s</b> in <b>km/h</b> um.`;unit='km/h';hint='m/s → km/h: mit 3,6 multiplizieren.';expl=`<p>m/s → km/h: <b>mal 3,6</b>.</p><p class="res">${k} m/s · 3,6 = ${fmt(ans,1)} km/h</p>`}
  else{const k=pick([60,90,120,150,180,240,300,420]);ans=k/60;tol=.03;q=`Eine Schnecke-Rennmaus schafft <b>${k} m</b> in einer <b>Minute</b>, also ${k} m/min. Rechne in <b>m/s</b> um.`;unit='m/s';hint='Eine Minute hat 60 Sekunden: durch 60 teilen.';expl=`<p>m/min → m/s: <b>durch 60</b>, denn 1 min = 60 s.</p><p class="res">${k} m/min : 60 = ${fmt(ans,2)} m/s</p>`}
  return {title:'Umrechnen',q:`<p>${q.replace('Schnecke-Rennmaus','Rennmaus')}</p>`,inputs:[{label:'Ergebnis',unit,ans,tol}],hint,expl};
}});

/* 3 v = s : t */
TOPICS.push({id:'v',title:'Geschwindigkeit berechnen',desc:'v = s : t, auch nach s oder t umstellen',gen(){
  const who=pick([['Lena','läuft'],['Ben','radelt'],['Tarek','fährt Skateboard'],['Mia','schwimmt'],['Der Roboter','rollt']]);
  const v=pick([2,2.5,4,5,6,8,10,12,15]),t=pick([4,5,8,10,12,20,30]);const s=v*t;const m=rnd(1,3);
  const [n,vb]=who;
  if(m===1)return {title:'Geschwindigkeit berechnen',q:`<p>${n} ${vb} <b>${fmt(s,0)} m</b> in <b>${t} s</b> (gleichmäßig). Wie groß ist die Geschwindigkeit?</p>`,inputs:[{label:'v',unit:'m/s',ans:v,tol:.03}],hint:'v = s : t (Strecke geteilt durch Zeit).',expl:`<ol><li>Gegeben: s = ${fmt(s,0)} m, t = ${t} s</li><li>Formel: v = s : t</li><li class="res">v = ${fmt(s,0)} m : ${t} s = ${fmt(v,2)} m/s</li></ol>`};
  if(m===2)return {title:'Strecke berechnen',q:`<p>${n} ${vb} mit <b>${fmt(v,1)} m/s</b> gleichmäßig. Wie weit kommt das in <b>${t} s</b>?</p>`,inputs:[{label:'s',unit:'m',ans:s,tol:.3}],hint:'Stelle um: s = v · t.',expl:`<ol><li>Gegeben: v = ${fmt(v,1)} m/s, t = ${t} s</li><li>Aus v = s : t folgt s = v · t</li><li class="res">s = ${fmt(v,1)} m/s · ${t} s = ${fmt(s,1)} m</li></ol>`};
  return {title:'Zeit berechnen',q:`<p>${n} ${vb} mit <b>${fmt(v,1)} m/s</b> gleichmäßig. Wie lange braucht das für <b>${fmt(s,0)} m</b>?</p>`,inputs:[{label:'t',unit:'s',ans:t,tol:.05}],hint:'Stelle um: t = s : v.',expl:`<ol><li>Gegeben: s = ${fmt(s,0)} m, v = ${fmt(v,1)} m/s</li><li>Aus v = s : t folgt t = s : v</li><li class="res">t = ${fmt(s,0)} m : ${fmt(v,1)} m/s = ${fmt(t,1)} s</li></ol>`};
}});

/* 4 Durchschnittsgeschwindigkeit mit Halt */
TOPICS.push({id:'dv',title:'Fahrt mit Halt',desc:'Durchschnittsgeschwindigkeit, Momentangeschwindigkeit',gen(){
  const vo=[40,60,80,100],to=[1,1.5,2];
  let v1=pick(vo),v2=pick(vo),t1=pick(to),t2=pick(to),p=pick([.5,1]);
  while(v1===v2)v2=pick(vo);
  const s1=v1*t1,s2=v2*t2,S=s1+s2,Tt=t1+p+t2,vm=S/Tt;
  const veh=pick([['Ein Reisebus','fährt'],['Ein Zug','fährt'],['Familie Weber','fährt mit dem Auto']]);
  const pts=[[0,0],[t1,s1],[t1+p,s1],[Tt,S]];
  const ymax=Math.ceil(S/50)*50;
  const fig=chart({xmax:Math.ceil(Tt),ymax,xlabel:'t in h',ylabel:'s in km',series:[{pts,color:BLUE}],xstep:.5,ystep:50});
  return {title:'Fahrt mit Halt',q:`<p>${veh[0]} ${veh[1]} zuerst <b>${fmt(t1,1)} h</b> lang mit konstant <b>${v1} km/h</b>, hält dann <b>${fmt(p,1)} h</b> an einer Raststätte und fährt anschließend <b>${fmt(t2,1)} h</b> lang mit konstant <b>${v2} km/h</b> weiter.</p><p>Bestimme die <b>Durchschnittsgeschwindigkeit der ganzen Fahrt</b> (mit dem Halt) und die <b>Momentangeschwindigkeit</b> mitten im Halt.</p>`,fig,
  inputs:[{label:'Durchschnitt',unit:'km/h',ans:vm,tol:.6,id:'avg'},{label:'Momentan im Halt',unit:'km/h',ans:0,tol:.01,id:'mom'}],
  wrong(v){const a=v.avg;if(a==null)return '';if(Math.abs(a-(v1+v2)/2)<.6&&Math.abs(vm-(v1+v2)/2)>1)return 'Du hast die beiden Tempi gemittelt. Das geht nicht, weil die Zeiten verschieden lang sind. Rechne Gesamtstrecke : Gesamtzeit.';if(Math.abs(a-S/(t1+t2))<.6&&Math.abs(vm-S/(t1+t2))>1)return 'Du hast den Halt vergessen. Die Pause zählt zur Gesamtzeit.';return ''},
  hint:'Durchschnitt = Gesamtstrecke : Gesamtzeit. Die Pause gehört zur Gesamtzeit. Im Halt steht der Körper still.',
  expl:`<ol><li>Strecke 1: ${v1} km/h · ${fmt(t1,1)} h = ${fmt(s1,0)} km</li><li>Strecke 2: ${v2} km/h · ${fmt(t2,1)} h = ${fmt(s2,0)} km</li><li>Gesamtstrecke: ${fmt(S,0)} km</li><li>Gesamtzeit <b>mit Halt</b>: ${fmt(t1,1)} h + ${fmt(p,1)} h + ${fmt(t2,1)} h = ${fmt(Tt,1)} h</li><li class="res">v<sub>Durchschnitt</sub> = ${fmt(S,0)} km : ${fmt(Tt,1)} h ≈ ${fmt(vm,1)} km/h</li><li class="res">Im Halt: v = 0 km/h (waagrechte Linie im Diagramm).</li></ol><p>Achtung: Der Durchschnitt ist <b>nicht</b> der Mittelwert von ${v1} und ${v2} km/h.</p>`};
}});

/* 5 Diagramm lesen */
TOPICS.push({id:'lesen',title:'s(t)-Diagramm lesen',desc:'Geschwindigkeit aus der Steigung bestimmen',gen(){
  let segs;
  for(;;){segs=[0,1,2].map(()=>({d:pick([2,3,4]),v:pick([0,1,2,3,4,5])}));
    const vs=segs.map(g=>g.v);if(new Set(vs).size===3&&vs.filter(v=>v===0).length<=1)break}
  const sec=['I','II','III'];let t=0;const secs=segs.map((g,i)=>{const a=t;t+=g.d;return [a,t,sec[i]]});
  const pts=pathFrom(segs,0),smax=pts[pts.length-1][1]===0?5:Math.max(...pts.map(p=>p[1]));
  const st=niceStep(smax,5);const ymax=Math.ceil(smax*1.05/st)*st;
  const fig=chart({xmax:t,ymax,xlabel:'t in s',ylabel:'s in m',series:[{pts,color:BLUE}],secs,xstep:1,ystep:st});
  const mode=Math.random()<.5?'fast':'num';
  if(mode==='fast'){
    const mx=Math.max(...segs.map(g=>g.v));const ci=segs.findIndex(g=>g.v===mx);
    return {title:'Diagramm lesen',q:`<p>Das Diagramm zeigt die Fahrt eines Spielzeugautos in drei Abschnitten. In welchem Abschnitt ist es am <b>schnellsten</b>?</p>`,fig,
    choices:sec.map((n,i)=>({html:'<b>Abschnitt '+n+'</b>',correct:i===ci})),cl:'c3',hint:'Je steiler die Linie, desto schneller. Waagrecht heißt: Stillstand.',
    expl:`<p>Die Geschwindigkeit ist die <b>Steigung</b> der Linie: v = Δs : Δt.</p><ol>${segs.map((g,i)=>`<li>Abschnitt ${sec[i]}: ${fmt(g.v*g.d,0)} m in ${g.d} s → v = ${fmt(g.v,0)} m/s${g.v===0?' (steht)':''}</li>`).join('')}</ol><p class="res">Am schnellsten ist Abschnitt ${sec[ci]} (${fmt(mx,0)} m/s). Das ist die steilste Linie.</p>`};
  }
  const k=rnd(0,2),g=segs[k];
  return {title:'Diagramm lesen',q:`<p>Das Diagramm zeigt die Fahrt eines Spielzeugautos. Bestimme die Geschwindigkeit im <b>Abschnitt ${sec[k]}</b>.</p>`,fig,inputs:[{label:'v im Abschnitt '+sec[k],unit:'m/s',ans:g.v,tol:.15}],
  hint:'Lies am Anfang und am Ende des Abschnitts den Weg ab. v = (Weg am Ende − Weg am Anfang) : Zeit des Abschnitts.',
  expl:`<ol><li>Abschnitt ${sec[k]} dauert von t = ${fmt(secs[k][0],0)} s bis t = ${fmt(secs[k][1],0)} s, also ${g.d} s.</li><li>Weg am Anfang: ${fmt(pts[k][1],0)} m, Weg am Ende: ${fmt(pts[k+1][1],0)} m → Strecke ${fmt(g.v*g.d,0)} m.</li><li class="res">v = ${fmt(g.v*g.d,0)} m : ${g.d} s = ${fmt(g.v,1)} m/s</li></ol>`};
}});

/* 6 s(t) <-> v(t) zuordnen */
TOPICS.push({id:'zuo',title:'s(t) und v(t) zuordnen',desc:'Welches Diagramm passt zum anderen?',gen(){
  let segs;
  for(;;){const n=3;segs=[];for(let i=0;i<n;i++)segs.push({d:pick([2,3,4]),v:pick([0,1,2,3,4])});
    if(Math.random()<.4)segs[2].v=-pick([1,2]);
    let ok=true;for(let i=1;i<n;i++)if(segs[i].v===segs[i-1].v)ok=false;
    if(segs.filter(g=>g.v===0).length>1)ok=false;
    if(ok)break}
  const mode=Math.random()<.5?'sv':'vs';
  const m=motionTask(segs,[-2,-1,0,1,2,3,4],mode,{allowDur:true,xstep:1,ystep:undefined,vstep:1});
  return {title:'Diagramme zuordnen',q:`<p>${m.qtxt}</p>`,fig:m.fig,choices:m.choices.map((c,i)=>({...c,label:'ABC'[i]})),cl:'c3',
  hint:'Waagrecht im s(t)-Diagramm heißt: v = 0. Je steiler, desto größer v. Eine fallende s(t)-Linie bedeutet negative Geschwindigkeit.',expl:explainMotion(segs,['Abschnitt 1','Abschnitt 2','Abschnitt 3'],false)};
}});

/* 8 Läufer */
TOPICS.push({id:'lauf',title:'Zwei Läufer im Diagramm',desc:'Geschwindigkeiten ablesen, Überholpunkt finden',gen(){
  const vA=pick([4,5,6,8]),vB=pick([2,3,4].filter(x=>x<vA));const to=pick([5,8,10,12]);
  const s0=(vA-vB)*to;const xmax=Math.round(to*1.6);const ymax=Math.ceil(Math.max(vA*xmax,s0+vB*xmax)*1.05/niceStep(vA*xmax,6))*niceStep(vA*xmax,6);
  const so=vA*to;
  const fig=chart({xmax,ymax,xlabel:'t in s',ylabel:'s in m',xstep:niceStep(xmax,8)<=1?1:(xmax>10?2:1),ystep:niceStep(ymax,6),series:[{pts:[[0,0],[xmax,vA*xmax]],color:BLUE,label:'A'},{pts:[[0,s0],[xmax,s0+vB*xmax]],color:ORG,label:'B'}]});
  return {title:'Zwei Läufer',q:`<p>Läufer <b>A</b> (blau) startet am Startpunkt. Läuferin <b>B</b> (orange) bekommt einen Vorsprung. Beide laufen gleichmäßig. Lies die Werte aus dem Diagramm ab.</p>`,fig,
  inputs:[{label:'v von A',unit:'m/s',ans:vA,tol:.3},{label:'v von B',unit:'m/s',ans:vB,tol:.3},{label:'A überholt B bei t =',unit:'s',ans:to,tol:.6}],
  hint:'Lies bei jeder Linie zwei Punkte ab und rechne v = Δs : Δt. Überholt wird dort, wo sich die Linien schneiden.',
  expl:`<ol><li>A: Nach ${to} s ist A bei ${fmt(so,0)} m → v<sub>A</sub> = ${fmt(so,0)} m : ${to} s = ${fmt(vA,0)} m/s.</li><li>B startet bei ${fmt(s0,0)} m und ist nach ${to} s bei ${fmt(s0+vB*to,0)} m. Das sind ${fmt(vB*to,0)} m in ${to} s → v<sub>B</sub> = ${fmt(vB,0)} m/s.</li><li class="res">Die Linien schneiden sich bei t = ${to} s (Ort ${fmt(so,0)} m). Dort überholt A die Läuferin B.</li></ol><p>Probe: Δv = v<sub>A</sub> − v<sub>B</sub> = ${vA} m/s − ${vB} m/s = ${vA-vB} m/s, Vorsprung ${fmt(s0,0)} m → t = ${fmt(s0,0)} m : ${vA-vB} m/s = ${to} s ✓</p>`};
}});

/* 9 Überholvorgang */
TOPICS.push({id:'ueh',title:'Der Überholvorgang',desc:'Überholdauer, Überholweg und freie Strecke bei Gegenverkehr',gen(){
  const pr=pick([[108,90,30,25],[90,72,25,20],[72,54,20,15],[126,90,35,25],[144,108,40,30],[108,72,30,20],[144,126,40,35]]);
  const [k1,k2,m1,m2]=pr;const a=pick([5,10]),L=pick([10,15,20]),l=pick([4,5]);
  const S=2*a+L+l,D=m1-m2,t=S/D,sp=m1*t,sg=m1*t;const frei=sp+sg;
  const stFig=chart({xmax:Math.ceil(t*1.25),ymax:Math.ceil(m1*Math.ceil(t*1.25)/niceStep(m1*t*1.25,6))*niceStep(m1*t*1.25,6),xlabel:'t in s',ylabel:'s in m',series:[{pts:[[0,0],[Math.ceil(t*1.25),m1*Math.ceil(t*1.25)]],color:BLUE,label:'PKW'},{pts:[[0,S],[Math.ceil(t*1.25),S+m2*Math.ceil(t*1.25)]],color:ORG,label:'LKW'}],ystep:niceStep(m1*t*1.25,6)});
  return {sim:{m1,m2,a,L,l,S,t,sp,frei},title:'Der Überholvorgang',q:`<p>Ein PKW (l<sub>PKW</sub> = <b>${l} m</b>) fährt mit v<sub>PKW</sub> = <b>${k1} km/h</b> hinter einem LKW (l<sub>LKW</sub> = <b>${L} m</b>, v<sub>LKW</sub> = <b>${k2} km/h</b>) her. Vor und nach dem Überholen hält er je s<sub>A</sub> = <b>${a} m</b> Sicherheitsabstand. Auf der Gegenspur kommt ein Auto mit v<sub>G</sub> = <b>${k1} km/h</b> entgegen.</p><p>Berechne die <b>Überholdauer t<sub>ü</sub></b>, den <b>Überholweg s<sub>PKW</sub></b> und wie weit die Gegenspur mindestens <b>frei</b> sein muss (<b>s<sub>frei</sub></b>).</p>`,
  inputs:[{label:'Überholdauer t<sub>ü</sub>',unit:'s',ans:t,tol:.06,id:'t'},{label:'Überholweg s<sub>PKW</sub>',unit:'m',ans:sp,tol:1.5,id:'s'},{label:'freie Strecke s<sub>frei</sub>',unit:'m',ans:frei,tol:2.5,id:'f'}],
  hint:'Rechne zuerst alles in m/s (km/h : 3,6). Der PKW muss die Aufholstrecke s<sub>auf</sub> = s<sub>A</sub> + l<sub>LKW</sub> + s<sub>A</sub> + l<sub>PKW</sub> aufholen, und zwar mit dem Geschwindigkeitsunterschied Δv = v<sub>PKW</sub> − v<sub>LKW</sub>.',
  wrong(v){if(v.t!=null&&Math.abs(v.t-S/m1)<.1&&Math.abs(t-S/m1)>.2)return 'Du hast mit der ganzen PKW-Geschwindigkeit gerechnet. Zum Überholen zählt nur der Geschwindigkeitsunterschied Δv = v<sub>PKW</sub> − v<sub>LKW</sub>.';return ''},
  expl:`<ol><li>Umrechnen: v<sub>PKW</sub> = ${k1} km/h = ${m1} m/s, v<sub>LKW</sub> = ${k2} km/h = ${m2} m/s</li><li>Aufholstrecke: s<sub>auf</sub> = s<sub>A</sub> + l<sub>LKW</sub> + s<sub>A</sub> + l<sub>PKW</sub> = ${a} m + ${L} m + ${a} m + ${l} m = <b>${S} m</b></li><li>Geschwindigkeitsunterschied: Δv = v<sub>PKW</sub> − v<sub>LKW</sub> = ${m1} m/s − ${m2} m/s = <b>${D} m/s</b></li><li class="res">Überholdauer: t<sub>ü</sub> = s<sub>auf</sub> : Δv = ${S} m : ${D} m/s = ${fmt(t,2)} s</li><li class="res">Überholweg: s<sub>PKW</sub> = v<sub>PKW</sub> · t<sub>ü</sub> = ${m1} m/s · ${fmt(t,2)} s = ${fmt(sp,1)} m</li><li class="res">Gegenverkehr: s<sub>G</sub> = v<sub>G</sub> · t<sub>ü</sub> = ${fmt(sg,1)} m. Freie Strecke: s<sub>frei</sub> = s<sub>PKW</sub> + s<sub>G</sub> = ${fmt(sp,1)} m + ${fmt(sg,1)} m = ${fmt(frei,1)} m</li></ol><p><b>Im s(t)-Diagramm:</b> Die LKW-Linie startet bei s<sub>auf</sub> = ${S} m (so weit muss der PKW aufholen). Der Schnittpunkt zeigt das Ende des Überholens.</p><div class="fig">${stFig}</div><p>Spiel jetzt oben die Simulation ab: Zeit und Wege werden angezeigt. Mit „Gegenverkehr“ startet das Auto genau ${fmt(frei,0)} m vor dem PKW. Es kommt knapp vorbei.</p>`};

function dim(x1,x2,y,lab,col){col=col||SC.nav;return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="1.5"/><path d="M${x1} ${y}l8 -4v8z M${x2} ${y}l-8 -4v8z" fill="${col}"/><line x1="${x1}" y1="${y-7}" x2="${x1}" y2="${y+7}" stroke="${col}"/><line x1="${x2}" y1="${y-7}" x2="${x2}" y2="${y+7}" stroke="${col}"/>`+T((x1+x2)/2,y-7,lab,{c:col,b:1})}
function arr(x1,y1,x2,y2,col,lab,ly){col=col||SC.nav;const a=Math.atan2(y2-y1,x2-x1),h=9;return `<line x1="${x1}" y1="${y1}" x2="${x2-Math.cos(a)*h*.8}" y2="${y2-Math.sin(a)*h*.8}" stroke="${col}" stroke-width="2.5"/><path d="M${x2} ${y2}L${x2-h*Math.cos(a-.45)} ${y2-h*Math.sin(a-.45)}L${x2-h*Math.cos(a+.45)} ${y2-h*Math.sin(a+.45)}z" fill="${col}"/>`+(lab?T((x1+x2)/2,(ly!=null?ly:Math.min(y1,y2)-8),lab,{c:col,b:1,s:12}):'')}
function snail(x,y,col,lab,flip){const f=flip?-1:1;return `<g transform="translate(${x} ${y}) scale(${f} 1)"><path d="M-22 0h40q6 0 6 -6" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/><circle cx="-6" cy="-13" r="12" fill="${col}" opacity=".85"/><path d="M-6 -13m-6 0a6 6 0 1 0 6 -6" fill="none" stroke="#fff" stroke-width="2"/><line x1="22" y1="-6" x2="27" y2="-17" stroke="${col}" stroke-width="2"/><line x1="18" y1="-6" x2="19" y2="-18" stroke="${col}" stroke-width="2"/></g>`+(lab?T(x,y+18,lab,{s:12,b:1,c:col}):'')}

function bike(x,y,col,lab){return `<circle cx="${x-12}" cy="${y-8}" r="8" fill="none" stroke="${col}" stroke-width="2.5"/><circle cx="${x+12}" cy="${y-8}" r="8" fill="none" stroke="${col}" stroke-width="2.5"/><path d="M${x-12} ${y-8}L${x-2} ${y-22}L${x+12} ${y-8}M${x-2} ${y-22}h10" stroke="${col}" stroke-width="2.5" fill="none"/><circle cx="${x-2}" cy="${y-34}" r="5" fill="${col}"/><line x1="${x-2}" y1="${y-29}" x2="${x-2}" y2="${y-22}" stroke="${col}" stroke-width="3"/>`+(lab?T(x,y+14,lab,{s:12,b:1,c:col}):'')}

/* ===== Torwart-Simulation ===== */
const GK=(function(){let P,c,ctx,raf=null,t=0,last=0,run=false,vk=5;
  function stop(){if(raf)cancelAnimationFrame(raf);raf=null;run=false}
  function mount(host,p){stop();P=p;t=0;vk=5;
    host.innerHTML=`<div class="simbox"><canvas id="gkc"></canvas><div class="sbtn"><button id="gkPlay">▶ Schuss</button><label class="gkl">Torwart nach der Reaktion: <b id="gkv">5,0</b> m/s<input type="range" id="gkr" min="1" max="25" step=".5" value="5"></label><button id="gkMine">Mein Ergebnis aus b)</button></div><div class="note" id="gkNote">Zeitlupe (8-mal langsamer). Stell die Geschwindigkeit des Torwarts ein. Ein Profi-Torwart schafft zur Seite etwa 4–6 m/s.</div></div>`;
    c=document.getElementById('gkc');ctx=c.getContext('2d');size();
    document.getElementById('gkPlay').onclick=()=>{t=0;run=true;last=performance.now();loop()};
    const r=document.getElementById('gkr');r.oninput=()=>{vk=+r.value;document.getElementById('gkv').textContent=fmt(vk,1);t=0;draw()};
    document.getElementById('gkMine').onclick=()=>{const i=document.getElementById('in1');const v=i?parse(i.value):null;if(v!=null&&v>0){vk=Math.min(40,v);r.value=Math.min(25,v);document.getElementById('gkv').textContent=fmt(vk,1);t=0;run=true;last=performance.now();loop()}else document.getElementById('gkNote').textContent='Trag zuerst bei b) dein Ergebnis ein.'};}
  function size(){const w=Math.min(c.parentElement.clientWidth-4,700),h=Math.round(w*.55);const d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);c._w=w;c._h=h;draw()}
  const tb=()=>11/P.vb;
  function loop(){const n=performance.now();const dt=(n-last)/1000;last=n;if(run){t+=dt/8;if(t>=tb()+.15){t=tb()+.15;run=false}}draw();if(run)raf=requestAnimationFrame(loop)}
  function draw(){if(!c)return;const W=c._w,H=c._h;const sc=H/14,X=x=>W/2+x*sc,Y=y=>H-20-y*sc;ctx.clearRect(0,0,W,H);ctx.fillStyle='#5aa560';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(X(-3.66),Y(11)-8,7.32*sc,8);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,Y(11));ctx.lineTo(W,Y(11));ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X(0),Y(0),4,0,7);ctx.fill();
    const tt=Math.min(t,tb()),f=tt/tb(),bx=-P.sx*f,by=11*f;const tm=Math.max(0,t-P.tr),kx=-Math.min(P.sx+.3,vk*tm);
    ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(-P.sx),Y(11));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#E8833A';ctx.beginPath();ctx.arc(X(kx),Y(10.6),10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('TW',X(kx),Y(10.6)+4);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X(bx),Y(by),6,0,7);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,26);ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.fillText('t = '+fmt(Math.min(t,tb()),2)+' s',8,18);
    ctx.textAlign='right';ctx.fillText(t<P.tr?'Torwart reagiert noch …':'Torwart: '+fmt(vk,1)+' m/s',W-8,18);
    if(t>=tb()){const ok=Math.abs(kx)>=P.sx-.25;ctx.fillStyle=ok?'rgba(46,125,79,.95)':'rgba(179,64,47,.95)';ctx.fillRect(W/2-120,H/2-20,240,40);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 17px Arial';ctx.fillText(ok?'Gehalten!':'Tor! Zu langsam.',W/2,H/2+6)}}
  return {mount,stop};})();

  if(k===6){/* Tacho und Uhrzeit (wie Peter, Blatt 7a) */
    const h0=7,m0=pick([12,21,25,32]),dt=pick([12,15,18,20]),v=pick([12,15,16,18,20]),ds=v*dt/60,km0=pick([352.4,1284.6,817.2,2093.8]);
    const t2=h0*60+m0+dt,hh=Math.floor(t2/60),mm=t2%60,z=n=>String(n).padStart(2,'0');
    return {fig:sceneFig('tacho',{t1:h0+':'+z(m0),t2:hh+':'+z(mm),k1:fmt(km0,1),k2:fmt(km0+ds,1)}),title:'Tacho und Uhrzeit',q:`<p>Peter fährt jeden Morgen mit dem Fahrrad zur Schule. Er startet um <b>${h0}:${z(m0)} Uhr</b> und kommt um <b>${hh}:${z(mm)} Uhr</b> an. Sein Fahrradcomputer zeigt beim Start den Kilometerstand <b>${fmt(km0,1)} km</b> und bei der Ankunft <b>${fmt(km0+ds,1)} km</b>. Unterwegs zeigt das Display an einer abschüssigen Stelle kurz 32 km/h an.</p><p>a) Mit welcher Durchschnittsgeschwindigkeit fährt Peter (in km/h)?<br>b) Gib diese Geschwindigkeit in m/s an.</p>`,
      inputs:[{label:'a) v in km/h',unit:'km/h',ans:v,tol:rel(v,.02),id:'k'},{label:'b) v in m/s',unit:'m/s',ans:v/3.6,tol:rel(v/3.6,.02),id:'m'}],
      wrong(x){if(x.k!=null&&Math.abs(x.k-32)<.5)return '32 km/h ist nur eine Momentangeschwindigkeit an einer Stelle. Gefragt ist der Durchschnitt über die ganze Fahrt.';if(x.k!=null&&Math.abs(x.k-ds/dt)<.05)return 'Du hast km durch Minuten geteilt. Rechne die Zeit erst in Stunden um.';return ''},
      hint:'Δs = Kilometerstand am Ende − Kilometerstand am Anfang. Δt = Ankunft − Start, in Stunden umrechnen (: 60). Dann v = Δs : Δt.',
      expl:`<ol><li>Δs = ${fmt(km0+ds,1)} km − ${fmt(km0,1)} km = <b>${fmt(ds,1)} km</b></li><li>Δt = ${dt} min = ${fmt(dt/60,3)} h</li><li class="res">a) v = ${fmt(ds,1)} km : ${fmt(dt/60,3)} h = ${fmt(v,1)} km/h</li><li class="res">b) ${fmt(v,1)} km/h : 3,6 = ${fmt(v/3.6,2)} m/s</li></ol><p>Die 32 km/h sind eine <b>Momentangeschwindigkeit</b> und für den Durchschnitt egal.</p>`};}
  if(k===7){/* Teilstrecken (Knobelaufgabe Peter) */
    let v1,t1,s2,t2,s1;do{v1=pick([24,30,36]);t1=pick([5,10,15]);s1=v1*t1/60;s2=pick([1.5,2,3,4]);t2=pick([5,6,10,12])}while(s1+s2>12||(s2/t2*60)>=v1);
    const S=s1+s2,T=t1+t2,va=S/T*60,v2=s2/t2*60;
    return {fig:sceneFig('hill',{t1,v1,t2,S:fmt(S,1)}),title:'Bergab, dann Gegenwind',q:`<p>Peter fährt mit dem Fahrrad von Schönberg zum <b>${fmt(S,1)} km</b> entfernten Neumarkt. In den ersten <b>${t1} Minuten</b> fährt er mit der Durchschnittsgeschwindigkeit <b>${v1} km/h</b>, denn es geht bergab. Für die restliche Strecke braucht er bei Gegenwind noch <b>${t2} Minuten</b>.</p><p>a) Wie groß ist Peters Durchschnittsgeschwindigkeit für die ganze Strecke?<br>b) Mit welcher Durchschnittsgeschwindigkeit fährt er die letzten ${t2} Minuten?</p>`,
      inputs:[{label:'a) ganze Strecke',unit:'km/h',ans:va,tol:rel(va,.02),id:'a'},{label:'b) letzter Teil',unit:'km/h',ans:v2,tol:rel(v2,.02),id:'b'}],
      wrong(x){if(x.a!=null&&Math.abs(x.a-(v1+v2)/2)<.3&&Math.abs(va-(v1+v2)/2)>.5)return 'Geschwindigkeiten darf man nicht einfach mitteln, die Zeiten sind verschieden lang. Rechne Gesamtstrecke : Gesamtzeit.';return ''},
      hint:'a) Gesamtstrecke : Gesamtzeit (in Stunden). b) Erst ausrechnen, wie weit Peter in den ersten '+t1+' Minuten kommt. Der Rest ist die Strecke des zweiten Teils.',
      expl:`<ol><li class="res">a) v = ${fmt(S,1)} km : ${T} min = ${fmt(S,1)} km : ${fmt(T/60,3)} h = ${fmt(va,1)} km/h</li><li>Teil 1: s<sub>1</sub> = ${v1} km/h · ${fmt(t1/60,3)} h = ${fmt(s1,1)} km</li><li>Rest: ${fmt(S,1)} − ${fmt(s1,1)} = ${fmt(s2,1)} km</li><li class="res">b) v<sub>2</sub> = ${fmt(s2,1)} km : ${fmt(t2/60,3)} h = ${fmt(v2,1)} km/h</li></ol>`};}
  if(k===8){/* Fahrplan */
    const legs=pick([[['München','Stuttgart',200,'9:00','11:00'],['Stuttgart','Frankfurt',250,'11:15','12:30'],['Frankfurt','Dortmund',75,'13:00','16:00']],[['Basel','Karlsruhe',190,'8:00','9:40'],['Karlsruhe','Mannheim',70,'9:50','10:20'],['Mannheim','Köln',80,'10:30','13:00']]]);
    const tm=x=>{const [h,m]=x.split(':').map(Number);return h+m/60};const L3=legs[2];const s3=L3[2]*(tm(L3[4])-tm(L3[3]));const S=legs[0][2]+legs[1][2]+s3,T=tm(L3[4])-tm(legs[0][3]),va=S/T;
    const fast=legs.map((l,i)=>i<2?l[2]/(tm(l[4])-tm(l[3])):l[2]);const fi=fast.indexOf(Math.max(...fast));
    return {title:'Mit dem Zug nach '+L3[1],q:`<p>Ein Zug fährt nach diesem Fahrplan:</p>${mtable([['Abfahrt',legs[0][0]+' '+legs[0][3],legs[1][0]+' '+legs[1][3],legs[2][0]+' '+legs[2][3]],['Ankunft',legs[0][1]+' '+legs[0][4],legs[1][1]+' '+legs[1][4],legs[2][1]+' '+legs[2][4]],['Strecke',legs[0][2]+' km',legs[1][2]+' km','mit konstant '+L3[2]+' km/h']])}<p>a) Wie lang ist der letzte Abschnitt?<br>b) Wie groß ist die Durchschnittsgeschwindigkeit für die ganze Fahrt, <b>mit</b> den Aufenthalten?</p>`,
      inputs:[{label:'a) letzter Abschnitt',unit:'km',ans:s3,tol:rel(s3,.01),id:'s'},{label:'b) Durchschnitt gesamt',unit:'km/h',ans:va,tol:rel(va,.02),id:'v'}],
      wrong(x){if(x.v!=null){const tf=legs.reduce((a,l)=>a+tm(l[4])-tm(l[3]),0);if(Math.abs(x.v-S/tf)<1)return 'Die Aufenthalte in den Bahnhöfen gehören zur Gesamtzeit. Rechne von der ersten Abfahrt bis zur letzten Ankunft.'}return ''},
      hint:'a) Im letzten Abschnitt ist nur die Geschwindigkeit gegeben: s = v · t. b) Gesamtstrecke : Zeit von der ersten Abfahrt bis zur letzten Ankunft.',
      expl:`<ol><li class="res">a) s<sub>3</sub> = ${L3[2]} km/h · ${fmt(tm(L3[4])-tm(L3[3]),2)} h = ${fmt(s3,0)} km</li><li>Gesamtstrecke: ${legs[0][2]} + ${legs[1][2]} + ${fmt(s3,0)} = ${fmt(S,0)} km</li><li>Gesamtzeit: ${legs[0][3]} bis ${L3[4]} Uhr = ${fmt(T,2)} h</li><li class="res">b) v = ${fmt(S,0)} km : ${fmt(T,2)} h ≈ ${fmt(va,1)} km/h</li></ol><p>Am schnellsten ist der Zug übrigens zwischen ${legs[fi][0]} und ${legs[fi][1]} (${fmt(fast[fi],0)} km/h).</p>`};}
  if(k===1){/* Schnecke Max – zeichnerisch */
    const C=pick([[3,2,10],[3,2,5],[6,4,5],[6,4,10],[6,5,5]]);const [vM,vL,t0]=C;const dv=vM-vL,s0=vL*t0,te=s0/dv,T=t0+te,S=vM*te;
    const sal=S+pick([-10,10,20]),ok=sal>=S;const xmax=Math.ceil(T*1.4/5)*5,ymax0=Math.max(sal,S)*1.3;const ystep=ymax0>120?20:10,ymax=Math.ceil(ymax0/ystep)*ystep;
    return {fig:sceneFig('snail2',{vL,vM:fmt(vM/6,1),t0,sal}),title:'Max will zum Salat',q:`<p>Max, die Schnecke aus Bad Einstein, und seine Freundin <b>Lotte</b> aus Bimmelstadt wohnen unter demselben Stein im Pfarrgarten. Max ist drei Jahre alt und wiegt stolze 12 g. Heute Morgen ist Lotte schon <b>${t0} Minuten</b> vor Max in Richtung Salatkopf losgekrochen, und zwar gleichmäßig mit <b>${vL} cm pro Minute</b>. Der Salatkopf ist <b>${sal} cm</b> vom Stein entfernt.</p><p>Max hat verschlafen. Er kriecht hinterher, ebenfalls gleichmäßig, mit <b>${fmt(vM/6,1)} mm/s</b>.</p><p>a) Rechne Max' Geschwindigkeit in cm pro Minute um.<br>b) Zeichne beide Bewegungen ins s(t)-Diagramm. Die Zeit zählt ab Lottes Start.<br>c) Lies ab: Wann und wo holt Max Lotte ein? Schafft er es vor dem Salat?</p>`,
      draw:{xmax,ymax,xstep:5,ystep,xlabel:'t in min (ab Lottes Start)',ylabel:'s in cm',marks:[{s:sal,label:'Salat'}],lines:[{name:'Lotte',color:SC.org,a:[0,0],b:[T,S],tip:'Lotte startet bei t = 0 am Stein und schafft '+vL+' cm pro Minute.'},{name:'Max',color:SC.blue,a:[t0,0],b:[T,S],tip:'Max startet erst nach '+t0+' min am Stein. Wie viele cm schafft er in 10 min?'}]},
      inputs:[{label:'a) v von Max',unit:'cm/min',ans:vM,tol:.05,id:'v'},{label:'c) Einholen bei t =',unit:'min',ans:T,tol:1.3,id:'t'},{label:'c) Entfernung vom Stein',unit:'cm',ans:S,tol:ystep*.3,id:'s'}],
      hint:'1 mm/s = 0,1 cm/s = 6 cm pro Minute. Lottes Gerade startet bei (0 | 0), Max\' Gerade erst bei ('+t0+' | 0). Max holt Lotte dort ein, wo sich die Geraden schneiden.',
      expl:`<ol><li>Unnötige Angaben: Alter und Gewicht von Max.</li><li class="res">a) ${fmt(vM/6,1)} mm/s = ${fmt(vM/60,2)} cm/s = ${vM} cm/min</li><li>b) Lotte: Gerade durch (0 | 0) und (10 min | ${vL*10} cm). Max: Gerade durch (${t0} min | 0) und (${t0+10} min | ${vM*10} cm). Max' Gerade ist steiler.</li><li class="res">c) Schnittpunkt bei t = ${fmt(T,0)} min und s = ${fmt(S,0)} cm (das ist ${fmt(te,0)} min nach Max' Start).</li><li>Der Salat liegt bei ${sal} cm: ${ok?'Der Schnittpunkt liegt unter der Salat-Linie, Max schafft es vorher.':'Die Geraden schneiden sich erst oberhalb der Salat-Linie, Lotte ist vorher am Salat.'}</li></ol>`};}
  if(k===2){/* Begegnung – zeichnerisch */
    let v1,v2,late,T,S,d,g=0;do{v1=pick([12,15,18,20,24]);v2=pick([10,12,15,18]);late=Math.random()<.45?pick([10,15]):0;T=pick([20,25,30,35,40,45]);S=v1*T/60;d=S+v2*(T-late)/60}while((g++<400)&&(Math.abs(S*2-Math.round(S*2))>1e-9||Math.abs(d*2-Math.round(d*2))>1e-9||d<5||d>18||T<=late+5));
    const c1=pick([['Weinheim','Heidelberg'],['Mannheim','Ladenburg'],['Bensheim','Heppenheim']]);const xmax=Math.ceil(T*1.35/10)*10,ystep=d>10?2:1,ymax=Math.ceil(d/ystep)*ystep;
    return {fig:sceneFig('meet',{a:c1[0],b:c1[1],v1,v2,d:fmt(d,1),late}),title:'Begegnung auf dem Radweg',q:`<p>Der Radweg zwischen <b>${c1[0]}</b> und <b>${c1[1]}</b> ist <b>${fmt(d,1)} km</b> lang. Um 14:00 Uhr fährt Lena in ${c1[0]} los, gleichmäßig mit <b>${v1} km/h</b>. Ihr Rad hat 21 Gänge, sie fährt im 7. Gang. ${late?`Tom startet erst <b>${late} Minuten später</b> in ${c1[1]}`:`Zur gleichen Zeit startet Tom in ${c1[1]}`} und fährt ihr mit <b>${v2} km/h</b> entgegen.</p><p>a) Zeichne beide Fahrten ins s(t)-Diagramm. s ist die Entfernung von ${c1[0]}.<br>b) Lies ab: Wann (Minuten nach 14:00 Uhr) und wo treffen sich die beiden?</p>`,
      draw:{xmax,ymax,xstep:5,ystep,sy:.5,xlabel:'t in min (ab 14:00 Uhr)',ylabel:'s in km (ab '+c1[0]+')',lines:[{name:'Lena',color:SC.blue,a:[0,0],b:[T,S],tip:'Lena startet bei t = 0 in '+c1[0]+' (s = 0). In 30 min schafft sie die Hälfte von '+v1+' km.'},{name:'Tom',color:SC.red,a:[late,d],b:[T,S],tip:'Tom startet '+(late?'nach '+late+' min ':'bei t = 0 ')+'in '+c1[1]+', also bei s = '+fmt(d,1)+' km, und fährt Richtung s = 0. Seine Gerade fällt.'}]},
      inputs:[{label:'b) Treffen nach',unit:'min',ans:T,tol:2.6,id:'t'},{label:'b) Entfernung von '+c1[0],unit:'km',ans:S,tol:.6,id:'s'}],
      hint:'Lenas Gerade startet bei (0 | 0) und steigt. Toms Gerade startet bei ('+late+' | '+fmt(d,1)+' km) und fällt, weil er auf '+c1[0]+' zufährt. Für zwei Punkte: Wie weit kommt jeder in 30 Minuten?',
      expl:`<ol><li>Unnötige Angabe: Gänge des Fahrrads.</li><li>Lena: Gerade durch (0 | 0) und (30 min | ${fmt(v1/2,1)} km).</li><li>Tom: Gerade durch (${late} min | ${fmt(d,1)} km) und (${late+30} min | ${fmt(d-v2/2,1)} km). Sie fällt, weil Tom auf ${c1[0]} zufährt.</li><li class="res">Schnittpunkt: nach ${T} min (also um 14:${String(T).padStart(2,'0')} Uhr), ${fmt(S,1)} km von ${c1[0]} entfernt.</li></ol>`};}
  if(k===3){/* Torwart */
    const kb=pick([90,108,126]),vb=kb/3.6,tr=pick([.2,.25,.3]),sx=pick([2,2.4,2.8]),tb=11/vb,rest=tb-tr,vt=sx/rest;
    return {fig:sceneFig('goal',{kb,tr:fmt(tr,2),sx:fmt(sx,1),sxp:sx*40}),gk:{vb,tr,sx},title:'Elfmeter: Hat der Torwart eine Chance?',q:`<p>Kreisliga, Elfmeter für den 1. FC Bad Einstein. Der Ball liegt <b>11 m</b> vor dem Tor. Hubertus Blattschuß schießt mit <b>${kb} km/h</b> flach in die linke Ecke. Das Tor ist 7,32 m breit und 2,44 m hoch. Torwart Otto Totalblind vom SV Bimmelstadt steht in der Mitte und muss <b>${fmt(sx,1)} m</b> weit zur Seite, um den Ball zu erreichen. Erst nach seiner Reaktionszeit von <b>${fmt(tr,2)} s</b> kann er sich bewegen.</p><p>a) Wie lange ist der Ball bis zum Tor unterwegs?<br>b) Wie schnell müsste der Torwart nach der Reaktionszeit zur Seite kommen, um den Ball noch zu erreichen?</p>`,
      inputs:[{label:'a) Flugzeit des Balls',unit:'s',ans:tb,tol:.02,id:'t'},{label:'b) nötige Geschwindigkeit',unit:'m/s',ans:vt,tol:rel(vt,.04),id:'v'}],
      wrong(v){if(v.v!=null&&Math.abs(v.v-sx/tb)<rel(sx/tb,.04))return 'Die Reaktionszeit fehlt: Der Torwart hat nur die Zeit nach seiner Reaktion zur Verfügung.';if(v.t!=null&&Math.abs(v.t-11/kb)<.01)return 'Rechne erst km/h in m/s um (: 3,6).';return ''},
      hint:'a) km/h in m/s umrechnen, dann t = s : v. b) Von der Flugzeit geht die Reaktionszeit ab. In der Restzeit muss der Torwart seine Strecke schaffen.',
      expl:`<ol><li>Unnötig: Torbreite und Torhöhe.</li><li>${kb} km/h : 3,6 = ${fmt(vb,1)} m/s</li><li class="res">a) t = 11 m : ${fmt(vb,1)} m/s = ${fmt(tb,2)} s</li><li>Restzeit nach der Reaktion: ${fmt(tb,2)} s − ${fmt(tr,2)} s = ${fmt(rest,2)} s</li><li class="res">b) v = ${fmt(sx,1)} m : ${fmt(rest,2)} s ≈ ${fmt(vt,1)} m/s (≈ ${fmt(vt*3.6,0)} km/h)</li></ol><p>Das schafft kein Mensch aus dem Stand. Deshalb springen Torhüter schon <b>vor</b> dem Schuss in eine Ecke, sie raten.</p>`};}
  if(k===4){/* Opa Krawuttke mit Reaktionszeit */
    let tb,vb,vo,tr,sb,so;do{vb=pick([10,12,15]);tb=pick([2,2.5,3]);tr=pick([.5,1]);vo=pick([4,5,6]);sb=vb*tb;so=vo*(tb-tr)}while(so<4);
    return {fig:sceneFig('pass',{sb:fmt(sb,0),vb,so:fmt(so,1),tr:fmt(tr,1)}),title:'Opa Krawuttke und der Steilpass',q:`<p>Kreisliga, 1. FC Bad Einstein gegen SV Bimmelstadt, 89. Minute, es steht 0:0. Hubertus Blattschuß spielt einen flachen Pass in den Strafraum. Der Ball rollt <b>${fmt(sb,0)} m</b> weit gleichmäßig mit <b>${vb} m/s</b> bis zum Elfmeterpunkt. Opa Krawuttke (72 Jahre, Vereinsmitglied seit 1971) steht <b>${fmt(so,1)} m</b> vom Elfmeterpunkt entfernt. Leider braucht er nach dem Pass erst <b>${fmt(tr,1)} s</b>, bis er losläuft.</p><p>a) Wie lange ist der Ball bis zum Elfmeterpunkt unterwegs?<br>b) Wie schnell muss Opa laufen, damit er genau gleichzeitig mit dem Ball am Elfmeterpunkt ist?</p>`,
      inputs:[{label:'a) Zeit des Balls',unit:'s',ans:tb,tol:.03,id:'t'},{label:'b) Opas Geschwindigkeit',unit:'m/s',ans:vo,tol:rel(vo,.03),id:'v'}],
      wrong(v){if(v.v!=null&&Math.abs(v.v-so/tb)<.1)return 'Opa kann erst nach '+fmt(tr,1)+' s loslaufen. Ihm bleibt weniger Zeit als dem Ball.';return ''},
      hint:'Schritt 1: Zeit des Balls mit t = s : v. Schritt 2: Opa hat diese Zeit minus seine Reaktionszeit. In dieser Restzeit muss er seine Strecke schaffen.',
      expl:`<ol><li>Unnötig: Spielminute, Alter, Vereinsjahre.</li><li class="res">a) t<sub>Ball</sub> = ${fmt(sb,0)} m : ${vb} m/s = ${fmt(tb,1)} s</li><li>Opa hat nur ${fmt(tb,1)} s − ${fmt(tr,1)} s = <b>${fmt(tb-tr,1)} s</b> zum Laufen.</li><li class="res">b) v = ${fmt(so,1)} m : ${fmt(tb-tr,1)} s = ${fmt(vo,1)} m/s (= ${fmt(vo*3.6,1)} km/h)</li></ol>`};}
  /* Gewitter – zeichnerisch */
  const tdon=pick([3,4.5,6]),sD=tdon/3*1000,vg=pick([36,54]),vr=18,vgm=vg/3.6,vrm=5,te=sD/(vgm-vrm),SE=vgm*te;
  const xmax=Math.ceil(te*1.4/100)*100,xstep=xmax>400?100:50,ymax0=Math.max(SE,sD)*1.3,ystep=ymax0>4000?1000:500,ymax=Math.ceil(ymax0/ystep)*ystep;
  return {fig:sceneFig('storm',{vg:fmt(vg,1),vr:fmt(vr,1),td:fmt(tdon,1)}),title:'Das Gewitter holt dich ein',q:`<p>Du bist mit dem Fahrrad unterwegs. Hinter dir siehst du einen Blitz, und <b>${fmt(tdon,1)} s</b> später hörst du den Donner. Faustregel: Der Schall legt in <b>3 s etwa 1 km</b> zurück, das Licht ist praktisch sofort da. Die Gewitterfront zieht mit <b>${vg} km/h</b> in deine Richtung. Du fährst mit <b>${vr} km/h</b> nach Hause. Dein Zuhause ist noch 3 km entfernt.</p><p>a) Wie weit ist das Gewitter von dir entfernt (in m)?<br>b) Rechne beide Geschwindigkeiten in m/s um und zeichne beide Bewegungen ins s(t)-Diagramm. s zählt ab dem jetzigen Ort des Gewitters.<br>c) Lies ab: Nach wie vielen Sekunden hat dich das Gewitter eingeholt?</p>`,
    draw:{xmax,ymax,xstep,ystep,xlabel:'t in s',ylabel:'s in m',lines:[{name:'Gewitter',color:'#58636f',a:[0,0],b:[te,SE],tip:'Das Gewitter startet bei s = 0 und zieht mit '+fmt(vgm,0)+' m/s. Wie weit kommt es in 100 s?'},{name:'du',color:SC.blue,a:[0,sD],b:[te,SE],tip:'Du startest '+fmt(sD,0)+' m vor dem Gewitter und fährst mit 5 m/s weiter weg.'}]},
    inputs:[{label:'a) Entfernung',unit:'m',ans:sD,tol:rel(sD,.03),id:'s'},{label:'c) Einholen nach',unit:'s',ans:te,tol:xstep*.3,id:'t'}],
    hint:'a) '+fmt(tdon,1)+' s : 3 = Entfernung in km. b) km/h : 3,6 = m/s. Das Gewitter startet bei (0 | 0), du bei (0 | Entfernung). Wo schneiden sich die Geraden?',
    expl:`<ol><li class="res">a) ${fmt(tdon,1)} s : 3 = ${fmt(tdon/3,1)} km = ${fmt(sD,0)} m (mit 340 m/s genauer: ${fmt(340*tdon,0)} m)</li><li>b) v<sub>Gewitter</sub> = ${vg} : 3,6 = ${fmt(vgm,0)} m/s, v<sub>Rad</sub> = ${vr} : 3,6 = 5 m/s</li><li>Gewitter: Gerade durch (0 | 0) und (100 s | ${fmt(vgm*100,0)} m). Du: Gerade durch (0 | ${fmt(sD,0)} m) und (100 s | ${fmt(sD+500,0)} m).</li><li class="res">c) Schnittpunkt bei t = ${fmt(te,0)} s (≈ ${fmt(te/60,1)} min)</li></ol><p>Für die 3 km nach Hause brauchst du 3000 m : 5 m/s = 600 s = 10 min. ${600<te?'Du schaffst es trocken nach Hause.':'Das wird nass!'}</p>`};
}});

TOPICS.push({id:'uetext',title:'Textaufgaben: Überholen',desc:'Überholen verstehen: Δv oder Summe? Reicht die Sicht?',gen(){
  const k=rnd(1,4);
  if(k===1){/* Mindestgeschwindigkeit */
    const kT=pick([18,36,54]),vT=kT/3.6,L=pick([6,8,10]),l=4,sA=pick([10,15]),S=2*sA+L+l,tg=pick([5,6,8]),dv=S/tg,v=vT+dv;
    return {fig:sceneFig('tractor',{l,L,sA,kT,tg}),title:'Wie schnell muss er mindestens sein?',q:`<p>Herr Kaya fährt mit seinem Kleinwagen (<b>${l} m</b> lang, 75 PS) auf der Landstraße hinter einem Traktor her. Der Traktor ist mit Anhänger <b>${L} m</b> lang und fährt <b>${kT} km/h</b>. Vor und nach dem Überholen will Herr Kaya je <b>${sA} m</b> Abstand halten. Wegen einer Kurve hat er für das Überholen höchstens <b>${tg} s</b> Zeit.</p><p>a) Um wie viel muss er schneller sein als der Traktor (in m/s)?<br>b) Wie schnell muss er also mindestens fahren (in km/h)?</p>`,
      inputs:[{label:'a) Δv',unit:'m/s',ans:dv,tol:rel(dv,.03),id:'d'},{label:'b) v<sub>PKW</sub>',unit:'km/h',ans:v*3.6,tol:rel(v*3.6,.02),id:'v'}],
      wrong(v){if(v.v!=null&&Math.abs(v.v-dv*3.6)<1)return 'Das ist nur der Unterschied. Herr Kaya muss so schnell sein wie der Traktor plus Δv.';if(v.d!=null&&Math.abs(v.d-(S-sA)/tg)<.2)return 'Der Sicherheitsabstand zählt zweimal: vorher und nachher.';return ''},
      hint:'Aufholstrecke s<sub>auf</sub> = s<sub>A</sub> + l<sub>Traktor</sub> + s<sub>A</sub> + l<sub>PKW</sub>. In der verfügbaren Zeit muss er diese Strecke aufholen: Δv = s<sub>auf</sub> : t. Dann v<sub>PKW</sub> = v<sub>Traktor</sub> + Δv.',
      expl:`<ol><li>Unnötig: 75 PS.</li><li>s<sub>auf</sub> = ${sA} + ${L} + ${sA} + ${l} = <b>${S} m</b></li><li class="res">a) Δv = ${S} m : ${tg} s = ${fmt(dv,2)} m/s</li><li>v<sub>Traktor</sub> = ${kT} : 3,6 = ${fmt(vT,1)} m/s</li><li class="res">b) v<sub>PKW</sub> = ${fmt(vT,1)} + ${fmt(dv,2)} = ${fmt(v,2)} m/s = ${fmt(v*3.6,1)} km/h</li></ol><p>Prüfe immer, ob das erlaubt ist (Landstraße: 100 km/h).</p>`};}
  if(k===2){/* Reicht die Sicht? */
    const pr=pick([[90,72,25,20],[108,90,30,25],[72,54,20,15]]);const [k1,k2,m1,m2]=pr;const L=18,l=5,sA=pick([10,15,18]),S=2*sA+L+l,t=S/(m1-m2),sp=m1*t,kg=pick([72,90,108]),sg=kg/3.6*t,fr=sp+sg,sicht=Math.round((fr+pick([-120,-60,80,150]))/10)*10,res=sicht-fr;
    return {fig:sceneFig('sight',{kg,sicht,k1,k2}),title:'Reicht die Sichtweite?',q:`<p>Ein PKW (<b>${l} m</b>, <b>${k1} km/h</b>) will einen LKW (<b>${L} m</b>, <b>${k2} km/h</b>) überholen. Abstand vorher und nachher je <b>${sA} m</b>. Die Straße ist bis zur nächsten Kuppe <b>${sicht} m</b> weit einsehbar. Hinter der Kuppe könnte jederzeit ein Auto mit <b>${kg} km/h</b> auftauchen. Die Fahrerin hört gerade Radio.</p><p>a) Wie lang muss die freie Strecke s<sub>frei</sub> mindestens sein?<br>b) Wie viele Meter Reserve bleiben? (Negativ eingeben, wenn die Sicht <b>nicht</b> reicht.)</p>`,
      inputs:[{label:'a) s<sub>frei</sub>',unit:'m',ans:fr,tol:rel(fr,.02),id:'f'},{label:'b) Reserve',unit:'m',ans:res,tol:Math.max(4,rel(fr,.02)),id:'r'}],
      wrong(v){if(v.f!=null&&Math.abs(v.f-sp)<rel(sp,.02))return 'Das ist nur der Weg des PKW. Das entgegenkommende Auto fährt in derselben Zeit auch auf euch zu. Beide Wege zusammen sind s<sub>frei</sub>.';return ''},
      hint:'Wie beim Arbeitsblatt: s<sub>auf</sub>, Δv, t<sub>ü</sub>, s<sub>PKW</sub> = v<sub>PKW</sub> · t<sub>ü</sub>. Der Gegenverkehr fährt in derselben Zeit s<sub>Gegen</sub> = v<sub>Gegen</sub> · t<sub>ü</sub>. s<sub>frei</sub> = s<sub>PKW</sub> + s<sub>Gegen</sub>.',
      expl:`<ol><li>s<sub>auf</sub> = ${sA} + ${L} + ${sA} + ${l} = ${S} m, Δv = ${m1} − ${m2} = ${m1-m2} m/s</li><li>t<sub>ü</sub> = ${S} : ${m1-m2} = ${fmt(t,2)} s</li><li>s<sub>PKW</sub> = ${m1} m/s · ${fmt(t,2)} s = ${fmt(sp,0)} m</li><li>s<sub>Gegen</sub> = ${fmt(kg/3.6,1)} m/s · ${fmt(t,2)} s = ${fmt(sg,0)} m</li><li class="res">a) s<sub>frei</sub> = ${fmt(sp,0)} + ${fmt(sg,0)} = ${fmt(fr,0)} m</li><li class="res">b) Reserve = ${sicht} − ${fmt(fr,0)} = ${fmt(res,0)} m → ${res>=0?'Die Sicht reicht.':'Die Sicht reicht <b>nicht</b>. Nicht überholen!'}</li></ol>`};}
  if(k===3){/* Zug und Radfahrerin */
    const Lz=pick([300,400,600]),kz=pick([72,90,108]),kr=pick([18,36]),vz=kz/3.6,vr=kr/3.6,t1=Lz/(vz-vr),t2=Lz/(vz+vr);

      inputs:[{label:'a) gleiche Richtung',unit:'s',ans:t1,tol:rel(t1,.03),id:'a'},{label:'b) Gegenrichtung',unit:'s',ans:t2,tol:rel(t2,.03),id:'b'}],
      wrong(v){if(v.a!=null&&Math.abs(v.a-Lz/vz)<rel(Lz/vz,.03))return 'Die Radfahrerin bewegt sich auch. Der Zug ist ihr gegenüber nur mit dem Unterschied der Geschwindigkeiten schneller.';if(v.a!=null&&v.b!=null&&Math.abs(v.a-t2)<rel(t2,.03))return 'Vertauscht? In gleicher Richtung zählt der Unterschied, in Gegenrichtung die Summe der Geschwindigkeiten.';return ''},

    inputs:[{label:'a) Überholdauer',unit:'s',ans:t,tol:rel(t,.03),id:'t'},{label:'b) Strecke',unit:'km',ans:s1/1000,tol:rel(s1/1000,.03),id:'s'}],
    wrong(v){if(v.t!=null&&Math.abs(v.t-S/(k1/3.6))<2)return 'Zum Überholen zählt nur der Geschwindigkeitsunterschied Δv = '+d+' km/h.';if(v.t!=null&&Math.abs(v.t-S/d)<2)return 'Δv muss in m/s sein: '+d+' km/h : 3,6.';return ''},
    hint:'s<sub>auf</sub> = Abstand + LKW-Länge + Abstand + LKW-Länge. Δv = '+d+' km/h, in m/s umrechnen. t = s<sub>auf</sub> : Δv. Dann Strecke des Überholenden: s = v · t.',
    expl:`<ol><li>s<sub>auf</sub> = ${a} + ${L} + ${a} + ${L} = ${S} m</li><li>Δv = ${d} km/h = ${fmt(dv,3)} m/s</li><li class="res">a) t = ${S} m : ${fmt(dv,3)} m/s ≈ ${fmt(t,0)} s ≈ ${fmt(t/60,1)} min</li><li class="res">b) s = ${fmt(k1/3.6,1)} m/s · ${fmt(t,0)} s ≈ ${fmt(s1,0)} m ≈ ${fmt(s1/1000,1)} km</li></ol><p>Wegen des winzigen Δv dauert das Überholen minutenlang. Deshalb gibt es auf vielen Strecken ein LKW-Überholverbot.</p>`};
}});

  if(k===3){/* M3 Kerze */

/* ---------- App ---------- */
let stats={},cur=null,task=null,state=null,mixMode=false;const LOG=[];
try{const x=localStorage.getItem('kin-ueb-v2');if(x)stats=JSON.parse(x)||{}}catch(e){}
var appLive=false;function appChanged(){if(window.AppBridge&&appLive)AppBridge.changed()}
function saveStats(){try{localStorage.setItem('kin-ueb-v2',JSON.stringify(stats))}catch(e){}appChanged()}
function totals(){let r=0,n=0;Object.values(stats).forEach(s=>{r+=s.r||0;n+=s.n||0});return [r,n]}
function updScore(){const [r,n]=totals();$('#score').textContent='Richtig im 1. Versuch: '+r+' von '+n}
function start(id,keepMix){
  leave();
  cur=TOPICS.find(t=>t.id===id);if(!keepMix)mixMode=false;
  task=cur.gen();state={tries:0,done:false,solved:false,sel:null,counted:false};render();window.scrollTo(0,0);
}
function render(){
  let h=`<div class="bar"><button class="back" id="back">← Themen</button><span class="tag">${cur.title}</span></div><div class="card"><h3>${task.title}</h3>${task.q}`;
  if(task.fig)h+=`<div class="fig">${task.fig}</div>`;

function parse(s){if(s==null)return null;const m=String(s).replace(',','.').replace(/\s/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}

function check(){
  if(state.done)return;

  if(task.choices){
    if(state.sel==null){fb.innerHTML='<div class="fb no">Wähle zuerst eine Antwort aus.</div>';return}
    state.lastAns=ansText();
    state.tries++;const c=task.choices[state.sel];ok=c.correct;
    const el=document.querySelectorAll('.choice')[state.sel];
    if(ok){el.classList.remove('sel');el.classList.add('ok')}else{el.classList.remove('sel');el.classList.add('no');state.sel=null}
  }else{
    const vals={};let all=true,any=false;
    task.inputs.forEach((inp,i)=>{const v=parse($('#in'+i).value);vals[inp.id||i]=v;if(v==null)all=false;else any=true});
    if(!all){fb.innerHTML='<div class="fb no">Fülle zuerst alle Felder aus.</div>';return}
    state.lastAns=ansText();
    state.tries++;
    task.inputs.forEach((inp,i)=>{const v=vals[inp.id||i];const good=Math.abs(v-inp.ans)<=inp.tol;const e=$('#in'+i);e.classList.remove('ok','no');e.classList.add(good?'ok':'no');$('#mk'+i).textContent=good?'✓':'✗';$('#mk'+i).style.color=good?'var(--ok)':'var(--bad)'});
    ok=task.inputs.every((inp,i)=>Math.abs(vals[inp.id||i]-inp.ans)<=inp.tol);
    state.extra=!ok&&task.wrong?task.wrong(vals):'';
  }
  if(ok){state.done=true;state.solved=true;count(true);logIt(state.tries===1?'Richtig im ersten Versuch':'Richtig im '+state.tries+'. Versuch','ok');fb.innerHTML=`<div class="fb ok">Richtig! ${state.tries===1?'Gleich im ersten Versuch.':'Beim '+state.tries+'. Versuch geschafft.'}</div>`;showExpl();lock();}
  else{count(false);fb.innerHTML=`<div class="fb no">Noch nicht ganz. ${state.extra?state.extra+' ':''}${state.tries>=2?'Du kannst dir die Lösung mit Erklärung anzeigen lassen.':'Schau noch einmal hin oder nutze den Tipp, dann versuche es erneut.'}</div>`}
}
function lock(){if(task.sim)Sim.unlock();if(task.opa)Opa.unlock();document.querySelectorAll('input[type=text]').forEach(i=>i.disabled=true);$('#check').disabled=true;$('#sol').disabled=true}
function showTip(){$('#tipbox').innerHTML=`<div class="tip"><h4>Tipp</h4>${task.hint}</div>`}
function showExpl(){$('#ex').innerHTML=`<div class="expl"><h4>Lösung und Erklärung</h4>${task.expl}</div>`}
function reveal(){

  if(task.choices){task.choices.forEach((c,i)=>{const el=document.querySelectorAll('.choice')[i];el.classList.remove('sel','no');if(c.correct)el.classList.add('ok')})}

const Sim=(function(){
  let P,c,ctx,raf=null,t=0,last=0,playing=false,slow=false,cam='lkw',unl=false,onc=false;
  function stop(){if(raf)cancelAnimationFrame(raf);raf=null;playing=false}
  function init(p){stop();P=p;t=0;slow=false;cam='lkw';unl=false;onc=false;c=document.getElementById('simc');ctx=c.getContext('2d');
    const btn=id=>document.getElementById(id);
    btn('sPlay').onclick=()=>{if(playing){playing=false;btn('sPlay').textContent='▶ Weiter';return}if(t>=tEnd())t=0;playing=true;btn('sPlay').textContent='❚❚ Pause';last=performance.now();loop()};
    btn('sReset').onclick=()=>{playing=false;t=0;btn('sPlay').textContent='▶ Abspielen';draw()};
    btn('sSlow').onclick=()=>{slow=!slow;btn('sSlow').classList.toggle('on',slow)};
    btn('sCam').onclick=()=>{cam=cam==='lkw'?'pkw':'lkw';btn('sCam').textContent=cam==='lkw'?'Kamera: fährt mit LKW':'Kamera: fährt mit PKW';draw()};
    btn('sOnc').onclick=()=>{onc=!onc;btn('sOnc').classList.toggle('on',onc);t=0;playing=false;btn('sPlay').textContent='▶ Abspielen';draw()};
    resize();window.onresize=resize;}
  function unlock(){unl=true;const b=document.getElementById('sOnc');if(b)b.disabled=false;const n=document.getElementById('sNote');if(n)n.textContent='Jetzt mit Zahlen. Tipp: „Kamera: fährt mit LKW“ zeigt, dass der PKW nur mit dem Geschwindigkeitsunterschied Δv vorankommt.';draw()}
  function tEnd(){return P.t+1.2}
  function resize(){if(!c)return;const w=Math.min(c.parentElement.clientWidth-4,820),h=Math.round(Math.max(200,w*0.29));const d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);c._w=w;c._h=h;draw()}
  function loop(){const now=performance.now();const dt=(now-last)/1000;last=now;if(playing){t+=dt*(slow?0.3:1);if(t>=tEnd()){t=tEnd();playing=false;document.getElementById('sPlay').textContent='▶ Nochmal'}}draw();if(playing)raf=requestAnimationFrame(loop)}
  function rr(x,y,w,h,r,f){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=f;ctx.fill()}
  function draw(){
    if(!c||!P)return;const W=c._w,H=c._h;ctx.clearRect(0,0,W,H);
    const {m1,m2,a,L,l,S,t:tE}=P;const te=Math.min(t,tE);
    /* Weltkoordinaten: LKW-Front bei xL, PKW-Front bei xP (t=0: xL=0) */
    const xL=m2*t, xP=-L-a+m1*t;
    const ph=Math.min(1,Math.max(0,t/tE));
    /* Spurwechsel: links während des Überholens */
    let lane;const k=Math.min(1,t/0.8);const kb=tE?Math.min(1,Math.max(0,(t-tE)/0.8)):0;lane=t<=tE?k:1-kb;
    const roadTop=34,laneH=Math.min(48,(H-120)/2),roadH=laneH*2,yR=roadTop+laneH*1.5,yLft=roadTop+laneH*0.5;
    const view=2*(L+a+l)+30;const camX=(cam==='lkw'?xL-L/2:xP-l/2)-view/2;
    const sc=W/view;const X=x=>(x-camX)*sc;
    /* Straße */
    ctx.fillStyle='#E6EDE3';ctx.fillRect(0,roadTop-10,W,roadH+20);ctx.fillStyle='#5A6470';ctx.fillRect(0,roadTop,W,roadH);
    ctx.fillStyle='#fff';ctx.fillRect(0,roadTop+1,W,2);ctx.fillRect(0,roadTop+roadH-3,W,2);
    const dash=6,gap=6;let x0=Math.floor(camX/(dash+gap))*(dash+gap);for(let x=x0;x<camX+view;x+=dash+gap)ctx.fillRect(X(x),roadTop+laneH-1.5,dash*sc,3);
    /* Fahrzeuge */
    const vh=laneH*0.62;
    rr(X(xL-L),yR-vh/2,L*sc,vh,4,'#E8833A');ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('LKW',X(xL-L/2),yR+5);
    const yP=yR+(yLft-yR)*lane;rr(X(xP-l),yP-vh*0.4,l*sc,vh*0.8,4,'#2F7FC1');ctx.fillStyle='#fff';ctx.font='bold 11px Arial';if(l*sc>26)ctx.fillText('PKW',X(xP-l/2),yP+4);
    if(onc&&unl){const xO=-L-a+P.frei-m1*t;rr(X(xO),yLft-vh*0.4,l*sc,vh*0.8,4,'#B3402F')}
    /* Infozeile */
    ctx.textAlign='left';ctx.fillStyle='#1F3A5F';ctx.font='bold 14px Arial';
    ctx.fillText(unl?`Zeit: ${fmt(Math.min(t,tE),1)} s`:'Zeit: ? s',8,20);
    ctx.textAlign='right';ctx.fillText(unl?`PKW: ${fmt(m1*Math.min(t,tE),0)} m   LKW: ${fmt(m2*Math.min(t,tE),0)} m`:'Wege: ? m',W-8,20);
    /* Abstand PKW–LKW anzeigen */
    const gapBack=xL-L-xP, gapFront=(xP-l)-xL; ctx.font='12px Arial';ctx.textAlign='center';ctx.fillStyle='#1F3A5F';
    const yI=roadTop+roadH+22;
    if(t<0.05){ctx.fillText(`Start: ${a} m Abstand hinter dem LKW`,W/2,yI)}
    else if(t>=tE-0.02){ctx.fillText(`Ende: ${a} m Abstand vor dem LKW  ✓`+(onc&&unl?'  –  der Gegenverkehr ist genau jetzt da: knapp!':''),W/2,yI)}
    else ctx.fillText(unl?`Der PKW holt ${m1-m2} m pro Sekunde auf – noch ${fmt(Math.max(0,S-(m1-m2)*t),0)} m bis zum Ende`:'Der PKW holt auf … wie viele Meter pro Sekunde?',W/2,yI);
    /* Übersichtsleiste */
    const my=H-34,mx0=10,mw=W-20;const wStart=-L-a-l-5,wEnd=Math.max(P.sp+10,onc&&unl?P.frei-L-a+10:0)+5;const MX=x=>mx0+(x-wStart)/(wEnd-wStart)*mw;
    ctx.fillStyle='#D3DCE6';ctx.fillRect(mx0,my-3,mw,6);ctx.fillStyle='#4a5a69';ctx.font='11px Arial';ctx.textAlign='left';ctx.fillText('Übersicht der ganzen Strecke',mx0,my+20);
    ctx.fillStyle='#E8833A';ctx.fillRect(MX(xL-L),my-6,Math.max(3,MX(xL)-MX(xL-L)),12);
    ctx.fillStyle='#2F7FC1';ctx.beginPath();ctx.arc(MX(xP),my,5,0,7);ctx.fill();
    if(onc&&unl){const xO=-L-a+P.frei-m1*t;ctx.fillStyle='#B3402F';ctx.beginPath();ctx.arc(MX(xO),my,5,0,7);ctx.fill()}
    if(unl){ctx.textAlign='right';ctx.fillStyle='#4a5a69';ctx.fillText(`${fmt(wEnd-wStart,0)} m`,mx0+mw,my+20)}
  }
  return {init,unlock,stop};
})();

/* ===== Zeichnen-Aufgaben: Bewegungen als Geraden ins s(t)-Diagramm ===== */
const DRAW=(function(){
  const W=520,H=330,L=58,R=18,Tp=24,B=44,pw=W-L-R,ph=H-Tp-B;
  let o=null,cur=0,pts=[],shown=false,svg=null;
  const X=t=>L+t/o.xmax*pw,Y=s=>Tp+ph-s/o.ymax*ph;
  const snap=(v,st)=>Math.round(v/st)*st;
  function grid(){
    let s=`<rect x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="#fff"/>`;
    const fx=o.xstep/2,fy=o.ystep/2;
    for(let t=0;t<=o.xmax+1e-9;t+=fx){const major=Math.abs(t/o.xstep-Math.round(t/o.xstep))<1e-6;s+=`<line x1="${X(t)}" y1="${Tp}" x2="${X(t)}" y2="${Tp+ph}" stroke="${major?'#B9C6D6':'#E3E9F0'}"/>`;if(major)s+=`<text x="${X(t)}" y="${Tp+ph+17}" font-size="12" text-anchor="middle" fill="${SC.nav}">${fmt(t,2)}</text>`}
    for(let v=0;v<=o.ymax+1e-9;v+=fy){const major=Math.abs(v/o.ystep-Math.round(v/o.ystep))<1e-6;s+=`<line x1="${L}" y1="${Y(v)}" x2="${L+pw}" y2="${Y(v)}" stroke="${major?'#B9C6D6':'#E3E9F0'}"/>`;if(major)s+=`<text x="${L-6}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="${SC.nav}">${fmt(v,2)}</text>`}
    s+=`<line x1="${L}" y1="${Tp}" x2="${L}" y2="${Tp+ph}" stroke="${SC.nav}" stroke-width="1.8"/><line x1="${L}" y1="${Tp+ph}" x2="${L+pw}" y2="${Tp+ph}" stroke="${SC.nav}" stroke-width="1.8"/>`;
    s+=`<text x="${L+pw}" y="${H-4}" font-size="13" font-weight="700" text-anchor="end" fill="${SC.nav}">${o.xlabel}</text><text x="${L}" y="15" font-size="13" font-weight="700" fill="${SC.nav}">${o.ylabel}</text>`;
    (o.marks||[]).forEach(m=>{s+=`<line x1="${L}" y1="${Y(m.s)}" x2="${L+pw}" y2="${Y(m.s)}" stroke="${m.color||'#3C7A4E'}" stroke-width="2" stroke-dasharray="7 5"/><text x="${L+pw-4}" y="${Y(m.s)-6}" font-size="12" font-weight="700" text-anchor="end" fill="${m.color||'#3C7A4E'}">${m.label}</text>`});
    return s}
  function clip(p,q){/* Gerade durch p,q, auf das Diagramm begrenzt, ab dem früheren Punkt */
    const m=(q[1]-p[1])/(q[0]-p[0]);const t0=Math.min(p[0],q[0]);let t1=o.xmax;const s0=p[1]+m*(t0-p[0]);let s1=p[1]+m*(t1-p[0]);
    if(s1>o.ymax){t1=p[0]+(o.ymax-p[1])/m;s1=o.ymax}if(s1<0){t1=p[0]+(0-p[1])/m;s1=0}
    return [[t0,s0],[t1,s1]]}
  function draw(){
    let s=grid();
    o.lines.forEach((ln,i)=>{const P=pts[i];
      if(shown){const [a,b]=clip(ln.a,ln.b);s+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${ln.color}" stroke-width="3" stroke-dasharray="${P.length===2?'8 6':'none'}" opacity="${P.length===2?.55:1}"/>`}
      if(P.length===2&&P[0][0]!==P[1][0]){const [a,b]=clip(P[0],P[1]);s+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${ln.color}" stroke-width="3.4" stroke-linecap="round"/>`;
        s+=`<text x="${Math.min(X(b[0]),L+pw-4)}" y="${Y(b[1])-8}" font-size="13" font-weight="700" text-anchor="end" fill="${ln.color}">${ln.name}</text>`}
      P.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5.5" fill="${ln.color}" stroke="#fff" stroke-width="1.5"/>`})});
    svg.innerHTML=s;
    const bt=document.querySelectorAll('#drw .dsel');bt.forEach((b,i)=>{b.classList.toggle('on',i===cur);b.querySelector('i').textContent=pts[i].length===2?'✓':pts[i].length+'/2'});
  }
  function tap(ev){
    if(shown&&o.locked)return;
    const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    let t=(p.x-L)/pw*o.xmax,s=(Tp+ph-p.y)/ph*o.ymax;if(t<-o.xmax*.04||t>o.xmax*1.04||s<-o.ymax*.05||s>o.ymax*1.05)return;
    t=Math.min(o.xmax,Math.max(0,snap(t,o.sx)));s=Math.min(o.ymax,Math.max(0,snap(s,o.sy)));
    const P=pts[cur];if(P.length>=2)P.length=0;P.push([t,s]);
    if(P.length===2&&P[0][0]===P[1][0]){P.pop()}
    if(P.length===2&&cur<o.lines.length-1&&pts[cur+1].length<2)cur++;
    draw();
  }
  function mount(host,opt){
    o=opt;o.sx=o.sx||o.xstep/2;o.sy=o.sy||o.ystep/2;cur=0;shown=false;pts=o.lines.map(()=>[]);
    host.innerHTML=`<div id="drw" class="drw"><p class="dhow"><b>So zeichnest du:</b> Wähle unten eine Person. Tippe dann zwei Punkte ihrer Bewegung ins Diagramm (z. B. den Startpunkt und einen Punkt ein paar Minuten später). Die Gerade erscheint automatisch. Nochmal tippen = neu zeichnen.</p>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto;touch-action:manipulation;cursor:crosshair" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif"></svg>
      <div class="dbtns">${o.lines.map((l,i)=>`<button class="dsel" data-i="${i}" style="--c:${l.color}">${l.name} <i></i></button>`).join('')}<button class="dclr">Alles löschen</button></div></div>`;
    svg=host.querySelector('svg');svg.addEventListener('pointerdown',tap);
    host.querySelectorAll('.dsel').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
    host.querySelector('.dclr').onclick=()=>{pts=o.lines.map(()=>[]);cur=0;draw()};
    draw();
  }
  function verify(){
    if(!o)return null;
    for(let i=0;i<o.lines.length;i++){if(pts[i].length<2)return {missing:true,name:o.lines[i].name}}
    for(let i=0;i<o.lines.length;i++){const ln=o.lines[i],m=(ln.b[1]-ln.a[1])/(ln.b[0]-ln.a[0]);
      const okP=p=>Math.abs(p[1]-(ln.a[1]+m*(p[0]-ln.a[0])))<=o.sy*.51&&p[0]>=ln.a[0]-1e-9;
      if(!(okP(pts[i][0])&&okP(pts[i][1])))return {wrong:true,name:ln.name,i}}
    return null}
  function show(lock){shown=true;if(lock)o.locked=true;if(svg)draw()}
  function desc(){return o.lines.map((l,i)=>pts[i].length===2?`${l.name}: (${fmt(pts[i][0][0],1)} | ${fmt(pts[i][0][1],1)}) und (${fmt(pts[i][1][0],1)} | ${fmt(pts[i][1][1],1)})`:'').filter(Boolean).join('; ')}
  return {mount,verify,show,desc,stop(){o=null;svg=null}};
})();

/* ---------- Simulation 1:0 für Bad Einstein ---------- */
const Opa=(function(){
  let P,c,pc,raf=null,t=0,last=0,run=false,slow=false,unl=false,vO=1.5,useRight=false,done=false,res='';
  const E={x:0,y:11},dB={x:0.8,y:0.6},dO={x:-0.6,y:0.8},GOAL={x:0,y:-0.6};
  let B0,O0,X0,X1,Y0,Y1;
  function stop(){if(raf)cancelAnimationFrame(raf);raf=null;run=false}
  function init(p){stop();P=p;t=0;unl=false;useRight=false;done=false;res='';
    B0={x:E.x+P.sb*dB.x,y:E.y+P.sb*dB.y};O0={x:E.x+P.so*dO.x,y:E.y+P.so*dO.y};
    X0=Math.min(-22,O0.x-6);X1=Math.max(22,B0.x+6);Y0=-3;Y1=Math.max(B0.y,O0.y,20)+4;
    c=document.getElementById('pitch');pc=c.getContext('2d');
    const b=id=>document.getElementById(id);
    b('oPlay').onclick=()=>{if(run){run=false;b('oPlay').textContent='Weiter ▶';return}if(done||t===0){t=0;done=false;res='';pickSpeed()}run=true;b('oPlay').textContent='Pause ❚❚';last=performance.now();loop()};
    b('oReset').onclick=()=>{run=false;t=0;done=false;res='';b('oPlay').textContent='Anstoß ▶';draw()};
    b('oSlow').onclick=()=>{slow=!slow;b('oSlow').classList.toggle('on',slow)};
    b('oRight').onclick=()=>{useRight=true;run=false;t=0;done=false;res='';vO=P.vo;b('oPlay').click()};
    size();window.addEventListener('resize',size);}
  function pickSpeed(){
    if(useRight){vO=P.vo;return}
    const inp=document.getElementById('in0');const v=inp?parse(inp.value):null;
    vO=(v!=null&&v>0)?v:1.5;
    const n=document.getElementById('oNote');
    if(n&&!unl)n.textContent=(v!=null&&v>0)?`Opa läuft jetzt mit deinem Wert: ${fmt(vO,2)} m/s.`:'Opa trödelt mit 1,5 m/s. Trag unten dein Ergebnis ein, dann läuft Opa beim nächsten Anstoß mit deinem Tempo.';
  }
  function unlock(){unl=true;const b=document.getElementById('oRight');if(b)b.disabled=false;const n=document.getElementById('oNote');if(n)n.textContent='Jetzt mit Uhr. „Mit richtiger Lösung“ zeigt, wie Opa genau rechtzeitig ankommt.';draw()}
  function size(){if(!c||!document.body.contains(c))return;const w=Math.min(c.parentElement.clientWidth-4,820);const h=Math.round(w*(Y1-Y0)/(X1-X0));const d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;c.style.height=h+'px';pc.setTransform(d,0,0,d,0,0);c._w=w;c._h=h;draw()}
  const tB=()=>P.sb/P.vb,tO=()=>P.so/vO;
  function endT(){const ok=tO()<=tB()+0.03;return ok?tB()+0.7:Math.max(tB()+1.1,Math.min(tO(),tB()+1.6))}
  function loop(){const now=performance.now();const dt=Math.min((now-last)/1000,.05);last=now;if(run){t+=dt*(slow?.25:1);const te=endT();if(t>=te){t=te;run=false;done=true;finish();document.getElementById('oPlay').textContent='Nochmal ▶'}}draw();if(run)raf=requestAnimationFrame(loop)}
  function finish(){const d=tO()-tB();if(d>0.03)res='late:'+d;else if(d<-0.25)res='early:'+(-d);else res='ok'}
  function draw(){
    if(!c||!P)return;const W=c._w,H=c._h,sc=W/(X1-X0);const px=x=>(x-X0)*sc,py=y=>(y-Y0)*sc;
    const line=(a,b,cx,d)=>{pc.beginPath();pc.moveTo(px(a),py(b));pc.lineTo(px(cx),py(d));pc.stroke()};
    const tag=(txt,p,dx,dy,bg)=>{pc.font='600 13px Arial';const w=pc.measureText(txt).width+12;const x=px(p.x)+dx,y=py(p.y)+dy;pc.fillStyle=bg;pc.beginPath();pc.roundRect?pc.roundRect(x-w/2,y-10,w,20,5):pc.rect(x-w/2,y-10,w,20);pc.fill();pc.fillStyle='#fff';pc.textAlign='center';pc.textBaseline='middle';pc.fillText(txt,x,y+1)};
    const dot=(p,r,f,st,lab)=>{pc.beginPath();pc.arc(px(p.x),py(p.y),r,0,7);pc.fillStyle=f;pc.fill();if(st){pc.lineWidth=2;pc.strokeStyle=st;pc.stroke()}if(lab){pc.fillStyle='#fff';pc.font='bold 12px Arial';pc.textAlign='center';pc.textBaseline='middle';pc.fillText(lab,px(p.x),py(p.y)+1)}};
    for(let i=0;i*4<Y1-Y0;i++){pc.fillStyle=i%2?'#2F7A3E':'#358746';pc.fillRect(0,py(Y0+i*4),W,sc*4+1)}
    pc.strokeStyle='rgba(255,255,255,.85)';pc.lineWidth=2;line(X0,0,X1,0);
    pc.strokeRect(px(-20.16),py(0),sc*40.32,sc*16.5);pc.strokeRect(px(-9.16),py(0),sc*18.32,sc*5.5);
    pc.beginPath();pc.arc(px(E.x),py(E.y),9.15*sc,Math.asin(5.5/9.15),Math.PI-Math.asin(5.5/9.15));pc.stroke();
    pc.fillStyle='rgba(255,255,255,.25)';pc.fillRect(px(-3.66),py(-2),sc*7.32,sc*2);pc.lineWidth=3;pc.strokeStyle='#fff';line(-3.66,0,-3.66,-2);line(3.66,0,3.66,-2);line(-3.66,-2,3.66,-2);
    pc.beginPath();pc.arc(px(E.x),py(E.y),4,0,7);pc.fillStyle='#fff';pc.fill();
    pc.setLineDash([7,6]);pc.lineWidth=2;pc.strokeStyle='rgba(255,255,255,.9)';line(B0.x,B0.y,E.x,E.y);pc.strokeStyle='rgba(20,36,58,.85)';line(O0.x,O0.y,E.x,E.y);pc.setLineDash([]);
    tag(fmt(P.sb,0)+' m',{x:(B0.x+E.x)/2,y:(B0.y+E.y)/2},18,-14,'rgba(179,64,47,.92)');
    tag(fmt(P.so,1)+' m',{x:(O0.x+E.x)/2,y:(O0.y+E.y)/2},22,10,'rgba(31,58,95,.92)');
    pc.fillStyle='#fff';pc.font='600 12px Arial';pc.textAlign='left';pc.textBaseline='middle';pc.fillText('Elfmeterpunkt',px(E.x)+12,py(E.y));
    /* Positionen */
    const TB=tB(),TO=tO(),ok=TO<=TB+0.03;
    const so=Math.min(vO*t,P.so);const opa={x:O0.x-dO.x*so,y:O0.y-dO.y*so};
    let ball;if(t<=TB){const s=P.vb*t;ball={x:B0.x-dB.x*s,y:B0.y-dB.y*s}}
    else if(ok){const f=Math.min((t-TB)*25/Math.hypot(E.x-GOAL.x,E.y-GOAL.y),1);ball={x:E.x+(GOAL.x-E.x)*f,y:E.y+(GOAL.y-E.y)*f}}
    else{const s=P.vb*t;ball={x:B0.x-dB.x*s,y:Math.max(B0.y-dB.y*s,-1.5)}}
    dot({x:0.6,y:0.8},9,'#E67E22','#7A3E0A','T');
    dot(B0,10,'#3C7A4E','#fff','B');tag('Blattschuß',B0,0,-20,'rgba(60,122,78,.95)');
    dot(opa,11,'#1F3A5F','#fff','K');tag('Opa Krawuttke',opa,-62,0,'rgba(31,58,95,.95)');
    dot(ball,5.5,'#fff','#111');
    /* Anzeige */
    pc.fillStyle='rgba(0,0,0,.45)';pc.fillRect(0,0,W,26);pc.fillStyle='#fff';pc.font='bold 14px Arial';pc.textBaseline='middle';
    pc.textAlign='left';pc.fillText(unl?`t = ${fmt(t,2)} s`:'t = ? s',8,13);
    pc.textAlign='right';pc.fillText(`Opa läuft ${fmt(vO,2)} m/s`,W-8,13);
    if(done&&res){let txt,bg;if(res==='ok'){txt='TOR! Opa Krawuttke trifft zum 1:0';bg='rgba(46,125,79,.95)'}else if(res.startsWith('late')){txt=unl?`Zu spät! Opa fehlen ${fmt(+res.split(':')[1],2)} s`:'Zu spät! Opa muss schneller laufen.';bg='rgba(179,64,47,.95)'}else{txt='Tor! Aber Opa war viel zu früh da – er hätte langsamer laufen können.';bg='rgba(224,168,0,.95)'}
      pc.font='bold 15px Arial';const w=Math.min(W-20,pc.measureText(txt).width+24);pc.fillStyle=bg;pc.fillRect((W-w)/2,H-46,w,36);pc.fillStyle='#fff';pc.textAlign='center';pc.fillText(txt,W/2,H-28)}
  }
  return {init,unlock,stop};
})();
