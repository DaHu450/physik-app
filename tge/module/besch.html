<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Lernpfad Beschleunigte Bewegung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: schmaler, zentrierter Lernpfad (Knoten in Schlangenlinie), Kapitel 2 teilt sich in zwei Stationen; Level öffnen sich als Vollbild-Lektion. Farbcode: Blau = Weg s, Rot = Geschwindigkeit v, Violett = Beschleunigung a / Glocken / XP. */
:root{
  --bg:#eef4fa; --surface:#ffffff; --ink:#14223a; --muted:#56677f; --line:#d3deea;
  --neg:#1d6ae5; --negdeep:#1450b3; --pos:#e2434b; --gold:#7b61c9; --golddeep:#5a43a6;
  --ok:#23904a; --okbg:#e0f5e4; --bad:#d3343b; --badbg:#fde7e8;
  --ui:#2f6fb0; --uideep:#1f4f85; --warm:#1f8a8a; --warmdeep:#156767; --sun:#8fd0f2; --sundeep:#4a9fd0; --simbg:#eaf3fb;
  --metal:#c9d3e0; --insul:#dbe5ef; --cloth:#cdbdea; --balloon:#ffc9d1; --locked:#dfe7f0; --lockeddeep:#b9c6d6;
  --fd:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --fb:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1724; --surface:#15233a; --ink:#e7eef8; --muted:#9fb0c8; --line:#26364f;
  --neg:#4f97ff; --negdeep:#2c6fd6; --pos:#ff6369; --gold:#a590f2; --golddeep:#8670dc;
  --ok:#4fcf73; --okbg:#173a25; --bad:#ff6b70; --badbg:#3d1d22;
  --ui:#3f86cf; --uideep:#2a649f; --warm:#26a3a3; --warmdeep:#1b7b7b; --sun:#5fb3e6; --sundeep:#3a8cbf; --simbg:#12203a;
  --metal:#33445e; --insul:#2b3a52; --cloth:#4e4174; --balloon:#6d3442; --locked:#24344c; --lockeddeep:#1a273a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1724; --surface:#15233a; --ink:#e7eef8; --muted:#9fb0c8; --line:#26364f;
  --neg:#4f97ff; --negdeep:#2c6fd6; --pos:#ff6369; --gold:#a590f2; --golddeep:#8670dc;
  --ok:#4fcf73; --okbg:#173a25; --bad:#ff6b70; --badbg:#3d1d22;
  --ui:#3f86cf; --uideep:#2a649f; --warm:#26a3a3; --warmdeep:#1b7b7b; --sun:#5fb3e6; --sundeep:#3a8cbf; --simbg:#12203a;
  --metal:#33445e; --insul:#2b3a52; --cloth:#4e4174; --balloon:#6d3442; --locked:#24344c; --lockeddeep:#1a273a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sun)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:1.45rem;font-weight:800;color:var(--uideep)}
:root[data-theme="dark"] .brand h1{color:var(--ui)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand h1{color:var(--ui)}}
.brand span{font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.xp{color:var(--golddeep)}
:root[data-theme="dark"] .pill.xp{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.xp{color:var(--gold)}}

/* Pfad */
.unit{margin-top:28px}
.banner{border-radius:18px;padding:14px 18px;color:#fff;background:var(--ui);box-shadow:0 4px 0 var(--uideep)}
.banner h2{font-size:1.3rem;font-weight:800}
.banner p{margin:4px 0 0;font-size:.92rem;opacity:.95;max-width:60ch}
.banner.b2{background:var(--warm);box-shadow:0 4px 0 var(--warmdeep)}
.banner.b3{background:var(--sun);color:#0f2f4a;box-shadow:0 4px 0 var(--sundeep)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 6px}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.node{width:74px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ui);color:#fff;box-shadow:0 6px 0 var(--uideep);transition:transform .08s}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--uideep)}
.node.done{background:var(--sun);box-shadow:0 6px 0 var(--golddeep);color:#0f2f4a}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--lockeddeep);color:var(--muted);cursor:not-allowed}
.node.open{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:6px solid color-mix(in srgb,var(--ui) 25%,transparent)}}
.stop-l{font-weight:600;font-size:.88rem;text-align:center;line-height:1.25}
.stop-l small{display:block;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px 18px;min-width:0}
.branch h3{font-size:1.08rem;text-align:center;font-weight:700}
.branch .seats{display:block;text-align:center;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.branch .nodes{padding-top:14px}
.branch .stop{width:100%}
.fork{display:flex;justify-content:center;margin-top:10px;color:var(--muted)}
.fork svg{width:200px;max-width:100%;height:40px}
@media (max-width:520px){.node{width:60px;height:57px}.node svg{width:26px;height:26px}.stop-l{font-size:.8rem}.branch h3{font-size:.95rem}}

/* Schloss */
.castle{margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:grid;gap:14px;justify-items:center;text-align:center}
.castle svg.cs{width:120px;height:110px}
.castle.locked svg.cs{opacity:.45}
.castle h2{font-size:1.5rem;font-weight:800}
.castle p{margin:0;color:var(--muted);max-width:52ch}
.meter{width:100%;max-width:380px;height:14px;border-radius:999px;background:var(--bg);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.meter b{position:absolute;top:-4px;bottom:-4px;left:90%;width:2px;background:var(--ink)}
.namefield{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.namefield input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:280px}
.summary{text-align:left;width:100%;background:var(--bg);border-radius:14px;padding:14px 16px;max-height:75vh;overflow:auto}
.summary h3{font-size:1.05rem;margin-top:10px}
.summary h3:first-child{margin-top:0}
.summary p{color:var(--ink);margin:4px 0 0;max-width:none}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}

.footer{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

/* Buttons */
.big{border:0;border-radius:14px;padding:12px 26px;font-weight:700;font-family:var(--fd);font-size:1.15rem;letter-spacing:.02em;background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 65%,#000);min-width:150px}
.big:disabled{background:var(--locked);box-shadow:0 4px 0 var(--lockeddeep);color:var(--muted);cursor:not-allowed}
.big.blue{background:var(--ui);box-shadow:0 4px 0 var(--uideep)}
.big.red{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 65%,#000)}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600}

/* Lektion */
.lesson{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));max-width:820px;width:100%;margin:0 auto}
.l-close{border:0;background:none;font-size:1.8rem;line-height:1;color:var(--muted);padding:2px 8px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .3s}
.l-body{flex:1;overflow-y:auto;overflow-x:hidden}
.l-inner{max-width:780px;margin:0 auto;padding-block:8px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.q{font-family:var(--fd);font-size:1.45rem;font-weight:700;line-height:1.2;text-wrap:balance}
.txt p{margin:0 0 8px;max-width:65ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--ui);background:color-mix(in srgb,var(--ui) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.l-foot{border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.l-foot.ok{background:var(--okbg);border-color:transparent}
.l-foot.bad{background:var(--badbg);border-color:transparent}
.foot-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.l-msg{flex:1;min-width:220px}
.l-msg strong{font-family:var(--fd);font-size:1.25rem;display:block}
.l-foot.ok .l-msg strong{color:var(--ok)}
.l-foot.bad .l-msg strong{color:var(--bad)}
.l-msg span{font-size:.92rem}

/* Lückentext, Zuordnen, Versuch */
.gap{font-size:1.05rem;line-height:2.3;background:var(--bg);border-radius:14px;padding:12px 16px}
.gap select{font:inherit;font-size:.95rem;padding:2px 6px;border-radius:8px;border:2px solid var(--ui);background:var(--surface);color:var(--ink);max-width:100%}
.gap select.right{border-color:var(--ok);background:var(--okbg)}
.gap select.wrong{border-color:var(--bad);background:var(--badbg)}
.gap .fix{color:var(--ok);font-weight:600;font-size:.9rem;margin-left:4px}
.sort{display:grid;gap:8px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.srow.right{border-color:var(--ok)}
.srow.wrong{border-color:var(--bad)}
.srow span{font-weight:600}
.srow .seg button{padding:6px 12px}
.srow > span:first-child{flex:1;min-width:180px}
.fix{color:var(--ok);font-weight:600;font-size:.9rem}
.textin{display:grid;gap:6px}
.textin input{font:inherit;font-size:1.15rem;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.textin input.right{border-color:var(--ok);background:var(--okbg)}
.textin input.wrong{border-color:var(--bad);background:var(--badbg)}
.scale{display:grid;gap:10px;background:var(--bg);border-radius:16px;padding:18px 16px}
.scale output{font-family:var(--fd);font-size:2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;min-height:1.3em}
.scale output.pos{color:var(--pos)}
.scale output.neg{color:var(--ui)}
.scale input{width:100%;accent-color:var(--ui);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.order{display:grid;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.orow.right{border-color:var(--ok)}
.orow.wrong{border-color:var(--bad)}
.onum{font-family:var(--fd);font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ui);color:#fff;flex:none}
.otxt{flex:1;min-width:0}
.obtn{border:0;background:var(--surface);border-radius:8px;width:38px;height:38px;font-size:1.1rem;font-weight:700;flex:none}
.obtn:disabled{opacity:.3;cursor:default}
.solution{background:var(--okbg);border-radius:12px;padding:10px 14px;font-size:.92rem}
.solution ol{margin:4px 0 0;padding-left:20px}
.opt.multi{display:flex;gap:10px;align-items:flex-start}
.opt.multi::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);margin-top:2px;background:var(--surface)}
.opt.multi[aria-pressed="true"]::before{background:var(--ui);border-color:var(--ui);box-shadow:inset 0 0 0 3px var(--surface)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--bg);border-radius:14px;padding:10px;align-items:center}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600;cursor:grab}
.chip.picked{border-color:var(--ui);background:color-mix(in srgb,var(--ui) 14%,var(--surface))}
.slots{display:grid;gap:8px}
.slotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.slotrow.right{border-color:var(--ok)}
.slotrow.wrong{border-color:var(--bad)}
.sprompt{flex:1;min-width:180px}
.slot{min-width:150px;padding:8px 12px;border-radius:10px;border:2px dashed var(--ui);background:var(--surface);font-weight:600;color:var(--muted)}
.slot.filled{border-style:solid;color:var(--ink)}
.sim-ctrl:empty{display:none}
.claim{font-family:var(--fd);font-size:1.3rem;font-weight:600;background:var(--bg);border-left:6px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;line-height:1.3}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.tf{text-align:center;font-weight:700;font-size:1.1rem;padding:16px}
.opt.bubble{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ui);color:#fff;font-weight:700;font-family:var(--fd)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt.pick{padding:6px;display:grid;gap:4px}
.opt.pick .sim{padding:0;background:none}
.plab{font-family:var(--fd);font-weight:800;font-size:1.1rem;padding-left:6px}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.rule>div{background:var(--bg);border-radius:14px;padding:14px 16px;line-height:1.5}
.rule b{font-family:var(--fd);font-size:1.1rem}
.exp{background:var(--bg);border-radius:16px;padding:16px;display:grid;gap:10px}
.exp h3{font-size:1.05rem}
.exp ul,.exp ol{margin:0;padding-left:22px}
.exp li{margin:3px 0}
.note{border-left:4px solid var(--gold);padding:6px 10px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:0 10px 10px 0;font-size:.92rem}
.check{display:flex;gap:10px;align-items:center;font-weight:600;padding:10px 12px;border:2px dashed var(--line);border-radius:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}

/* Simulation */
.sim{display:grid;gap:8px;background:var(--simbg);border-radius:16px;padding:10px}
.sim-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim-canvas{width:100%;display:block;border-radius:12px;background:var(--surface)}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg-l{font-size:.78rem;color:var(--muted);padding:0 6px;font-weight:600}
.seg button{border:0;background:none;border-radius:9px;padding:6px 10px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ui);color:#fff}
.sbtn{border:0;border-radius:10px;padding:8px 12px;font-size:.86rem;font-weight:600;background:var(--surface);color:var(--ink)}
.sbtn[aria-pressed="true"]{background:var(--gold);color:#0f2f4a}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer}
.tgl input{accent-color:var(--ui)}
.hint{font-size:.82rem;color:var(--muted)}

.result{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:30px}
.result h2{font-size:2rem;font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px 18px;min-width:120px}
.stat b{display:block;font-family:var(--fd);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.gold b{color:var(--golddeep)}
.stat.green b{color:var(--ok)}
.exp a{color:var(--ui);font-weight:600}
.numrow{display:flex;gap:10px;align-items:center}
.numrow input{flex:1}
.unitlbl{font-family:var(--fd);font-weight:700;font-size:1.2rem;min-width:3ch}
.sfigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:8px 0}
.sfigs figure{margin:0;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)}
.sfigs img{width:100%;display:block;border-radius:8px}
.sfigs figcaption{font-size:.78rem;color:#33402f;margin-top:4px;line-height:1.35}
.fbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--surface);border:2px solid var(--sun);border-radius:12px;padding:8px 16px;margin:6px 0;width:fit-content;max-width:100%}
.fml img{max-width:100%}
.summary .msatz{background:var(--surface);border-left:5px solid var(--ui);border-radius:0 10px 10px 0;padding:8px 12px}
.opt.poll[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
@media (prefers-reduced-motion: reduce){.node.open{animation:none}.bar span{transition:none}}

/* Messwerte-Tabelle */
.dtab{width:100%;border-collapse:collapse;font-size:.92rem}
.dtab th,.dtab td{border:1px solid var(--line);padding:4px;text-align:center}
.dtab th{background:var(--bg);font-weight:600}
.dtab input{width:100%;min-width:3.2em;font:inherit;padding:8px 4px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.dtab input.bad{border-color:var(--bad)}
.dtab td.mean{font-weight:700;color:var(--ink)}
.dwrap{overflow-x:auto}
.dmsg{margin-top:8px;font-size:.95rem}
.dmsg.bad{color:var(--bad)}
table.mini{border-collapse:collapse;margin:8px 0}
table.mini th,table.mini td{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.mini th{background:var(--bg)}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span>Physik · TGE · Kinematik</span><h1>Beschleunigungspfad</h1></div>

<script src="../lib/jspdf.umd.min.js"></script>
<script src="../bridge.js"></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Farben für Canvas ---------- */
const P={};
function readPal(){const cs=getComputedStyle(document.documentElement);['bg','surface','ink','muted','line','neg','pos','gold','golddeep','ok','bad','metal','insul','cloth','balloon'].forEach(k=>P[k]=cs.getPropertyValue('--'+k).trim()||'#888');}
readPal();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readPal,30));}catch(e){}
new MutationObserver(()=>setTimeout(readPal,30)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const W=640;
/* ---------- Bühne ---------- */
function makeStage(host,o){o=o||{};const h=o.h||340;
  const wrap=document.createElement('div');wrap.className='sim';
  const ctrl=document.createElement('div');ctrl.className='sim-ctrl';
  const c=document.createElement('canvas');c.className='sim-canvas';c.style.aspectRatio=W+' / '+h;if(o.interactive)c.style.touchAction='none';
  const hint=document.createElement('div');hint.className='hint';if(o.hint)hint.textContent=o.hint;
  wrap.append(ctrl,c);if(o.hint)wrap.append(hint);host.append(wrap);
  const ctx=c.getContext('2d');
  function fit(){const w=c.clientWidth||600;const dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(w*h/W*dpr);ctx.setTransform(c.width/W,0,0,c.height/h,0,0);}
  fit();let ro=null;try{ro=new ResizeObserver(fit);ro.observe(c);}catch(e){}
  function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*h/r.height};}
  let raf=0,alive=true;
  function loop(fn){const f=()=>{if(!alive)return;try{fn();}catch(err){console.error(err);}raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
  return{wrap,ctrl,c,ctx,h,pt,loop,alive:()=>alive,destroy(){alive=false;cancelAnimationFrame(raf);if(ro)ro.disconnect();wrap.remove();}};
}
function seg(ctrl,label,options,value,onChange){const g=document.createElement('div');g.className='seg';g.setAttribute('role','group');g.setAttribute('aria-label',label);
  const l=document.createElement('span');l.className='seg-l';l.textContent=label;g.append(l);
  options.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',String(v===value));b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');onChange(v);};g.append(b);});
  ctrl.append(g);return g;}
function tgl(ctrl,label,val,onChange){const l=document.createElement('label');l.className='tgl';const i=document.createElement('input');i.type='checkbox';i.checked=val;i.onchange=()=>onChange(i.checked);l.append(i,document.createTextNode(label));ctrl.append(l);return i;}
function sbtn(ctrl,label,fn){const b=document.createElement('button');b.type='button';b.className='sbtn';b.textContent=label;b.onclick=fn;ctrl.append(b);return b;}
/* ---------- Farbcode: Blau = Weg s, Rot = Geschwindigkeit v, Violett = Beschleunigung a / Glocken / XP ---------- */
function clock(){let last=performance.now();return()=>{const n=performance.now(),d=Math.min(.1,(n-last)/1000);last=n;return d;};}
const S_POS=[0.2,0.4,0.6,0.8];
const DEF={t:[1.02,1.43,1.74,2.01],v:[0.39,0.57,0.70,0.80]};
function myData(){const d=(typeof prog!=='undefined')&&prog.data;return d&&d.ok?d:null;}
function useData(){return myData()||{t:DEF.t,v:DEF.v,ex:true};}
function fitA(d){d=d||useData();let a=0,b=0;d.t.forEach((t,i)=>{a+=t*d.v[i];b+=t*t;});return b?a/b:0.4;}
const dec=(v,n)=>(Math.round(v*Math.pow(10,n))/Math.pow(10,n)).toFixed(n).replace('.',',');

/* Achsenkreuz mit Pfeilen, Gitter und Beschriftung; liefert Umrechnungen */
function plotAxes(c,o){const {x0,y0,w,h,xmax,ymax}=o;const X=t=>x0+t/xmax*w,Y=v=>y0-v/ymax*h;
  c.strokeStyle=P.line;c.lineWidth=1;
  if(o.grid!==false){const gx=o.dx||xmax/5,gy=o.dy||ymax/5;for(let t=gx;t<=xmax+1e-9;t+=gx){c.beginPath();c.moveTo(X(t),y0);c.lineTo(X(t),y0-h);c.stroke();}
    for(let v=gy;v<=ymax+1e-9;v+=gy){c.beginPath();c.moveTo(x0,Y(v));c.lineTo(x0+w,Y(v));c.stroke();}}
  arrow(c,x0,y0,x0+w+14,y0,P.ink,2);arrow(c,x0,y0,x0,y0-h-14,P.ink,2);
  const fs=o.fs||12;
  if(o.ticks!==false){const gx=o.dx||xmax/5,gy=o.dy||ymax/5;
    for(let t=0;t<=xmax+1e-9;t+=gx)txt(c,dec(t,o.xd==null?1:o.xd),X(t),y0+12,{size:fs});
    for(let v=gy;v<=ymax+1e-9;v+=gy)txt(c,dec(v,o.yd==null?1:o.yd),x0-6,Y(v),{size:fs,align:'right'});}
  txt(c,o.xl||'t in s',x0+w+8,y0+(o.ticks===false?14:28),{size:fs+1,align:'right',col:P.ink,weight:600});
  txt(c,o.yl,x0+6,y0-h-14,{size:fs+1,align:'left',col:o.ycol||P.ink,weight:700});
  return{X,Y};}
function cross(c,x,y,col,s){s=s||6;c.strokeStyle=col;c.lineWidth=2.6;c.lineCap='round';c.beginPath();c.moveTo(x-s,y-s);c.lineTo(x+s,y+s);c.moveTo(x-s,y+s);c.lineTo(x+s,y-s);c.stroke();}
function txt(c,t,x,y,o){o=o||{};c.fillStyle=o.col||P.muted;c.font=`${o.weight||500} ${o.size||13}px Lexend, system-ui, sans-serif`;c.textAlign=o.align||'center';c.textBaseline='middle';c.fillText(t,x,y);}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function arrow(c,x1,y1,x2,y2,col,lw){lw=lw||3;const a=Math.atan2(y2-y1,x2-x1);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*6,y2-Math.sin(a)*6);c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-Math.cos(a-.45)*10,y2-Math.sin(a-.45)*10);c.lineTo(x2-Math.cos(a+.45)*10,y2-Math.sin(a+.45)*10);c.closePath();c.fill();}

/* ---------- Kleines Geräusch für die Glocken (WebAudio) ---------- */
let AC=null;
function ding(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f||1320;
  g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.35,AC.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.35);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);}catch(e){}}

/* ---------- Wagen auf der schiefen Ebene zeichnen ---------- */
function drawRamp(c,o){const {x0,y0,x1,y1}=o;const ang=Math.atan2(y1-y0,x1-x0);
  c.fillStyle=P.metal;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.lineTo(x1,y1+12);c.lineTo(x0,y0+12);c.closePath();c.fill();
  c.fillStyle=P.ink;c.fillRect(x0-14,y0-4,8,(o.floor||y1+40)-y0+4);
  c.strokeStyle=P.muted;c.lineWidth=2;c.beginPath();c.moveTo(x0-40,o.floor||y1+40);c.lineTo(x1+20,o.floor||y1+40);c.stroke();
  return ang;}
function rampPt(o,s){const f=s/o.len;return{x:o.x0+(o.x1-o.x0)*f,y:o.y0+(o.y1-o.y0)*f};}
function drawCart(c,x,y,ang,col){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col||P.pos;rr(c,-34,-20,34,14,4);c.fill();
  c.fillStyle=P.ink;c.beginPath();c.arc(-27,-5,5,0,7);c.arc(-7,-5,5,0,7);c.fill();c.fillStyle=P.golddeep;c.fillRect(-4,-34,3,16);c.restore();}

/* ---------- Simulation: Galileis Glockenrinne ---------- */
function rampSim(host,o){o=o||{};const H=320,A=0.4,LEN=100;const st=makeStage(host,{h:H,interactive:!o.lock,hint:o.still?'':(o.lock?'Drück „Start“ und hör genau hin.':'Zieh die violetten Glocken an die richtige Stelle. Dann „Start“ und hinhören.')});
  const R={x0:70,y0:70,x1:590,y1:205,len:LEN,floor:250};
  let bells=(o.bells||[20,40,60,80]).slice();let t=o.still?(o.t0||0):-1,run=false,rung=[];const dt=clock();let drag=-1;
  const tOf=s=>Math.sqrt(2*s/100/A);
  if(!o.still){sbtn(st.ctrl,'▶ Start',()=>{t=0;run=true;rung=bells.map(()=>false);ding(880);});
    if(!o.lock){sbtn(st.ctrl,'Gleiche Abstände',()=>{bells=[20,40,60,80];t=-1;run=false;});}}
  if(!o.lock&&!o.still){
    const near=p=>{let best=-1,bd=40;bells.forEach((b,i)=>{const q=rampPt(R,b);const d=Math.hypot(p.x-q.x,p.y-q.y+30);if(d<bd){bd=d;best=i;}});return best;};
    const toS=p=>{const dx=R.x1-R.x0,dy=R.y1-R.y0;const f=((p.x-R.x0)*dx+(p.y-R.y0)*dy)/(dx*dx+dy*dy);return clamp(Math.round(f*LEN),2,LEN);};
    st.c.addEventListener('pointerdown',e=>{drag=near(st.pt(e));if(drag>=0){st.c.setPointerCapture(e.pointerId);run=false;t=-1;}});
    st.c.addEventListener('pointermove',e=>{if(drag<0)return;bells[drag]=toS(st.pt(e));});
    st.c.addEventListener('pointerup',()=>{if(drag>=0){bells.sort((a,b)=>a-b);}drag=-1;});}
  st.loop(()=>{const c=st.ctx;c.clearRect(0,0,W,H);const d=dt();
    if(run){t+=d;bells.forEach((b,i)=>{if(!rung[i]&&t>=tOf(b)){rung[i]=true;ding(1320);}});if(tOf(LEN)<t){run=false;}}
    const ang=drawRamp(c,R);
    for(let s=0;s<=LEN;s+=10){const q=rampPt(R,s);c.strokeStyle=P.muted;c.lineWidth=1;c.beginPath();c.moveTo(q.x,q.y+12);c.lineTo(q.x,q.y+18);c.stroke();if(s%20===0)txt(c,s+' cm',q.x+8,q.y+28,{size:11});}
    const tc=t<0?0:Math.min(t,tOf(LEN));const s=Math.min(LEN,50*A*tc*tc);
    bells.forEach((b,i)=>{const q=rampPt(R,b);const hit=t>=tOf(b)&&t<tOf(b)+.25;c.strokeStyle=P.muted;c.lineWidth=1.5;c.beginPath();c.moveTo(q.x,q.y-58);c.lineTo(q.x,q.y-40);c.stroke();
      c.fillStyle=hit?P.gold:P.golddeep;c.beginPath();c.moveTo(q.x-9,q.y-26);c.quadraticCurveTo(q.x-9,q.y-42,q.x,q.y-42);c.quadraticCurveTo(q.x+9,q.y-42,q.x+9,q.y-26);c.closePath();c.fill();circ(c,q.x,q.y-24,3,P.golddeep);
      if(hit){c.strokeStyle=P.gold;c.lineWidth=2;c.beginPath();c.arc(q.x,q.y-34,18,-2.6,-.5);c.stroke();}
      if(!o.still||o.labels)txt(c,b+' cm',q.x,q.y-68,{size:12,col:P.golddeep,weight:700});});
    const q=rampPt(R,s);drawCart(c,q.x,q.y,ang);
    /* Zeitstrahl: wann klingt was? */
    const TX=70,TW=520,TY=292,TM=2.4;c.strokeStyle=P.ink;c.lineWidth=2;c.beginPath();c.moveTo(TX,TY);c.lineTo(TX+TW,TY);c.stroke();
    for(let k=0;k<=TM+1e-9;k+=.5){const x=TX+k/TM*TW;c.beginPath();c.moveTo(x,TY-3);c.lineTo(x,TY+3);c.stroke();txt(c,dec(k,1)+' s',x,TY+14,{size:10});}
    txt(c,'Start',TX,TY-14,{size:10,col:P.pos,weight:700});circ(c,TX,TY,5,P.pos);
    if(t>=0||o.still){bells.forEach(b=>{const tb=tOf(b);if(o.still||t>=tb){const x=TX+tb/TM*TW;circ(c,x,TY,6,P.gold);}});}
    if(t>=0&&!o.still){const x=TX+Math.min(t,TM)/TM*TW;c.strokeStyle=P.pos;c.lineWidth=2;c.beginPath();c.moveTo(x,TY-10);c.lineTo(x,TY+10);c.stroke();}
    txt(c,'Wann klingt es?',TX+TW,TY-14,{size:11,align:'right'});
  });
  return{destroy:st.destroy,check(){const ts=[0].concat(bells.map(tOf));const iv=[];for(let k=1;k<ts.length;k++)iv.push(ts[k]-ts[k-1]);const m=iv.reduce((a,b)=>a+b,0)/iv.length;return iv.every(x=>Math.abs(x-m)<=.1*m);}};
}

/* ---------- Simulation: euer v-t-Diagramm ---------- */
function vtSim(host,o){o=o||{};const H=360;const d=useData();const aF=fitA(d);
  const st=makeStage(host,{h:H,interactive:!!o.challenge,hint:o.still?'':(o.challenge?'Tipp oder zieh im Diagramm: Die rote Gerade dreht sich um den Ursprung.':(d.ex?'Das sind Beispielwerte. Mit euren eigenen Messwerten erscheinen hier eure Punkte.':''))});
  const tmax=Math.max(2.5,Math.ceil(Math.max(...d.t)*1.15*2)/2),vmax=Math.max(1,Math.ceil(Math.max(...d.v)*1.25*5)/5);
  let k=o.challenge?aF*0.45:aF,showFit=!!(o.fit||o.still);let drag=false;
  const box={x0:70,y0:310,w:520,h:265};
  if(!o.still&&!o.challenge){tgl(st.ctrl,'Gerade',showFit,v=>showFit=v);}
  if(o.challenge){const set=e=>{const p=st.pt(e);const t=(p.x-box.x0)/box.w*tmax,v=(box.y0-p.y)/box.h*vmax;if(t>.15)k=clamp(v/t,0,vmax/0.3);};
    st.c.addEventListener('pointerdown',e=>{drag=true;st.c.setPointerCapture(e.pointerId);set(e);});st.c.addEventListener('pointermove',e=>{if(drag)set(e);});st.c.addEventListener('pointerup',()=>drag=false);showFit=true;}
  st.loop(()=>{const c=st.ctx;c.clearRect(0,0,W,H);
    const {X,Y}=plotAxes(c,Object.assign({},box,{xmax:tmax,ymax:vmax,dx:.5,dy:vmax>1.5?.5:.2,xd:1,yd:1,yl:'v in m/s',ycol:P.pos}));
    if(showFit){const te=Math.min(tmax,vmax/k);c.strokeStyle=P.pos;c.lineWidth=3;c.globalAlpha=.85;c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(te),Y(k*te));c.stroke();c.globalAlpha=1;
      const t1=.5,t2=1.5;if(t2*k<vmax){c.strokeStyle=P.golddeep;c.lineWidth=2.4;c.setLineDash([6,4]);c.beginPath();c.moveTo(X(t1),Y(k*t1));c.lineTo(X(t2),Y(k*t1));c.lineTo(X(t2),Y(k*t2));c.stroke();c.setLineDash([]);
        txt(c,'Δt = 1,0 s',(X(t1)+X(t2))/2,Y(k*t1)+14,{size:12,col:P.golddeep,weight:700});txt(c,'Δv = '+dec(k,2)+' m/s',X(t2)+8,(Y(k*t1)+Y(k*t2))/2,{size:12,col:P.golddeep,weight:700,align:'left'});}
      rr(c,box.x0+box.w-250,26,230,30,8);c.fillStyle=P.surface;c.fill();c.strokeStyle=P.gold;c.lineWidth=2;c.stroke();
      txt(c,'Steigung a = '+dec(k,2)+' m/s²',box.x0+box.w-135,41,{size:14,col:P.ink,weight:700});}
    cross(c,X(0),Y(0),P.pos,5);d.t.forEach((t,i)=>cross(c,X(t),Y(d.v[i]),P.pos,7));
  });
  return{destroy:st.destroy,check(){return Math.abs(k-aF)<=.12*aF;}};
}

/* ---------- Simulation: Fläche unter dem v-t-Graphen = Weg ---------- */
function areaSim(host,o){o=o||{};const H=340;const d=useData();const a=o.a||fitA(d);const cst=o.mode==='const';
  const st=makeStage(host,{h:H,interactive:!o.still,hint:o.still?'':'Zieh im linken Diagramm nach rechts und links oder drück „Abspielen“.'});
  const tmax=2.5,vmax=cst?1:Math.max(1,Math.ceil(a*tmax*5)/5),smax=cst?1.2:Math.max(1.2,Math.ceil(.5*a*tmax*tmax/.3)*.3);
  let T=o.still?2.0:(o.t0||1.0),run=false,showM=!!o.meas;const dt=clock();
  const L={x0:55,y0:290,w:225,h:225},Rb={x0:375,y0:290,w:225,h:225};
  if(!o.still){sbtn(st.ctrl,'▶ Abspielen',()=>{T=0;run=true;});if(!cst)tgl(st.ctrl,'Eure Messwerte',showM,v=>showM=v);
    let drag=false;const set=e=>{const p=st.pt(e);if(p.x<L.x0-20||p.x>L.x0+L.w+30)return;T=clamp((p.x-L.x0)/L.w*tmax,0,tmax);run=false;};
    st.c.addEventListener('pointerdown',e=>{drag=true;st.c.setPointerCapture(e.pointerId);set(e);});st.c.addEventListener('pointermove',e=>{if(drag)set(e);});st.c.addEventListener('pointerup',()=>drag=false);}
  const v=t=>cst?.4:a*t,s=t=>cst?.4*t:.5*a*t*t;
  st.loop(()=>{const c=st.ctx;c.clearRect(0,0,W,H);if(run){T+=dt()*.8;if(T>=tmax){T=tmax;run=false;}}else dt();
    const A1=plotAxes(c,Object.assign({},L,{xmax:tmax,ymax:vmax,dx:.5,dy:vmax/5,yl:'v in m/s',ycol:P.pos,fs:11}));
    c.fillStyle=P.neg;c.globalAlpha=.25;c.beginPath();c.moveTo(A1.X(0),A1.Y(0));if(cst){c.lineTo(A1.X(0),A1.Y(v(0)));}c.lineTo(A1.X(T),A1.Y(v(T)));c.lineTo(A1.X(T),A1.Y(0));c.closePath();c.fill();c.globalAlpha=1;
    c.strokeStyle=P.pos;c.lineWidth=3;c.beginPath();c.moveTo(A1.X(0),A1.Y(v(0)));c.lineTo(A1.X(tmax),A1.Y(v(tmax)));c.stroke();
    c.strokeStyle=P.ink;c.lineWidth=1.5;c.setLineDash([4,4]);c.beginPath();c.moveTo(A1.X(T),A1.Y(0));c.lineTo(A1.X(T),A1.Y(v(T)));c.stroke();c.setLineDash([]);
    txt(c,'Fläche = Weg s',A1.X(T*0.62),A1.Y(v(T)*0.25),{size:11,col:P.negdeep||P.neg,weight:700});
    const A2=plotAxes(c,Object.assign({},Rb,{xmax:tmax,ymax:smax,dx:.5,dy:cst?.2:.3,yl:'s in m',ycol:P.neg,fs:11}));
    c.strokeStyle=P.neg;c.lineWidth=3;c.beginPath();for(let k=0;k<=60;k++){const t=T*k/60;const x=A2.X(t),y=A2.Y(Math.min(s(t),smax));k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
    c.globalAlpha=.25;c.beginPath();for(let k=0;k<=60;k++){const t=tmax*k/60;const x=A2.X(t),y=A2.Y(Math.min(s(t),smax));k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();c.globalAlpha=1;
    circ(c,A2.X(T),A2.Y(Math.min(s(T),smax)),5,P.neg);
    if(showM&&!cst){d.t.forEach((t,i)=>cross(c,A2.X(t),A2.Y(S_POS[i]),P.ink,6));}
    const lab=cst?`t = ${dec(T,2)} s   v = 0,40 m/s   s = v·t = ${dec(s(T),2)} m`:`t = ${dec(T,2)} s   v = ${dec(v(T),2)} m/s   s = ½·t·v = ${dec(s(T),2)} m`;
    rr(c,40,6,560,28,8);c.fillStyle=P.surface;c.fill();c.strokeStyle=P.line;c.lineWidth=1;c.stroke();txt(c,lab,320,20,{size:13,col:P.ink,weight:600});

/* ---------- Simulation: drei Diagramme gleichzeitig ---------- */
function trioSim(host,o){o=o||{};const H=360;let mode=o.mode||'acc',big=!!o.big;
  const st=makeStage(host,{h:H,hint:o.still?'':'Wähle die Bewegung und drück „Start“.'});let T=o.still?2.5:0,run=!o.still;const dt=clock();
  if(!o.still){seg(st.ctrl,'Bewegung',[['acc','beschleunigt'],['const','gleichförmig']],mode,v=>{mode=v;T=0;run=false;});
    seg(st.ctrl,'a',[[false,'klein'],[true,'groß']],big,v=>{big=v;T=0;run=false;});sbtn(st.ctrl,'▶ Start',()=>{T=0;run=true;});}
  const R={x0:60,y0:40,x1:580,y1:100,len:1.6,floor:120};
  const aV=()=>mode==='const'?0:(big?.7:.35),v0=()=>mode==='const'?.5:0;
  const sF=t=>Math.min(R.len,v0()*t+.5*aV()*t*t),vF=t=>(sF(t)>=R.len-1e-6?NaN:v0()+aV()*t);
  st.loop(()=>{const c=st.ctx;c.clearRect(0,0,W,H);if(run){T+=dt();if(T>=2.5){T=2.5;run=false;}}else dt();
    const ang=drawRamp(c,R);const q=rampPt(R,sF(T));drawCart(c,q.x,q.y,ang);
    const boxes=[{x0:40,yl:'s in m',ycol:P.neg,ymax:1.6,f:sF,col:P.neg,dy:.4},{x0:250,yl:'v in m/s',ycol:P.pos,ymax:1.6,f:t=>{const s=sF(t);return s>=R.len-1e-6?null:v0()+aV()*t;},col:P.pos,dy:.4},{x0:460,yl:'a in m/s²',ycol:P.golddeep,ymax:1,f:t=>sF(t)>=R.len-1e-6?null:aV(),col:P.gold,dy:.25}];
    boxes.forEach(b=>{const A=plotAxes(c,{x0:b.x0,y0:330,w:150,h:150,xmax:2.5,ymax:b.ymax,dx:.5,dy:b.dy,yl:b.yl,ycol:b.ycol,fs:10,xd:0,yd:1,ticks:false});
      c.strokeStyle=b.col;c.lineWidth=3.2;c.beginPath();let on=false;for(let k=0;k<=80;k++){const t=T*k/80;const y=b.f(t);if(y==null||isNaN(y)){on=false;continue;}const X=A.X(t),Y=A.Y(y);on?c.lineTo(X,Y):c.moveTo(X,Y);on=true;}c.stroke();});
    txt(c,mode==='const'?'gleichförmig: v = 0,50 m/s':'gleichmäßig beschleunigt aus dem Stand: a = '+dec(aV(),2)+' m/s²',320,20,{size:13,col:P.ink,weight:600});
  });
  return{destroy:st.destroy};
}

const FONT_ITAL=/[A-Za-zλεµℓ]/;
function fmlLayout(c,items,sz){let w=0,asc=sz*.75,desc=sz*.25;const parts=[];
  const font=(it,s)=>`${it?'italic ':''}${s}px "Times New Roman",Times,"Liberation Serif",serif`;
  items.forEach(it=>{
    if(typeof it==='string'){[...it].forEach(ch=>{const ital=FONT_ITAL.test(ch);c.font=font(ital,sz);const cw=ch===' '?sz*.28:c.measureText(ch).width+(ital?sz*.03:0);parts.push({k:'ch',ch,ital,x:w,sz});w+=cw;});}
    else if(it.sub!=null){c.font=font(false,sz*.62);const cw=c.measureText(it.sub).width;parts.push({k:'sub',ch:it.sub,x:w,sz:sz*.62});w+=cw+sz*.04;desc=Math.max(desc,sz*.4);}
    else if(it.f){const n=fmlLayout(c,it.f[0],sz*.92),d=fmlLayout(c,it.f[1],sz*.92);const fw=Math.max(n.w,d.w)+sz*.3;const gap=sz*.14,axis=sz*.3;
      parts.push({k:'frac',n,d,x:w,fw,gap,axis,sz});asc=Math.max(asc,axis+gap+n.desc+n.asc);desc=Math.max(desc,-axis+gap+d.asc+d.desc);w+=fw+sz*.08;}
    else if(it.r){const b=fmlLayout(c,it.r,sz);const rw=sz*.62;parts.push({k:'root',b,x:w,rw,sz});asc=Math.max(asc,b.asc+sz*.16);desc=Math.max(desc,b.desc+sz*.06);w+=rw+b.w+sz*.12;}
  });
  return{w,asc,desc,parts,font};}
function fmlDraw(c,L,x,y,col){L.parts.forEach(p=>{
  if(p.k==='ch'){c.font=L.font(p.ital,p.sz);c.fillStyle=col;c.fillText(p.ch,x+p.x,y);}
  else if(p.k==='sub'){c.font=L.font(false,p.sz);c.fillStyle=col;c.fillText(p.ch,x+p.x,y+p.sz*.35);}
  else if(p.k==='frac'){const yb=y-p.axis;c.fillStyle=col;c.fillRect(x+p.x,yb-p.sz*.03,p.fw,Math.max(1.5,p.sz*.055));
    fmlDraw(c,p.n,x+p.x+(p.fw-p.n.w)/2,yb-p.gap-p.n.desc,col);fmlDraw(c,p.d,x+p.x+(p.fw-p.d.w)/2,yb+p.gap+p.d.asc,col);}
  else if(p.k==='root'){const top=y-p.b.asc-p.sz*.12,bot=y+p.b.desc,x0=x+p.x;c.strokeStyle=col;c.lineWidth=Math.max(1.5,p.sz*.055);c.lineJoin='round';
    c.beginPath();c.moveTo(x0,y-p.sz*.25);c.lineTo(x0+p.rw*.28,y-p.sz*.32);c.lineTo(x0+p.rw*.55,bot);c.lineTo(x0+p.rw*.92,top);c.lineTo(x0+p.rw+p.b.w+p.sz*.1,top);c.stroke();
    fmlDraw(c,p.b,x0+p.rw+p.sz*.04,y,col);}
});}
const FMLC=new Map();
function fmlImage(key,col,sz){col=col||'#14223a';sz=sz||56;const ck=key+col+sz;if(FMLC.has(ck))return FMLC.get(ck);
  const m=document.createElement('canvas').getContext('2d');const L=fmlLayout(m,FML[key],sz);const pad=sz*.2;
  const cv=document.createElement('canvas');cv.width=Math.ceil(L.w+2*pad);cv.height=Math.ceil(L.asc+L.desc+2*pad);const c=cv.getContext('2d');
  if(col==='#14223a'){c.fillStyle='#ffffff';c.fillRect(0,0,cv.width,cv.height);}
  c.textBaseline='alphabetic';fmlDraw(c,L,pad,pad+L.asc,col);const r={url:cv.toDataURL('image/png'),w:cv.width,h:cv.height};FMLC.set(ck,r);return r;}
function fillFml(root){(root||document).querySelectorAll('.fml:not(.done)').forEach(el=>{const k=el.dataset.f;if(!FML[k])return;el.classList.add('done');
  const im=fmlImage(k,P.ink,56);const img=document.createElement('img');img.src=im.url;img.alt=k;img.style.height=(im.h/2.2)+'px';img.style.verticalAlign='middle';el.append(img);});}

g1:{title:'Galileis Glockenrinne',icon:'bell',cards:[
 {t:'info',title:'Ein Rätsel aus dem Jahr 1604',sim:{type:'ramp',lock:true},html:'<p>Galileo Galilei wollte wissen, wie ein Körper beim Herunterrollen schneller wird. Uhren, die Sekundenbruchteile messen, gab es noch nicht. Also hängte er kleine <b>Glocken</b> über eine schiefe Rinne. Die rollende Kugel hat sie im Vorbeirollen angestoßen.</p><p>Hier hängen die Glocken in <b>gleichen Abständen</b>: 20, 40, 60, 80 cm. Drück auf Start und hör hin. Achte auch auf die violetten Punkte auf dem Zeitstrahl.</p>'},
 {t:'mc',q:'Die Glocken hängen in gleichen Abständen. Was hörst du?',sim:{type:'ramp',lock:true},opts:['Die Glocken klingen immer schneller hintereinander.','Die Glocken klingen im gleichmäßigen Takt.','Die Glocken klingen immer langsamer hintereinander.'],a:0,why:'Zwischen den Glocken liegt jedes Mal dieselbe Strecke. Der Wagen braucht dafür aber immer weniger Zeit.'},
 {t:'mc',q:'Was sagt das über den Wagen aus?',opts:['Er wird immer schneller.','Er fährt die ganze Zeit gleich schnell.','Er wird langsamer.'],a:0,why:'Für dieselbe Strecke braucht er immer weniger Zeit. Also wird er schneller.'},
 {t:'tf',claim:'Auf der schiefen Ebene wird der Wagen erst schneller und fährt dann irgendwann gleich schnell weiter.',ok:false,why:'Solange die Bahn geneigt ist, zieht ein Teil der Gewichtskraft den Wagen nach unten. Er wird also bis ganz unten immer schneller. Das prüft ihr gleich mit dem Sensor.'},
 {t:'poll',q:'Galileis Frage an euch: Wo müssen die Glocken hängen, damit sie im gleichmäßigen Takt klingen?',opts:['wie jetzt, in gleichen Abständen','die Abstände müssen nach unten immer größer werden','die Abstände müssen nach unten immer kleiner werden']}
]},
g2:{title:'Was ist Beschleunigung?',icon:'bolt',cards:[
 {t:'info',title:'Schneller werden – aber wie schnell?',html:'<p>Lea fährt an der Ampel mit dem Fahrrad los. Ihr Tacho zeigt:</p><table class="mini"><tr><th>t in s</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>v in m/s</th><td>0</td><td>1,5</td><td>3,0</td><td>4,5</td><td>6,0</td></tr></table><p>In jeder Sekunde wird Lea um 1,5 m/s schneller. Genau das ist die <b>Beschleunigung a</b>: Sie sagt, um wie viel sich die Geschwindigkeit pro Sekunde ändert.</p><p>'+F('adef')+'</p><p>Einheit: (m/s) : s = <b>m/s²</b>. Bei Lea ist a = 1,5 m/s².</p>'},
 {t:'mc',q:'Was bedeutet a = 2 m/s²?',opts:['In jeder Sekunde wird der Körper um 2 m/s schneller.','Der Körper fährt 2 Meter pro Sekunde.','Der Körper legt in jeder Sekunde 2 m mehr zurück als vorher.'],a:0,why:'a sagt, wie stark sich die Geschwindigkeit pro Sekunde ändert. Mit dem Weg hat die Zahl erst mal nichts zu tun.'},
 {t:'tf',claim:'Ein Auto, das gerade mit 200 km/h über die Autobahn fährt, hat eine große Beschleunigung.',ok:false,why:'Fährt es konstant 200 km/h, ändert sich die Geschwindigkeit nicht. Dann ist a = 0. Schnell sein und schneller werden ist nicht dasselbe.'},
 {t:'who',q:'Ein Kleinwagen braucht 12 s von 0 auf 100 km/h, ein Sportwagen nur 4 s. Wer hat die größere Beschleunigung?',people:[['Ali','Beide gleich. Am Ende fahren ja beide 100 km/h.'],['Lena','Der Sportwagen. Er schafft dieselbe Geschwindigkeitsänderung in kürzerer Zeit.'],['Tim','Der Kleinwagen, weil er länger beschleunigt.']],a:1,why:'Gleiches Δv, aber kleineres Δt. Damit ist '+F('adef')+' beim Sportwagen dreimal so groß.'},
 {t:'num',q:'Der Sportwagen kommt in 4,0 s von 0 auf 28 m/s (≈ 100 km/h). Berechne seine Beschleunigung.',intro:'<p>'+F('adef')+'</p>',a:7,unit:'m/s²',why:'a = 28 m/s : 4,0 s = 7,0 m/s². Er wird in jeder Sekunde um 7 m/s schneller.'}

      if(ok){L.done.add(idx);updateBar();L.phase='next';setFoot(`<strong>Richtig!</strong><span>${card.why}</span>`,'Weiter',true,'ok');}
      else setFoot(`<strong>Noch nicht.</strong><span>Tipp: ${card.hint}</span>`,'Nochmal prüfen',true,'bad');};return;}
}
function finishLesson(){
  const lv=L.lv,correct=Object.values(L.first).reduce((a,b)=>a+b,0),tot=lv.total;const pct=tot?correct/tot:1;const xp=correct*10+20;
  const p=prog.levels[L.id];if(!p||correct>p.best||!p.done)prog.levels[L.id]={best:Math.max(correct,p?p.best:0),xp:Math.max(xp,p?p.xp:0),done:true};save();
  $('#l-bar').style.width='100%';
  const body=$('#l-body');body.innerHTML=`<div class="l-inner"><div class="result">${pct>=.9?CASTLE.replace('class="cs"','class="cs" style="width:90px;height:82px"'):''}<h2>${pct>=.9?'Level geschafft!':'Level beendet'}</h2>
    <div class="stats"><div class="stat gold"><b>+${xp}</b><span>XP</span></div><div class="stat green"><b>${Math.round(pct*100)} %</b><span>beim ersten Versuch richtig</span></div></div>
    <p class="hint">${pct>=.9?'Super, weiter so!':'Für das Schloss brauchst du insgesamt 90 %. Du kannst dieses Level jederzeit wiederholen.'}</p>
    <button class="ghost" id="again">Level wiederholen</button></div></div>`;
  $('#again').onclick=()=>openLesson(L.id);
  L.phase='result';setFoot('','Zurück zum Pfad',true,pct>=.9?'ok':'');
}

renderPath();

/* ===== Anbindung an die Klassen-App (ohne Namen!) ===== */
if(window.AppBridge){
  setTimeout(()=>{appLive=true;},1500);
  AppBridge.register({
    getState(){
      const t=totals(),details={},nm=id=>NAMES[id]||LEVELS[id].title;
      ORDER.forEach(id=>{const p=prog.levels[id];details[nm(id)]=p&&p.done?('geschafft · '+p.best+' von '+LEVELS[id].total+' richtig'):'offen';});
      return{punkte:t.xp,stationen:ORDER.map(nm),erledigt:ORDER.filter(isDone).map(nm),details,
        daten:{levels:JSON.parse(JSON.stringify(prog.levels)),data:prog.data||null}};
    },
    setState(s){const d=s&&s.daten;if(!d||!d.levels)return;
      prog.levels=d.levels;if(d.data)prog.data=d.data;delete prog.cur;appLive=true;save();if(!L)renderPath();}
  });
}
</script>
</body></html>
