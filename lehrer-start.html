<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Physik Lehrer · Klasse wählen</title>
<link rel="manifest" href="lehrer.webmanifest">
<link rel="icon" href="icons/lehrer-192.png">
<meta name="theme-color" content="#1F3A5F">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F2F5F8;--panel:#fff;--ink:#15253A;--muted:#58697C;--line:#D3DCE6;--navy:#1F3A5F;--green:#3C7A4E;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px}
h1{font-family:var(--f-display);font-weight:800;font-size:36px;color:var(--navy);margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
a.kl{display:flex;align-items:center;gap:16px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);min-height:96px}
a.kl:hover,a.kl:focus-visible{border-color:var(--navy);outline:none}
a.kl img{width:60px;height:60px;border-radius:14px;flex:none}
a.kl b{display:block;font-family:var(--f-display);font-size:22px;color:var(--navy)}
a.kl span{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Physik · Auswertung</h1>
  <p>Klasse wählen. Jede Klasse hat ihre eigenen Daten und Sicherungen.</p>
  <div class="grid">
    <a class="kl" href="lehrer.html"><img src="icons/icon-192.png" alt=""><div><b>TG2</b><span>Physik App TG2</span></div></a>
    <a class="kl" href="tge/lehrer.html"><img src="tge/icons/tge-192.png" alt=""><div><b>TGE</b><span>Physik App TGE</span></div></a>
    <a class="kl" href="sgge/lehrer.html"><img src="sgge/icons/sgge-192.png" alt=""><div><b>SGGE</b><span>Physik App SGGE</span></div></a>
    <a class="kl" href="bfs2/lehrer.html"><img src="bfs2/icons/bfs2-192.png" alt=""><div><b>BFS2</b><span>Physik App BFS2</span></div></a>
  </div>
</div>
</body>
</html>
